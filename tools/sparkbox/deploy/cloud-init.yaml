#cloud-config
# Zero-touch sparkbox host provisioning. This is a TEMPLATE: deploy/launch-host.sh
# fills the double-at placeholder tokens (secrets + release) and passes the
# result as baremetal user-data. It fetches PREBUILT artifacts from Object Storage
# (seconds) instead of building from source (minutes) — see hack/build-artifacts.sh.
#
# Secrets injected here (never stored in the artifact bucket):
#   - your laptop pubkey (users.conf)
#   - the FLEET gateway host + upstream PRIVATE keys (base64), whose public
#     halves are baked into the rootfs so every sandbox trusts the gateway.
#   - the FLEET OIDC signing key (base64): the ES256 key every sandbox's
#     identity token is signed with. It is fleet-wide so the issuer keeps the
#     same JWKS across host rebuilds and relying parties never re-onboard.

package_update: true
packages:
  - curl
  - xfsprogs
  - iptables
  - ca-certificates
  - zstd

write_files:
  - path: /srv/sparkbox/users.conf
    permissions: '0644'
    content: |
      @@USERS_CONF@@

  # 0600: holds the operator-console password and the Cloudflare token, so
  # keep it off world-read. CLOUDFLARE_API_TOKEN (Zone.DNS:Edit) enables
  # per-sandbox AAAA publishing for hostname SSH routing — and DNS-01 wildcard
  # TLS if TLS_FLAGS selects the cloudflare provider; empty disables both.
  - path: /srv/sparkbox/sparkbox.env
    permissions: '0600'
    content: |
      PROXY_DOMAIN=@@PROXY_DOMAIN@@
      SUBNET6_FLAG=@@SUBNET6_FLAG@@
      SPARKBOX_CONSOLE_PASSWORD=@@CONSOLE_PASSWORD@@
      CLOUDFLARE_API_TOKEN=@@CLOUDFLARE_API_TOKEN@@
      TLS_FLAGS=@@TLS_FLAGS@@

  # Staged OUTSIDE /srv/sparkbox/data — the provision script mounts the XFS
  # volume there, which would otherwise shadow anything write_files put under
  # it. The script copies these into data/state after mounting.
  - path: /srv/sparkbox/keys/gateway_host_key.pem
    permissions: '0600'
    encoding: b64
    content: @@GATEWAY_HOST_KEY_B64@@

  - path: /srv/sparkbox/keys/gateway_upstream_key.pem
    permissions: '0600'
    encoding: b64
    content: @@GATEWAY_UPSTREAM_KEY_B64@@

  # ES256 (P-256) key that signs sandbox identity tokens. Fleet-wide, like the
  # gateway keys: rebuild a host and the issuer's JWKS is unchanged, so nobody
  # has to re-onboard a service account.
  - path: /srv/sparkbox/keys/oidc_signing_key.pem
    permissions: '0600'
    encoding: b64
    content: @@OIDC_SIGNING_KEY_B64@@

  # Host-side agent-CLI refresher (deploy/refresh-agent-tools.sh, injected as
  # b64 by launch-host.sh): patches claude+codex into the rootfs templates in
  # seconds instead of rebuilding the image. Run at provision + daily by timer.
  - path: /usr/local/sbin/sparkbox-refresh-tools.sh
    permissions: '0755'
    encoding: b64
    content: @@REFRESH_TOOLS_B64@@

  # Guest workload-identity installer, called by the refresher above (and by
  # hack/build-rootfs.sh at bake time — one source of truth for both).
  - path: /usr/local/sbin/sparkbox-install-guest-identity.sh
    permissions: '0755'
    encoding: b64
    content: @@GUEST_IDENTITY_B64@@

  # Host packet-filter rules (deploy/sparkbox-net.sh). Applied by the unit below
  # on every boot — cloud-init's runcmd is per-instance, so rules set there would
  # vanish on the first reboot and take sandbox egress with them.
  - path: /usr/local/sbin/sparkbox-net.sh
    permissions: '0755'
    encoding: b64
    content: @@NET_SETUP_B64@@

  - path: /etc/systemd/system/sparkbox-net.service
    permissions: '0644'
    content: |
      [Unit]
      Description=sparkbox host packet-filter rules (sandbox NAT + metadata port)
      # After network: the script derives the uplink from the default route.
      # Before sparkbox: no sandbox should exist before its egress path does.
      After=network-online.target
      Wants=network-online.target
      Before=sparkbox.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/sparkbox-net.sh

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/sparkbox-refresh-tools.service
    permissions: '0644'
    content: |
      [Unit]
      Description=refresh agent CLIs (claude, codex) in sparkbox rootfs templates
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/sparkbox-refresh-tools.sh

  - path: /etc/systemd/system/sparkbox-refresh-tools.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=daily agent-CLI refresh for sparkbox rootfs templates

      [Timer]
      OnCalendar=daily
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/sparkbox.service
    permissions: '0644'
    content: |
      [Unit]
      Description=sparkbox agentic sandbox gateway (SSH + HTTP proxy + firecracker)
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/dev/kvm

      [Service]
      Type=simple
      EnvironmentFile=/srv/sparkbox/sparkbox.env
      User=root
      ExecStart=/usr/local/bin/sparkbox serve --driver firecracker \
        --state-dir /srv/sparkbox/data/state \
        --kernel /srv/sparkbox/vmlinux \
        --image-dir /srv/sparkbox/data/images \
        --users /srv/sparkbox/users.conf \
        --ssh-addr :22 --api-addr 127.0.0.1:8080 \
        --proxy-addr :8081 --proxy-domain ${PROXY_DOMAIN} $SUBNET6_FLAG $TLS_FLAGS
      Restart=always
      RestartSec=2
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/sparkbox-provision.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Fetch + verify a sparkbox artifact release and bring the host up.
      set -euxo pipefail
      BASE=@@BUCKET_BASE@@
      RELEASE=@@RELEASE@@
      DIR=/srv/sparkbox

      [ -e /dev/kvm ] || { echo "no /dev/kvm — not a KVM host"; exit 1; }

      # Resolve "latest" to a concrete release tag.
      if [ "$RELEASE" = latest ]; then
        RELEASE=$(curl -fsSL "$BASE/latest.env" | sed -n 's/^RELEASE=//p')
      fi
      REL="$BASE/releases/$RELEASE"

      # XFS reflink volume so per-sandbox rootfs copies are instant CoW clones.
      # Sparse (grows on use), sized for the codex-universal era: the template
      # alone is ~30GB real blocks, plus per-sandbox write deltas and memory
      # snapshot files (MemMB each). EM-B220E-NVME has ~1TB of NVMe.
      mkdir -p "$DIR/data"
      if ! mountpoint -q "$DIR/data"; then
        if [ ! -f "$DIR/data.img" ]; then
          truncate -s 300G "$DIR/data.img"
          mkfs.xfs -q -m reflink=1 "$DIR/data.img"
        fi
        mount -o loop "$DIR/data.img" "$DIR/data"
        grep -q "$DIR/data.img" /etc/fstab || \
          echo "$DIR/data.img $DIR/data xfs loop 0 0" >> /etc/fstab
      fi
      mkdir -p "$DIR/data/state" "$DIR/data/images"

      # Move the staged fleet gateway keys into the (now-mounted) state dir.
      # They were written outside the mount so it wouldn't shadow them.
      install -m 600 "$DIR/keys/gateway_host_key.pem"     "$DIR/data/state/gateway_host_key.pem"
      install -m 600 "$DIR/keys/gateway_upstream_key.pem" "$DIR/data/state/gateway_upstream_key.pem"
      install -m 600 "$DIR/keys/oidc_signing_key.pem"     "$DIR/data/state/oidc_signing_key.pem"

      # Fetch manifest, then each artifact, verifying sha256.
      curl -fsSL "$REL/manifest.env" -o "$DIR/manifest.env"
      . "$DIR/manifest.env"
      fetch() { curl -fsSL "$1" -o "$2"; echo "$3  $2" | sha256sum -c -; }
      fetch "$REL/vmlinux"        "$DIR/vmlinux"              "$SHA256_VMLINUX"
      fetch "$REL/firecracker"    /usr/local/bin/firecracker  "$SHA256_FIRECRACKER"
      fetch "$REL/sparkbox"       /usr/local/bin/sparkbox     "$SHA256_SPARKBOX"
      chmod +x /usr/local/bin/firecracker /usr/local/bin/sparkbox
      # The manifest names the rootfs template (ROOTFS_NAME) and where it lives
      # in the bucket (ROOTFS_PATH, bucket-relative — content-addressed under
      # rootfs/<key>/ so unchanged templates are shared across releases).
      # Fallbacks cover manifests predating each field: per-release .gz path,
      # SHA256_ROOTFS_GZ, and ubuntu.ext4 from before the codex-universal base.
      # Decompress keys off the extension: new releases ship .zst (~5x faster
      # to unpack than the ~30GB gunzip, the old long pole of provisioning).
      ROOTFS_NAME=${ROOTFS_NAME:-ubuntu}
      ROOTFS_PATH=${ROOTFS_PATH:-releases/$RELEASE/$ROOTFS_NAME.ext4.gz}
      SHA256_ROOTFS=${SHA256_ROOTFS:-${SHA256_ROOTFS_GZ:-}}
      ROOTFS_FILE="$DIR/data/images/$(basename "$ROOTFS_PATH")"
      fetch "$BASE/$ROOTFS_PATH" "$ROOTFS_FILE" "$SHA256_ROOTFS"
      case "$ROOTFS_FILE" in
        *.zst) zstd -d -f --rm "$ROOTFS_FILE" ;;
        *)     gunzip -f "$ROOTFS_FILE" ;;
      esac

      # Bake up-to-date agent CLIs (claude, codex) into the fresh template.
      # --force: the template was just replaced, so ignore any version stamp.
      # Best-effort — a download hiccup shouldn't fail provisioning; the daily
      # timer (enabled below) retries.
      /usr/local/sbin/sparkbox-refresh-tools.sh --force \
        || echo "WARN: agent tools refresh failed; timer will retry"

      # Pin any reserved (flexible) IPs on the primary NIC so DNS stays stable
      # across host rebuilds. launch-host.sh attaches them to the server (they
      # route to its NIC); here we merge them into cloud-init's netplan config
      # (interface id "eth0") as static addresses — DHCP still owns the default
      # IP/route, and netplan re-applies these on every boot.
      FLEXIBLE_ADDRS="@@FLEXIBLE_ADDRS@@"
      if [ -n "$FLEXIBLE_ADDRS" ]; then
        { echo "network:"; echo "  version: 2"; echo "  ethernets:"; \
          echo "    eth0:"; echo "      addresses:"; \
          for a in $FLEXIBLE_ADDRS; do echo "        - \"$a\""; done; \
        } > /etc/netplan/99-sparkbox-flexible.yaml
        chmod 600 /etc/netplan/99-sparkbox-flexible.yaml
        netplan apply || true
      fi

      # Free port 22 for the sandbox gateway by moving the host's own admin
      # sshd to :2222. Ubuntu 24.04 socket-activates ssh, so a bare `Port` in
      # sshd_config is ignored while ssh.socket owns the listener — disable the
      # socket and run ssh.service with an explicit Port instead. Must happen
      # before sparkbox.service starts, or the gateway can't bind :22. (Admin in:
      # `ssh -p 2222 ubuntu@<native-ip>`.)
      printf 'Port 2222\n' > /etc/ssh/sshd_config.d/sparkbox-admin-port.conf
      systemctl disable --now ssh.socket 2>/dev/null || true
      systemctl enable ssh.service 2>/dev/null || true
      systemctl restart ssh.service 2>/dev/null || systemctl restart ssh || true

      # Kernel networking knobs, written to /etc/sysctl.d so they reapply on
      # every boot (this script runs once, at first boot only):
      #   ip_forward       — route sandbox traffic between taps and the uplink.
      #   v6 forwarding    — with --subnet6 each sandbox gets a routable /128 and
      #                      egresses without NAT (harmless to enable when unset).
      #   rp_filter strict — the metadata service identifies a caller by source
      #                      address and the host forwards between taps, so a
      #                      guest must not be able to source-spoof a neighbour.
      #                      The driver sets this per-tap as each is created;
      #                      this covers the host default too.
      cat > /etc/sysctl.d/99-sparkbox.conf <<'SYSCTL'
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.default.rp_filter=1
      SYSCTL
      sysctl -q --system

      systemctl daemon-reload
      # The iptables rules themselves live in sparkbox-net.service, which
      # reapplies them on every boot — see the unit above.
      systemctl enable --now sparkbox-net.service
      systemctl enable --now sparkbox-refresh-tools.timer
      systemctl enable --now sparkbox.service
      echo "sparkbox provisioned from release $RELEASE"

runcmd:
  - [ bash, /usr/local/sbin/sparkbox-provision.sh ]
