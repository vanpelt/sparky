#cloud-config
# Zero-touch sparkbox host provisioning. This is a TEMPLATE: deploy/launch-host.sh
# fills the double-at placeholder tokens (config + one bootstrap key) and passes
# the result as baremetal user-data. It fetches PREBUILT artifacts from Object
# Storage (seconds) instead of building from source. LEGACY: this Scaleway path
# still expects the old bucket layout; the current release path is GitHub
# Releases via `sparkbox setup` (see .github/workflows/build-artifacts.yml).
#
# Fleet secrets NO LONGER ride in this user-data. The three private keys (gateway
# host + upstream, OIDC signing) and the two passwords (console, Cloudflare) live
# in Scaleway Secret Manager under /sparkbox/fleet; sparkbox-secrets.service fetches
# them into tmpfs (/run/sparkbox) on every boot, before sparkbox starts. The ONLY
# secret still in user-data is the host's Secret Manager API key (/etc/sparkbox/
# fetch.env), which launch-host.sh mints per host, pins to this box's IP, scopes to
# SecretManagerSecretAccess, and expires — so a leaked user-data is near-worthless.
# Injected in the clear here: your laptop pubkey (users.conf) and non-secret config.

package_update: true
packages:
  - curl
  - xfsprogs
  - iptables
  - ca-certificates
  - zstd
  - unzip
  # archive/snapshot: fsck + zero free space before compression; rclone ships
  # archives to object storage (needs S3 WRITE creds in the host's rclone.conf —
  # see docs/resource-model-design.md Part 8; archiving is off until configured).
  # rclone itself is installed in runcmd, not here: apt's rclone (~1.60) 501s on
  # Cloudflare R2 uploads, so we fetch a current static binary instead.
  - e2fsprogs
  - zerofree

write_files:
  - path: /srv/sparkbox/users.conf
    permissions: '0644'
    content: |
      @@USERS_CONF@@

  # Non-secret host config only. The console password and Cloudflare token used
  # to live here; they now come from Secret Manager into /run/sparkbox/secrets.env
  # (fetched by sparkbox-secrets.service), which sparkbox.service also reads.
  - path: /srv/sparkbox/sparkbox.env
    permissions: '0644'
    content: |
      PROXY_DOMAIN=@@PROXY_DOMAIN@@
      GUEST_SUBNET_FLAG=
      TRANSPORT_FLAGS=--node-control-transport=ssh --node-control-rollout=inherit --guest-data-transport=ssh --routed-guest-canary-percent=0
      SUBNET6_FLAG=@@SUBNET6_FLAG@@
      EDGE_V4_FLAG=@@EDGE_V4_FLAG@@
      OVERCOMMIT_FLAGS=@@OVERCOMMIT_FLAGS@@
      TLS_FLAGS=@@TLS_FLAGS@@
      GATEWAY_FLAG=
      EXTRA_FLAGS=
      # Bare values (not the flag form) so sparkbox-net.service can source them:
      # the v6 any-port REDIRECT only fires when SUBNET6 is in the unit's env, and
      # PROXY_PORT must match the edge listener (:443 under TLS, :8081 otherwise).
      SUBNET6=@@SUBNET6@@
      SPARKBOX_GUEST_SUBNET=172.30.0.0/16
      PROXY_PORT=@@PROXY_PORT@@

  # The one secret still in user-data: this host's Secret Manager API key, used
  # ONLY by sparkbox-secrets.service to fetch the fleet secrets. It is IP-pinned,
  # scoped to SecretManagerSecretAccess, and expiring (see mint-host-identity.sh),
  # so a leak of this file is near-worthless off this box.
  - path: /etc/sparkbox/fetch.env
    permissions: '0600'
    content: |
      SCW_SECRET_KEY=@@SCW_SECRET_KEY@@
      SCW_DEFAULT_PROJECT_ID=@@SCW_PROJECT_ID@@
      SCW_DEFAULT_REGION=@@SCW_REGION@@

  # Host-side agent-CLI refresher (deploy/refresh-agent-tools.sh, injected as
  # b64 by launch-host.sh): patches claude+codex+pi+hivemind into the rootfs
  # templates in seconds instead of rebuilding the image. Run at provision +
  # daily by timer.
  - path: /usr/local/sbin/sparkbox-refresh-tools.sh
    permissions: '0755'
    encoding: b64
    content: @@REFRESH_TOOLS_B64@@

  # Guest workload-identity installer, called by the refresher above (and by
  # hack/build-rootfs.sh at bake time — one source of truth for both).
  - path: /usr/local/sbin/sparkbox-install-guest-identity.sh
    permissions: '0755'
    encoding: b64
    content: @@GUEST_IDENTITY_B64@@

  # Host packet-filter rules (deploy/sparkbox-net.sh). Applied by the unit below
  # on every boot — cloud-init's runcmd is per-instance, so rules set there would
  # vanish on the first reboot and take sandbox egress with them.
  - path: /usr/local/sbin/sparkbox-net.sh
    permissions: '0755'
    encoding: b64
    content: @@NET_SETUP_B64@@

  - path: /etc/systemd/system/sparkbox-net.service
    permissions: '0644'
    content: |
      [Unit]
      Description=sparkbox host packet-filter rules (sandbox NAT + metadata port)
      # After network: the script derives the uplink from the default route.
      # Before sparkbox: no sandbox should exist before its egress path does.
      After=network-online.target
      Wants=network-online.target
      Before=sparkbox.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # SUBNET6 (enables the v6 REDIRECT branch) + PROXY_PORT (edge listener) live
      # here; without this the script sees neither and only v4 any-port forwards.
      EnvironmentFile=/srv/sparkbox/sparkbox.env
      ExecStart=/usr/local/sbin/sparkbox-net.sh

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/sparkbox-refresh-tools.service
    permissions: '0644'
    content: |
      [Unit]
      Description=refresh agent CLIs (claude, codex, pi, hivemind) in sparkbox rootfs templates
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      # Keep these explicit and aligned with hostsetup.DefaultConfig. Otherwise
      # a later `sparkbox setup` rewrites this unit with a different tool-cache
      # path and needlessly downloads every agent CLI again.
      Environment=IMAGES_DIR=/srv/sparkbox/data/images
      Environment=TOOLS_DIR=/srv/sparkbox/tools
      ExecStart=/usr/local/sbin/sparkbox-refresh-tools.sh

  - path: /etc/systemd/system/sparkbox-refresh-tools.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=daily agent-CLI refresh for sparkbox rootfs templates

      [Timer]
      OnCalendar=daily
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target

  # Hydrate fleet secrets from Secret Manager into tmpfs before sparkbox starts.
  # Runs on every boot: /run is cleared on reboot, so the keys must be re-fetched.
  # If this fails (e.g. the IP pin rejects us), sparkbox.service does not start —
  # fail closed, and journalctl -u sparkbox-secrets shows Scaleway's reason.
  - path: /etc/systemd/system/sparkbox-secrets.service
    permissions: '0644'
    content: |
      [Unit]
      Description=fetch sparkbox fleet secrets from Scaleway Secret Manager into tmpfs
      After=network-online.target
      Wants=network-online.target
      Before=sparkbox.service
      # Retry indefinitely: at first boot the just-minted IAM key can 403 for up
      # to ~60s while the policy propagates. Without this, systemd's default rate
      # limit (5 starts/10s) trips and gives up before propagation completes.
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=/etc/sparkbox/fetch.env
      ExecStart=/usr/local/bin/sparkbox fetch-secrets \
        --path /sparkbox/fleet \
        --key-dir /run/sparkbox/keys \
        --env-out /run/sparkbox/secrets.env
      # Boot-time network races Scaleway's eventual consistency on a just-minted
      # key; the fetch retries internally, and systemd retries the unit too.
      Restart=on-failure
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/sparkbox.service
    permissions: '0644'
    content: |
      [Unit]
      Description=sparkbox agentic sandbox gateway (SSH + HTTP proxy + firecracker)
      After=network-online.target sparkbox-secrets.service
      # Want (not Require) the fetch: a hard Requires= permanently fails this unit
      # if the fetch is briefly down at boot, and systemd won't retroactively
      # start us when it later succeeds. With Wants=+After=, we start after the
      # fetch attempt; if keys aren't there yet, --require-keys exits us and
      # Restart=always retries every 2s until sparkbox-secrets (Restart=on-failure)
      # has written them. Fail-closed and self-healing, no manual intervention.
      Wants=network-online.target sparkbox-secrets.service
      ConditionPathExists=/dev/kvm
      # Don't let the restart loop (below) trip systemd's default start-rate
      # limit while we wait for sparkbox-secrets to write the keys into /run.
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      # Non-secret config, then the fetched secrets (console password, Cloudflare
      # token). The `-` tolerates the file's brief absence; Requires= orders it.
      EnvironmentFile=/srv/sparkbox/sparkbox.env
      EnvironmentFile=-/run/sparkbox/secrets.env
      User=root
      ExecStart=/usr/local/bin/sparkbox serve --driver firecracker \
        --state-dir /srv/sparkbox/data/state \
        --key-dir /run/sparkbox/keys --require-keys \
        --kernel /srv/sparkbox/vmlinux \
        --image-dir /srv/sparkbox/data/images \
        --tools-dir /srv/sparkbox/tools \
        --users /srv/sparkbox/users.conf \
        --ssh-addr :22 --api-addr 127.0.0.1:8080 \
        --proxy-addr :8081 --proxy-domain ${PROXY_DOMAIN} \
        $LOGIN_USER_FLAG $GUEST_SUBNET_FLAG $TRANSPORT_FLAGS $SUBNET6_FLAG \
        $EDGE_V4_FLAG $OVERCOMMIT_FLAGS $TLS_FLAGS $GATEWAY_FLAG $EXTRA_FLAGS
      Restart=always
      RestartSec=2
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/sparkbox-provision.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Fetch + verify a sparkbox artifact release and bring the host up.
      set -euxo pipefail
      BASE=@@BUCKET_BASE@@
      RELEASE=@@RELEASE@@
      DIR=/srv/sparkbox

      [ -e /dev/kvm ] || { echo "no /dev/kvm — not a KVM host"; exit 1; }

      # Swap safety-valve for memory overcommit: sandbox RAM is oversubscribed
      # (admission charges a working-set floor, not the 8GB ceiling), so a burst
      # of simultaneously-busy sandboxes should spill to disk, not OOM the host.
      # 16G on root (dd, not fallocate, so swapon never trips over holes).
      if ! swapon --show | grep -q '/swapfile'; then
        dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      # Resolve "latest" to a concrete release tag.
      if [ "$RELEASE" = latest ]; then
        RELEASE=$(curl -fsSL "$BASE/latest.env" | sed -n 's/^RELEASE=//p')
      fi
      REL="$BASE/releases/$RELEASE"

      # XFS reflink volume so per-sandbox rootfs copies are instant CoW clones.
      # Sparse (grows on use): the lean base template is only a few GB of real
      # blocks, plus per-sandbox write deltas and memory snapshot files (MemMB
      # each). 300G leaves ample room; EM-B220E-NVME has ~1TB of NVMe.
      mkdir -p "$DIR/data"
      if ! mountpoint -q "$DIR/data"; then
        if [ ! -f "$DIR/data.img" ]; then
          truncate -s 300G "$DIR/data.img"
          mkfs.xfs -q -m reflink=1 "$DIR/data.img"
        fi
        mount -o loop "$DIR/data.img" "$DIR/data"
        grep -q "$DIR/data.img" /etc/fstab || \
          echo "$DIR/data.img $DIR/data xfs loop 0 0" >> /etc/fstab
      fi
      mkdir -p "$DIR/data/state" "$DIR/data/images"

      # Fleet keys are no longer staged here — sparkbox-secrets.service fetches
      # them from Secret Manager into /run/sparkbox/keys (tmpfs) before sparkbox
      # starts, on this and every subsequent boot.

      # Fetch manifest, then each artifact, verifying sha256.
      curl -fsSL "$REL/manifest.env" -o "$DIR/manifest.env"
      . "$DIR/manifest.env"
      fetch() { curl -fsSL "$1" -o "$2"; echo "$3  $2" | sha256sum -c -; }
      fetch "$REL/vmlinux"        "$DIR/vmlinux"              "$SHA256_VMLINUX"
      fetch "$REL/firecracker"    /usr/local/bin/firecracker  "$SHA256_FIRECRACKER"
      fetch "$REL/sparkbox"       /usr/local/bin/sparkbox     "$SHA256_SPARKBOX"
      chmod +x /usr/local/bin/firecracker /usr/local/bin/sparkbox
      # The manifest names the rootfs template (ROOTFS_NAME) and where it lives
      # in the bucket (ROOTFS_PATH, bucket-relative — content-addressed under
      # rootfs/<key>/ so unchanged templates are shared across releases).
      # Fallbacks cover manifests predating each field: per-release .gz path,
      # SHA256_ROOTFS_GZ, and ubuntu.ext4 from before the codex-universal base.
      # Decompress keys off the extension: new releases ship .zst (~5x faster
      # to unpack than the ~30GB gunzip, the old long pole of provisioning).
      ROOTFS_NAME=${ROOTFS_NAME:-ubuntu}
      ROOTFS_PATH=${ROOTFS_PATH:-releases/$RELEASE/$ROOTFS_NAME.ext4.gz}
      SHA256_ROOTFS=${SHA256_ROOTFS:-${SHA256_ROOTFS_GZ:-}}
      ROOTFS_FILE="$DIR/data/images/$(basename "$ROOTFS_PATH")"
      fetch "$BASE/$ROOTFS_PATH" "$ROOTFS_FILE" "$SHA256_ROOTFS"
      case "$ROOTFS_FILE" in
        *.zst) zstd -d -f --rm "$ROOTFS_FILE" ;;
        *)     gunzip -f "$ROOTFS_FILE" ;;
      esac

      # The gateway must SSH into guests as the account baked into the template's
      # authorized_keys — `sparky` for our own image, `root` for legacy templates.
      # The manifest carries it as ROOTFS_LOGIN_USER; thread it into the service
      # env (idempotent) so `sparkbox serve --default-login-user` matches the
      # template. Default root: a manifest without the field predates the label.
      sed -i '/^LOGIN_USER_FLAG=/d' "$DIR/sparkbox.env" 2>/dev/null || true
      echo "LOGIN_USER_FLAG=--default-login-user=${ROOTFS_LOGIN_USER:-root}" >> "$DIR/sparkbox.env"

      # Bake up-to-date agent CLIs (claude, codex, pi, hivemind) into the fresh
      # template.
      # --force: the template was just replaced, so ignore any version stamp.
      # Best-effort — a download hiccup shouldn't fail provisioning; the daily
      # timer (enabled below) retries.
      IMAGES_DIR=/srv/sparkbox/data/images TOOLS_DIR=/srv/sparkbox/tools \
        /usr/local/sbin/sparkbox-refresh-tools.sh --force \
        || echo "WARN: agent tools refresh failed; timer will retry"

      # Pin any reserved (flexible) IPs on the primary NIC so DNS stays stable
      # across host rebuilds. launch-host.sh attaches them to the server (they
      # route to its NIC); here we merge them into cloud-init's netplan config
      # (interface id "eth0") as static addresses — DHCP still owns the default
      # IP/route, and netplan re-applies these on every boot.
      FLEXIBLE_ADDRS="@@FLEXIBLE_ADDRS@@"
      if [ -n "$FLEXIBLE_ADDRS" ]; then
        { echo "network:"; echo "  version: 2"; echo "  ethernets:"; \
          echo "    eth0:"; echo "      addresses:"; \
          for a in $FLEXIBLE_ADDRS; do echo "        - \"$a\""; done; \
        } > /etc/netplan/99-sparkbox-flexible.yaml
        chmod 600 /etc/netplan/99-sparkbox-flexible.yaml
        netplan apply || true
      fi

      # Free port 22 for the sandbox gateway by moving the host's own admin
      # sshd to :2222. Ubuntu 24.04 socket-activates ssh, so a bare `Port` in
      # sshd_config is ignored while ssh.socket owns the listener — disable the
      # socket and run ssh.service with an explicit Port instead. Must happen
      # before sparkbox.service starts, or the gateway can't bind :22. (Admin in:
      # `ssh -p 2222 ubuntu@<native-ip>`.)
      # Order matters and a stale listener is fatal: if any sshd is still bound to
      # :22 when sparkbox starts, the gateway crash-loops on "address already in
      # use" forever. `disable --now ssh.socket` alone proved insufficient — the
      # socket can re-activate and `restart ssh.service` doesn't guarantee the old
      # :22 listener exits — so mask the socket and explicitly evict anything still
      # holding :22 before the (later) sparkbox.service start. Safe here because
      # sparkbox isn't up yet, so the only thing on :22 can be sshd.
      printf 'Port 2222\n' > /etc/ssh/sshd_config.d/sparkbox-admin-port.conf
      systemctl disable --now ssh.socket 2>/dev/null || true
      systemctl mask ssh.socket 2>/dev/null || true
      systemctl stop ssh.service 2>/dev/null || systemctl stop ssh 2>/dev/null || true
      for p in $(ss -H -tlnp 'sport = :22' 2>/dev/null | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u); do
        [ "$(cat /proc/$p/comm 2>/dev/null)" = sshd ] && kill "$p" 2>/dev/null || true
      done
      systemctl enable ssh.service 2>/dev/null || true
      systemctl restart ssh.service 2>/dev/null || systemctl restart ssh || true

      # Kernel networking knobs, written to /etc/sysctl.d so they reapply on
      # every boot (this script runs once, at first boot only):
      #   ip_forward       — route sandbox traffic between taps and the uplink.
      #   v6 forwarding    — with --subnet6 each sandbox gets a routable /128 and
      #                      egresses without NAT (harmless to enable when unset).
      #   rp_filter strict — the metadata service identifies a caller by source
      #                      address and the host forwards between taps, so a
      #                      guest must not be able to source-spoof a neighbour.
      #                      The driver sets this per-tap as each is created;
      #                      this covers the host default too.
      cat > /etc/sysctl.d/99-sparkbox.conf <<'SYSCTL'
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.default.rp_filter=1
      SYSCTL
      sysctl -q --system

      systemctl daemon-reload
      # The iptables rules themselves live in sparkbox-net.service, which
      # reapplies them on every boot — see the unit above.
      systemctl enable --now sparkbox-net.service
      systemctl enable --now sparkbox-refresh-tools.timer
      # Fetch fleet secrets into tmpfs first; sparkbox.service Requires= it, so
      # enabling it here (and on every boot) is what puts keys in /run before the
      # gateway starts. If the fetch fails, sparkbox stays down — by design.
      systemctl enable sparkbox-secrets.service
      systemctl enable --now sparkbox.service
      echo "sparkbox provisioned from release $RELEASE"

runcmd:
  # Current rclone for R2 archiving (apt's ~1.60 501s on R2 uploads). Static
  # binary into /usr/local/bin so it wins over any distro rclone on PATH.
  - |
    case "$(dpkg --print-architecture)" in amd64) R=amd64;; arm64) R=arm64;; *) R=amd64;; esac
    T=$(mktemp -d) && curl -fsSL "https://downloads.rclone.org/rclone-current-linux-$R.zip" -o "$T/r.zip" \
      && ( cd "$T" && unzip -oq r.zip && install -m0755 rclone-*-linux-$R/rclone /usr/local/bin/rclone ) \
      && rm -rf "$T" && rclone version | head -1
  - [ bash, /usr/local/sbin/sparkbox-provision.sh ]
