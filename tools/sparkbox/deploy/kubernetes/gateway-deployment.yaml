apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkbox-gateway
  namespace: sparkbox-poc
  labels:
    app.kubernetes.io/name: sparkbox
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: sparky
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkbox
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkbox
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: sparky
      annotations:
        sparkbox.dev/users-hash: __SPARKBOX_USERS_HASH__
    spec:
      serviceAccountName: sparkbox-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sparkbox-gateway
          image: __SPARKBOX_IMAGE__
          imagePullPolicy: Always
          command:
            - /usr/local/sbin/sparkbox-gateway-entrypoint
          args:
            - --guest-subnet
            - 10.254.0.0/20
          env:
            - name: HOME
              value: /tmp
            - name: SPARKBOX_PROXY_DOMAIN
              value: __SPARKBOX_PROXY_DOMAIN__
            - name: SPARKBOX_PROXY_TLS
              value: "true"
            - name: SPARKBOX_TLS_PROVIDER
              value: autocert
            - name: SPARKBOX_CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparkbox-console
                  key: password
                  optional: true
            - name: SPARKBOX_GITHUB_APP_CLIENT_ID
              value: __SPARKBOX_GITHUB_APP_CLIENT_ID__
            - name: SPARKBOX_NODE_NAME
              value: cks-gateway
            - name: SPARKBOX_CLUSTER_ID
              value: cks-poc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: https
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: durable
              mountPath: /mnt/sparkbox-durable
            - name: runtime
              mountPath: /run/sparkbox/vm
            - name: tmp
              mountPath: /tmp
            - name: identity
              mountPath: /run/sparkbox/keys
              readOnly: true
            - name: users
              mountPath: /etc/sparkbox/users
              readOnly: true
      volumes:
        - name: durable
          persistentVolumeClaim:
            claimName: sparkbox-durable
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: identity
          secret:
            secretName: sparkbox-identity
            defaultMode: 0440
        - name: users
          secret:
            secretName: sparkbox-users
            defaultMode: 0440
