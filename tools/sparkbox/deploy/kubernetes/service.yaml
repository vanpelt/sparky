apiVersion: v1
kind: Service
metadata:
  name: sparkbox
  namespace: sparkbox-poc
  labels:
    app.kubernetes.io/name: sparkbox
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: sparky
  annotations:
    service.beta.kubernetes.io/coreweave-load-balancer-type: public
    service.beta.kubernetes.io/external-hostname: "*"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: sparkbox
    app.kubernetes.io/component: gateway
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: ssh
    - name: http
      protocol: TCP
      port: 80
      targetPort: https
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
    # Common web-development ports share the same TLS/authenticated gateway
    # listener. Sparkbox recovers the non-default port from Host/:authority and
    # forwards to that port on the selected sandbox.
    #
    # Source of truth: internal/publicports. Any change to these Service ports
    # must update that Go package too; the deploy contract test enforces parity.
    - name: https-3000
      protocol: TCP
      port: 3000
      targetPort: https
    - name: https-3001
      protocol: TCP
      port: 3001
      targetPort: https
    - name: https-4000
      protocol: TCP
      port: 4000
      targetPort: https
    - name: https-4200
      protocol: TCP
      port: 4200
      targetPort: https
    - name: https-5000
      protocol: TCP
      port: 5000
      targetPort: https
    - name: https-5173
      protocol: TCP
      port: 5173
      targetPort: https
    - name: https-6006
      protocol: TCP
      port: 6006
      targetPort: https
    - name: https-7860
      protocol: TCP
      port: 7860
      targetPort: https
    - name: https-8000
      protocol: TCP
      port: 8000
      targetPort: https
    - name: https-8080
      protocol: TCP
      port: 8080
      targetPort: https
    - name: https-8443
      protocol: TCP
      port: 8443
      targetPort: https
    - name: https-8501
      protocol: TCP
      port: 8501
      targetPort: https
    - name: https-8888
      protocol: TCP
      port: 8888
      targetPort: https
    - name: https-9000
      protocol: TCP
      port: 9000
      targetPort: https
