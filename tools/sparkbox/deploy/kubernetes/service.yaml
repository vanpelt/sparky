apiVersion: v1
kind: Service
metadata:
  name: sparkbox
  namespace: sparkbox-poc
  labels:
    app.kubernetes.io/name: sparkbox
    app.kubernetes.io/part-of: sparky
  annotations:
    service.beta.kubernetes.io/coreweave-load-balancer-type: public
    service.beta.kubernetes.io/external-hostname: "*"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: sparkbox
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: ssh
    - name: http
      protocol: TCP
      port: 80
      targetPort: acme
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
