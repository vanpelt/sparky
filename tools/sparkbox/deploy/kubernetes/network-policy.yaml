apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sparkbox-poc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-public-and-node-link
  namespace: sparkbox-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sparkbox
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 2222
          protocol: TCP
        - port: 8081
          protocol: TCP
