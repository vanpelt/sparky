apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkbox
  namespace: sparkbox-poc
  labels:
    app.kubernetes.io/name: sparkbox
    app.kubernetes.io/part-of: sparky
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkbox
        app.kubernetes.io/part-of: sparky
      annotations:
        sparkbox.dev/users-hash: __SPARKBOX_USERS_HASH__
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/arch: amd64
        compute.coreweave.com/node-pool: __SPARKBOX_NODE_POOL__
        kubernetes.io/hostname: __SPARKBOX_NODE__
      containers:
        - name: sparkbox
          image: __SPARKBOX_IMAGE__
          imagePullPolicy: Always
          env:
            - name: SPARKBOX_PROXY_DOMAIN
              value: __SPARKBOX_PROXY_DOMAIN__
            - name: SPARKBOX_RELEASE
              value: v0.5.3
            - name: SPARKBOX_GUEST_SUBNET
              value: 172.30.0.0/20
            - name: SPARKBOX_HOST_MEM_MB
              value: "22000"
            - name: SPARKBOX_PROXY_TLS
              value: "true"
            - name: SPARKBOX_TLS_PROVIDER
              value: autocert
            - name: SPARKBOX_NODE_NAME
              value: cks-poc
            - name: SPARKBOX_CLUSTER_ID
              value: cks-poc
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: acme
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              ephemeral-storage: 40Gi
            limits:
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: 100Gi
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/sparkbox
            - name: durable
              mountPath: /mnt/sparkbox-durable
            - name: identity
              mountPath: /run/sparkbox/keys
              readOnly: true
            - name: users
              mountPath: /etc/sparkbox/users
              readOnly: true
            - name: kvm
              mountPath: /dev/kvm
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: data
          hostPath:
            path: /mnt/local/sparkbox-poc
            type: DirectoryOrCreate
        - name: durable
          persistentVolumeClaim:
            claimName: sparkbox-durable
        - name: identity
          secret:
            secretName: sparkbox-identity
            defaultMode: 0400
        - name: users
          secret:
            secretName: sparkbox-users
            defaultMode: 0400
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
