apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkbox-node
  namespace: sparkbox-poc
  labels:
    app.kubernetes.io/name: sparkbox
    app.kubernetes.io/component: vm-node
    app.kubernetes.io/part-of: sparky
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkbox
      app.kubernetes.io/component: vm-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkbox
        app.kubernetes.io/component: vm-node
        app.kubernetes.io/part-of: sparky
    spec:
      serviceAccountName: sparkbox-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/arch: amd64
        compute.coreweave.com/node-pool: __SPARKBOX_NODE_POOL__
        kubernetes.io/hostname: __SPARKBOX_NODE__
      initContainers:
        - name: scrub-retired-gateway-state
          image: __SPARKBOX_IMAGE__
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              rm -f \
                /var/lib/sparkbox/control/sparkbox.db \
                /var/lib/sparkbox/control/sparkbox.db-shm \
                /var/lib/sparkbox/control/sparkbox.db-wal \
                /var/lib/sparkbox/control/schedules.db \
                /var/lib/sparkbox/control/schedules.db-shm \
                /var/lib/sparkbox/control/schedules.db-wal \
                /var/lib/sparkbox/control/gateway_host_key.pem \
                /var/lib/sparkbox/control/gateway_upstream_key.pem \
                /var/lib/sparkbox/control/oidc_signing_key.pem \
                /var/lib/sparkbox/control/oidc_signing_key_prev.pem \
                /var/lib/sparkbox/control/node_ca_key.pem \
                /var/lib/sparkbox/control/gateway_control_key.pem
              rm -rf \
                /var/lib/sparkbox/control/autocert \
                /var/lib/sparkbox/control/certmagic \
                /var/lib/sparkbox/control/favicons
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/sparkbox
        - name: prepare-vm-assets
          image: __SPARKBOX_IMAGE__
          imagePullPolicy: Always
          args:
            - prepare
          env:
            - name: SPARKBOX_PROXY_DOMAIN
              value: __SPARKBOX_PROXY_DOMAIN__
            - name: SPARKBOX_RELEASE
              value: v0.5.3
            - name: SPARKBOX_CHROOT_JAILER
              value: "true"
            - name: GATEWAY_PUBLIC_KEY_FILE
              value: /run/sparkbox/trust/gateway_upstream_key.pub
          securityContext:
            # This one-shot container owns the remaining trusted-template loop
            # mounts and exits before the VM controller accepts guest traffic.
            allowPrivilegeEscalation: true
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SYS_ADMIN
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 4Gi
              sparkbox.dev/loop: "1"
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 20Gi
              sparkbox.dev/loop: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/sparkbox
            - name: gateway-trust
              mountPath: /run/sparkbox/trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: checkpoint-scratch
              mountPath: /mnt/sparkbox-durable
      containers:
        - name: sparkbox-node
          image: __SPARKBOX_IMAGE__
          imagePullPolicy: Always
          env:
            - name: SPARKBOX_PROXY_DOMAIN
              value: __SPARKBOX_PROXY_DOMAIN__
            - name: SPARKBOX_RELEASE
              value: v0.5.3
            - name: SPARKBOX_GUEST_SUBNET
              value: 172.30.0.0/20
            - name: SPARKBOX_HOST_MEM_MB
              value: "22000"
            - name: SPARKBOX_GATEWAY_ADDR
              value: sparkbox-gateway.sparkbox-poc.svc.cluster.local:2222
            - name: SPARKBOX_NODE_NAME
              value: cks-poc
            - name: SPARKBOX_NODE_KEY_DIR
              value: /var/lib/sparkbox/node-identity
            - name: SPARKBOX_SKIP_PREPARE
              value: "true"
            - name: SPARKBOX_CHROOT_JAILER
              value: "true"
            - name: SPARKBOX_DISABLE_HOST_ROOTFS_MOUNTS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - MKNOD
                - NET_ADMIN
                - SETGID
                - SETUID
                - SYS_CHROOT
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              ephemeral-storage: 40Gi
              sparkbox.dev/kvm: "1"
              sparkbox.dev/tun: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: 100Gi
              sparkbox.dev/kvm: "1"
              sparkbox.dev/tun: "1"
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/sparkbox
            - name: gateway-trust
              mountPath: /run/sparkbox/trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: checkpoint-scratch
              mountPath: /mnt/sparkbox-durable
      volumes:
        - name: data
          hostPath:
            path: /mnt/local/sparkbox-poc
            type: Directory
        - name: gateway-trust
          secret:
            secretName: sparkbox-node-trust
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: checkpoint-scratch
          emptyDir:
            sizeLimit: 1Gi
