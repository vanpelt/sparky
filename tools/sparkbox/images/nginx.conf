# sparkbox default site. nginx ships installed but disabled — a sandbox brings it
# up with `sudo systemctl start nginx` and gets this landing page on :80, reachable
# at <name>.<domain>:80.
#
# :80 ONLY, deliberately. 8000 is the port <name>.<domain> forwards to by default,
# and it belongs to whatever the user runs. If nginx also listened there, starting
# it would silently squat the one port a new app is most likely to want, and the
# app would fail to bind with no obvious culprit. Nothing on 8000 is not an error
# state — the edge answers that case itself with a help page (internal/proxy).
#
# The sub_filter swaps __HOSTNAME__ for the request host so the page greets the
# sandbox by name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    location / {
        sub_filter '__HOSTNAME__' $host;
        sub_filter_once off;
        try_files $uri $uri/ =404;
    }
}
