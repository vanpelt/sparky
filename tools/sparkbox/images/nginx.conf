# sparkbox default site. nginx ships installed but disabled — a sandbox brings it
# up with `sudo systemctl start nginx` and gets this landing page. The proxy edge
# routes <name>.<domain> to whatever port the guest binds, so :80 is the natural
# default; :8000 is a convenience second listener. The sub_filter swaps
# __HOSTNAME__ for the request host so the page greets the sandbox by name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8000;
    listen [::]:8000;

    root /var/www/html;
    index index.html;

    server_name _;

    location / {
        sub_filter '__HOSTNAME__' $host;
        sub_filter_once off;
        try_files $uri $uri/ =404;
    }
}
