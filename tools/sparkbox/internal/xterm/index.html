<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>sparkbox — terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>" />
<link rel="stylesheet" href="/assets/xterm.css" />
<style>
  /* Design tokens and reset are shared with the two consoles (internal/webui)
     so the terminal reads as the same product. The chrome stays monochrome;
     the only chroma outside the terminal grid is the state dot. */
  /*SHARED_CSS*/

  /* The terminal owns the viewport. dvh, not vh: on mobile Safari the toolbar
     collapses and a vh-sized grid would leave the last rows under it. */
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px; height: 44px; flex: none;
    border-bottom: 1px solid hsl(var(--border));
    background: hsl(var(--card));
    /* The header is a grid item, and a grid item's automatic minimum size is
       its min-content width — so without this it refuses to be narrower than
       everything it holds and simply overflows the viewport on a phone, taking
       the Reconnect button off the right edge. Zero lets it shrink and hands
       the decision to the flex rules below, where the name ellipsizes and the
       instruments hold their size. */
    min-width: 0;
    /* The bar sits above a canvas that repaints constantly; isolating it keeps
       the terminal's compositing out of its way. */
    position: relative; z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  /* The mark does not follow the theme: --primary inverts to near-white in
     dark mode and the bolt's gold would fall to about 2:1 against it. Pinning
     the tile dark keeps it constant, the way a real logo is. */
  .logo {
    width: 24px; height: 24px; border-radius: 6px; flex: none;
    background: hsl(240 5.9% 10%); color: hsl(0 0% 98%);
    display: grid; place-items: center; font-size: 13px; line-height: 1;
    text-indent: 0.02em;
  }
  .name {
    font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    /* The name outranks the instruments, so it keeps a readable stub even when
       the bar is squeezed — but it is not allowed to hog a wide bar either. */
    min-width: 4ch; max-width: 24ch;
  }
  .spacer { flex: 1 1 auto; }

  /* Status is a lamp, not a sentence. The word it used to carry cost ~65px of a
     44px bar to say something the screen already says louder: every state that
     is not "connected" puts a full overlay over the terminal explaining itself.
     So the text moves into the tooltip and, for screen readers, into a live
     region that announces the change rather than a label that quietly differs. */
  .status {
    display: inline-flex; align-items: center; flex: none;
    /* A 7px dot is a 7px hit target. The padding makes the tooltip reachable
       without making the lamp look like a button. */
    padding: 6px 3px; margin: -6px 0;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: hsl(var(--muted-foreground));
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .status[data-state="ready"] .dot { background: hsl(var(--green)); }
  .status[data-state="starting"] .dot,
  .status[data-state="connecting"] .dot { background: hsl(var(--amber)); animation: pulse 1.4s ease-in-out infinite; }
  .status[data-state="closed"] .dot { background: hsl(var(--muted-foreground)); }
  .status[data-state="error"] .dot { background: hsl(var(--red)); }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .status .dot { animation: none } }

  /* ---------- instrument strip ----------
     Three readings of the machine you are shelled into, one a second, sitting
     beside the status lamp because they answer the same question it does.

     Monochrome, like the rest of the chrome. The plots are drawn in recessive
     ink and cross into --amber/--red only at the 70/90 thresholds both consoles
     already use, so colour in this bar never means "this is the CPU one" — it
     only ever means look. Height carries the value; the number beside each plot
     carries it again, so nothing here is encoded by colour alone. */
  /* flex: none, so the strip is never the thing that gets squeezed: the name
     beside it already ellipsizes, and a compressed plot would be a lie about
     the time window rather than a smaller version of the truth. */
  /* 14 between cells against 6 inside one: with the dividers gone, the only
     thing grouping a plot with its own numbers is that the gap around the pair
     is more than twice the gap within it. */
  .vitals { display: flex; align-items: center; gap: 14px; flex: none; }
  .v-cell { display: flex; align-items: center; gap: 6px; }
  /* Every readout is a two-line stack, label over value, the way a menu-bar
     meter does it. Stacking is the whole compaction: the label stops paying for
     horizontal room it was only ever using to sit beside a number. */
  .v-read { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
  .v-key {
    font-size: 8.5px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: hsl(var(--muted-foreground));
  }
  /* Each plot sits in its own recessed well. It reads as an instrument rather
     than a scribble floating in the bar, and it is what lets the dividers
     between the three cells go away — the wells already do the separating. */
  .v-plot {
    display: block; flex: none; overflow: hidden;
    background: hsl(var(--muted) / .6); border-radius: 4px;
  }
  .v-cap { display: block; flex: none; }
  .v-area { fill: hsl(var(--muted-foreground) / .2); }
  .v-line {
    fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1.25;
    stroke-linejoin: round; stroke-linecap: round;
  }
  /* The network plot packs a minute into 56px, so a one-second burst is a
     one-pixel spike. The outline is what makes it a spike instead of a speck. */
  .v-thin { stroke-width: 1; }
  #v-net .v-area { fill: hsl(var(--muted-foreground) / .3); }
  /* "Now" is pinned to the right edge and history scrolls off to the left, so
     the leading edge is the one point worth marking. */
  .v-now { fill: hsl(var(--foreground)); }
  .v-axis { stroke: hsl(var(--border)); stroke-width: 1; }
  .v-cap-track { fill: none; stroke: hsl(var(--border)); stroke-width: 1; }
  .v-cap-fill { fill: hsl(var(--muted-foreground)); }
  .v-cell[data-level="warn"] .v-area { fill: hsl(var(--amber) / .26); }
  .v-cell[data-level="warn"] .v-line { stroke: hsl(var(--amber)); }
  .v-cell[data-level="warn"] .v-cap-fill { fill: hsl(var(--amber)); }
  .v-cell[data-level="hot"] .v-area { fill: hsl(var(--red) / .26); }
  .v-cell[data-level="hot"] .v-line { stroke: hsl(var(--red)); }
  .v-cell[data-level="hot"] .v-cap-fill { fill: hsl(var(--red)); }
  /* tabular-nums and a floor width together: without both, a bar that repaints
     every second twitches sideways as the digits change, which reads as the
     page being unstable rather than the number being live. */
  .v-val {
    font-size: 12px; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; min-width: 30px;
  }
  /* The network cell stacks too, but both its lines are values — and their
     order IS the legend: the rate on top names the half of the plot above the
     axis, the one beneath names the half below it. Direction does the work two
     colours do in most network meters. */
  .v-rates {
    display: flex; flex-direction: column; gap: 2px; line-height: 1;
    font-size: 9.5px; font-variant-numeric: tabular-nums;
    color: hsl(var(--muted-foreground)); min-width: 56px;
  }
  /* A sandbox that isn't running: the plots are the last thing that happened
     rather than what is happening, so they go quiet instead of vanishing and
     taking the header's layout with them. */
  .vitals[data-live="0"] { opacity: .4; }
  /* The strip sheds cells one at a time rather than vanishing at a single
     threshold, so a phone still gets the reading that matters most. The order
     is by value per pixel: network is the widest cell and the least urgent
     (its plot says "something is transferring", which the CPU plot usually
     says too), memory next, and the CPU sparkline is the last thing standing —
     "is this machine doing anything" is the question the strip exists for. */
  @media (max-width: 980px) { #v-net { display: none } }
  @media (max-width: 700px) { #v-mem { display: none } }
  /* Phone. The CPU cell survives intact — logo, name stub, sparkline, lamp and
     Reconnect measure ~305px, so it fits a 360px viewport with room to spare.
     Only the spacing tightens; the plot keeps its width, because scaling an SVG
     whose viewBox is a fixed sample count would squash a minute of history into
     a smear rather than showing less of it. */
  @media (max-width: 460px) {
    header { gap: 8px; padding: 0 8px; }
    .brand { gap: 7px; }
  }

  /* background: transparent is not cosmetic — the shared reset leaves it
     unset, so without it the user agent's own button face shows through and
     the chrome stops being monochrome in dark mode. */
  header button {
    font-size: 12.5px; padding: 5px 10px;
    background: transparent; color: hsl(var(--foreground));
  }
  header .btn-outline { border-color: hsl(var(--border)); }
  header .btn-outline:hover:not(:disabled) { background: hsl(var(--muted)); }
  header .btn-ghost { border-color: transparent; color: hsl(var(--muted-foreground)); }
  header .btn-ghost:hover:not(:disabled) { background: hsl(var(--muted)); color: hsl(var(--foreground)); }

  /* ---------- menu ----------
     One button on the bar, a card under it. The panel is positioned against
     the button rather than the header so it stays glued to it at every width,
     and it is the only thing on this page allowed a shadow — it is the only
     thing that floats. */
  .menu { position: relative; display: inline-flex; flex: none; }
  .menu-btn { padding: 5px 7px; }
  .menu-btn svg { width: 17px; height: 17px; display: block; }
  .menu.open .menu-btn { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
  .menu-panel {
    position: absolute; top: calc(100% + 7px); right: 0; z-index: 30;
    width: 300px; max-width: calc(100vw - 16px); padding: 5px;
    background: hsl(var(--card)); border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    box-shadow: 0 16px 38px -14px hsl(240 10% 3.9% / .5);
    /* visibility rather than display, so the panel can transition — and so it
       leaves the tab order while closed, which `opacity: 0` alone would not
       do. The delayed visibility on the way out is what lets the fade finish
       before the panel is taken away. */
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
  }
  .menu.open .menu-panel {
    opacity: 1; visibility: visible; transform: none;
    transition: opacity .12s ease, transform .12s ease;
  }
  /* Items are two lines: what it does, and what that means. The second line is
     the whole reason these moved out of the bar — a 44px strip had room for
     "Clear" and no room at all to say that it clears the window and not the
     sandbox. */
  .menu-item, .menu-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 7px 9px; border-radius: calc(var(--radius) - 3px);
    background: transparent; border: 1px solid transparent;
    color: hsl(var(--foreground)); font-size: 13px; text-decoration: none;
  }
  .menu-item:hover:not(:disabled), .menu-item:focus-visible { background: hsl(var(--muted)); }
  .menu-lines { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
  .menu-label { font-weight: 500; line-height: 1.25; }
  .menu-sub { font-size: 11.5px; line-height: 1.35; color: hsl(var(--muted-foreground)); }
  /* The one line that must not wrap, and the only one clipped: a command broken
     over two lines reads as two commands. The sentences under the other items
     wrap instead, because a sentence cut off at "Nothing in the sandbox c…" is
     worse than a sentence on two lines. */
  #ssh-cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-icon { width: 14px; height: 14px; flex: none; color: hsl(var(--muted-foreground)); }
  .menu-item:hover .menu-icon { color: hsl(var(--foreground)); }
  .menu-sep { height: 1px; margin: 5px 8px; background: hsl(var(--border)); }
  /* The copied line flashes its own row rather than only raising a toast: the
     pointer is already there, and a toast at the bottom of a full-screen
     terminal is a long way from the thing you just clicked. */
  #ssh-btn.copied { background: hsl(var(--green) / .14); }
  #ssh-btn.copied .menu-icon { color: hsl(var(--green)); }

  /* ---------- terminal ---------- */
  #screen { position: relative; min-height: 0; background: hsl(var(--background)); }
  #term { position: absolute; inset: 0; padding: 8px 4px 8px 10px; }
  .xterm .xterm-viewport { scrollbar-width: thin; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: hsl(var(--muted-foreground) / .35); border-radius: 5px;
  }

  /* Overlay for the states where there is nothing to type into yet. It sits
     over the grid rather than replacing it, so a reconnect does not throw away
     the scrollback the user still wants to read. */
  #overlay {
    position: absolute; inset: 0; z-index: 1;
    display: grid; place-items: center; padding: 20px;
    background: hsl(var(--background) / .82); backdrop-filter: blur(2px);
  }
  #overlay .card { padding: 20px 22px; max-width: 380px; text-align: center; }
  #overlay h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  #overlay p { margin: 0 0 14px; font-size: 13px; color: hsl(var(--muted-foreground)); }
  #overlay button { width: 100%; justify-content: center; padding: 7px 12px; font-size: 13px; }
  .spinner {
    width: 18px; height: 18px; margin: 0 auto 12px; border-radius: 50%;
    border: 2px solid hsl(var(--border)); border-top-color: hsl(var(--foreground));
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s } }

  /* The turbo confirmation. Same shape as the consoles' dialogs — this page
     had no need of one until now, so the handful of rules lives here rather
     than in a shared file only one page would still be reading. */
  dialog {
    border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    background: hsl(var(--card)); color: hsl(var(--foreground));
    padding: 22px; width: 100%; max-width: 400px;
  }
  dialog::backdrop { background: hsl(240 10% 3.9% / .55); }
  dialog h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  dialog p { margin: 0 0 14px; font-size: 12.5px; color: hsl(var(--muted-foreground)); line-height: 1.5; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  dialog button { font-size: 13px; padding: 6px 12px; }
  dialog .btn-outline { border-color: hsl(var(--border)); }
  dialog .btn-outline:hover:not(:disabled) { background: hsl(var(--muted)); }

  /* ---------- toast (shared helper writes into this) ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(8px);
    background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
    padding: 8px 14px; border-radius: calc(var(--radius) - 2px); font-size: 13px;
    opacity: 0; pointer-events: none; transition: .16s ease; z-index: 5;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: hsl(var(--red)); color: #fff; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">&#9889;&#65039;</div>
      <span class="name mono" id="sandbox-name">&nbsp;</span>
    </div>
    <div class="spacer"></div>

    <div class="vitals hidden" id="vitals" data-live="0" role="group" aria-label="Sandbox vitals">
      <div class="v-cell hidden" id="v-cpu">
        <svg class="v-plot" width="64" height="22" viewBox="0 0 64 22" aria-hidden="true" focusable="false">
          <path class="v-area" id="cpu-area"></path>
          <path class="v-line" id="cpu-line"></path>
          <circle class="v-now hidden" id="cpu-now" r="1.6"></circle>
        </svg>
        <span class="v-read">
          <span class="v-key">CPU</span>
          <span class="v-val mono" id="cpu-val">&#8212;</span>
        </span>
      </div>

      <div class="v-cell hidden" id="v-mem">
        <!-- A capsule filled from the bottom, clipped to its own outline so the
             fill has a flat top and a rounded floor. A rounded rect scaled from
             the bottom instead would round its top edge too and read as a pill
             floating in a tube. -->
        <svg class="v-cap" width="10" height="22" viewBox="0 0 10 22" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="v-cap-clip">
              <rect x="1.25" y="2.25" width="7.5" height="17.5" rx="3.75"></rect>
            </clipPath>
          </defs>
          <rect class="v-cap-track" x="0.5" y="1.5" width="9" height="19" rx="4.5"></rect>
          <g clip-path="url(#v-cap-clip)">
            <rect class="v-cap-fill" id="mem-fill" x="0" y="19.75" width="10" height="0"></rect>
          </g>
        </svg>
        <span class="v-read">
          <span class="v-key">RAM</span>
          <span class="v-val mono" id="mem-val">&#8212;</span>
        </span>
      </div>

      <div class="v-cell hidden" id="v-net">
        <!-- One scale, one axis, mirrored: out above the line, in below it.
             Both series are bytes per second, so they belong on the same scale;
             the direction is what tells them apart, and the two rates to the
             right sit in the same order as the halves they name. -->
        <svg class="v-plot" width="56" height="22" viewBox="0 0 56 22" aria-hidden="true" focusable="false">
          <line class="v-axis" x1="0" y1="11" x2="56" y2="11"></line>
          <path class="v-area" id="tx-area"></path>
          <path class="v-area" id="rx-area"></path>
          <path class="v-line v-thin" id="tx-line"></path>
          <path class="v-line v-thin" id="rx-line"></path>
        </svg>
        <span class="v-rates mono">
          <span id="tx-val">&#8593; &#8212;</span>
          <span id="rx-val">&#8595; &#8212;</span>
        </span>
      </div>
    </div>

    <!-- role="status" makes the text below a live region, so a screen reader is
         told when the connection changes. That is why the word stays in the DOM
         rather than becoming an aria-label: a changed label is not announced,
         changed live-region content is. Sighted users get it from the tooltip,
         and from the overlay that covers the terminal in every state but this
         one. -->
    <span class="status" id="status" data-state="connecting" role="status" title="Connecting">
      <span class="dot"></span><span class="sr-only" id="status-text">connecting</span>
    </span>
    <!-- Everything you can DO to this sandbox, behind one button.
         The bar used to carry three controls in a row — a turbo switch, Clear
         and Reconnect — which spent a third of a 44px bar on things nobody
         presses in a normal session, hid two of them on a phone (`hide-sm`),
         and put "Reconnect" in permanent view of a terminal that was
         connected. A menu holds all of it at any width, has room to say what
         each item does, and lets the item that is about the connection change
         its wording with the connection. -->
    <div class="menu" id="menu">
      <!-- A disclosure, not an ARIA `menu`. The menu role comes with a keyboard
           contract — arrow keys move between items, Home and End jump the ends,
           and Tab leaves the whole widget — and a panel that claims the role
           without implementing it is worse for a screen-reader user than one
           that never claimed it: it promises keys that do nothing. This is
           `aria-expanded` over a plain group of buttons and one link, which Tab
           already walks correctly. -->
      <button class="btn-ghost menu-btn" id="menu-btn" aria-expanded="false"
        aria-controls="menu-panel" aria-label="Sandbox menu" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <div class="menu-panel" id="menu-panel" aria-label="Sandbox menu">
        <!-- The ssh line first: it is the one item that is information as much
             as it is an action, and it is what somebody opening this menu for
             the first time is most often after. The command is rendered in
             full rather than described, so it can be read without being
             copied. -->
        <button class="menu-item hidden" id="ssh-btn">
          <span class="menu-lines">
            <span class="menu-label">Copy the ssh command</span>
            <span class="menu-sub mono" id="ssh-cmd">&nbsp;</span>
          </span>
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>

        <a class="menu-item hidden" id="proxy-link" target="_blank" rel="noopener">
          <span class="menu-lines">
            <span class="menu-label">Proxy</span>
            <span class="menu-sub mono" id="proxy-host">Default HTTPS endpoint</span>
          </span>
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <path d="M15 3h6v6"/><path d="M10 14 21 3"/>
          </svg>
        </a>
        <div id="proxy-ports"></div>

        <div class="menu-sep"></div>

        <!-- The turbo switch, hidden until GET /vitals says this host will
             accept one. Its lamp is painted from that same poll rather than
             from what this page last did, so it goes dark when the idle reaper
             hands the borrowed resources back — which is a thing that happens
             to the sandbox, not a thing the page did.

             It keeps the physical push-button it has everywhere else in the
             product (shared.css) rather than becoming a plain menu row: the
             point of that switch is that it looks like the same switch
             wherever you meet it. What the menu adds is the sentence beside
             it, which is what the tooltip used to have to carry. -->
        <div class="menu-row hidden" id="turbo-row">
          <span class="menu-lines">
            <span class="menu-label">Turbo</span>
            <span class="menu-sub" id="turbo-sub">2&#215; the CPU and RAM, for one run</span>
          </span>
          <button class="turbo" id="turbo-btn" data-on="0" aria-pressed="false"
            aria-label="Turn on turbo: restart this sandbox with double the CPU and RAM"><span class="led"></span>Turbo</button>
        </div>

        <button class="menu-item" id="clear-btn">
          <span class="menu-lines">
            <span class="menu-label">Clear the scrollback</span>
            <span class="menu-sub">Empties this window; the sandbox is untouched.</span>
          </span>
        </button>

        <!-- Label and sentence both move with the connection: while a shell is
             attached this is "start a new shell", which is what pressing it
             actually does, and only a disconnected page calls it Reconnect. A
             button reading "Reconnect" on a working terminal is a puzzle. -->
        <button class="menu-item" id="reconnect-btn">
          <span class="menu-lines">
            <span class="menu-label" id="reconnect-label">Reconnect</span>
            <span class="menu-sub" id="reconnect-sub">Open a shell in this sandbox.</span>
          </span>
        </button>

        <div class="menu-sep hidden" id="console-sep"></div>
        <!-- The only link off this page, and it opens a tab of its own: the
             shell in the grid behind this menu is a live session, and
             navigating away from it in the same tab ends it. -->
        <a class="menu-item hidden" id="console-link" target="_blank" rel="noopener">
          <span class="menu-lines">
            <span class="menu-label">Your sandboxes</span>
            <span class="menu-sub" id="console-host">The sparkbox console</span>
          </span>
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <path d="M15 3h6v6"/><path d="M10 14 21 3"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <dialog id="proxy-dlg">
    <h3>Proxy not ready</h3>
    <p id="proxy-msg"></p>
    <div class="row">
      <button class="btn-primary" id="proxy-ok" type="button">Got it</button>
    </div>
  </dialog>

  <!-- Turbo restarts the guest, which ends the shell in the grid behind this.
       Nothing about a lit push-button says so, hence the sentence. -->
  <dialog id="turbo-dlg">
    <h3 id="turbo-title">Turn on turbo</h3>
    <p id="turbo-msg"></p>
    <div class="row">
      <button class="btn-outline" id="turbo-cancel" type="button">Cancel</button>
      <button class="btn-primary" id="turbo-go" type="button">Turn on turbo</button>
    </div>
  </dialog>

  <div id="screen">
    <div id="term"></div>
    <div id="overlay" class="hidden">
      <div class="card">
        <div class="spinner" id="overlay-spinner"></div>
        <h2 id="overlay-title">Connecting</h2>
        <p id="overlay-msg">Opening a shell in your sandbox.</p>
        <button class="btn-primary hidden" id="overlay-btn">Reconnect</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/assets/xterm.js"></script>
  <script src="/assets/addon-fit.js"></script>
  <script src="/assets/addon-web-links.js"></script>
  <script>
  (function () {
    /*SHARED_JS*/

    // The sandbox's name, first as a guess and then as a fact.
    //
    // The host is `<name>-<subdomain>.<zone>` — ONE label, because that is the
    // only shape the zone's wildcard certificate covers — so the first label is
    // `demo-xterm` and not `demo`, and the subdomain is configurable, so there
    // is no suffix this page can safely strip either. The server is the only
    // authority and it sends the name on the /vitals poll this page already
    // makes (paintIdentity below).
    //
    // The guess is still painted immediately, because the alternative is an
    // empty header for as long as one same-origin request takes and because
    // `demo-xterm` is recognisable as the sandbox you asked for. It is
    // corrected on the first reading, which also fixes what the turbo dialog
    // and the toasts call this box — they all read SANDBOX.
    let SANDBOX = location.hostname.split(".")[0];
    function paintName() {
      document.title = SANDBOX + " — sparkbox terminal";
      $("sandbox-name").textContent = SANDBOX;
      // On a narrow bar the name is the thing that gives way, so keep the whole
      // of it one hover (or long-press) away.
      $("sandbox-name").title = SANDBOX;
    }
    paintName();

    // xterm.js needs concrete colours; the rest of the page reads CSS
    // variables. Two palettes, picked from the same signal shared.css uses so
    // the terminal never disagrees with its own chrome.
    const LIGHT = {
      background: "#ffffff", foreground: "#18181b", cursor: "#18181b",
      cursorAccent: "#ffffff", selectionBackground: "#18181b26",
      black: "#18181b", red: "#c2410c", green: "#15803d", yellow: "#a16207",
      blue: "#1d4ed8", magenta: "#7e22ce", cyan: "#0e7490", white: "#d4d4d8",
      brightBlack: "#71717a", brightRed: "#ea580c", brightGreen: "#16a34a",
      brightYellow: "#ca8a04", brightBlue: "#2563eb", brightMagenta: "#9333ea",
      brightCyan: "#0891b2", brightWhite: "#fafafa",
    };
    const DARK = {
      background: "#09090b", foreground: "#e4e4e7", cursor: "#e4e4e7",
      cursorAccent: "#09090b", selectionBackground: "#fafafa33",
      black: "#27272a", red: "#f87171", green: "#4ade80", yellow: "#fbbf24",
      blue: "#60a5fa", magenta: "#c084fc", cyan: "#22d3ee", white: "#d4d4d8",
      brightBlack: "#52525b", brightRed: "#fca5a5", brightGreen: "#86efac",
      brightYellow: "#fcd34d", brightBlue: "#93c5fd", brightMagenta: "#d8b4fe",
      brightCyan: "#67e8f9", brightWhite: "#fafafa",
    };
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    function theme() {
      const forced = document.documentElement.getAttribute("data-theme");
      if (forced === "dark") return DARK;
      if (forced === "light") return LIGHT;
      return media.matches ? DARK : LIGHT;
    }

    const term = new Terminal({
      allowProposedApi: true,
      cursorBlink: true,
      convertEol: false,
      fontSize: 13,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace',
      lineHeight: 1.2,
      // A generous scrollback: a build log the user scrolls back through is the
      // most common reason to be in here at all.
      scrollback: 10000,
      theme: theme(),
      macOptionIsMeta: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new WebLinksAddon.WebLinksAddon());
    term.open($("term"));
    fit.fit();
    term.focus();
    // Two signals, because the chrome has two: the OS preference, and the
    // data-theme override the shared design system honours. Without the
    // observer the grid would keep the palette it was built with while the bar
    // above it flipped, which looks like a rendering bug rather than a theme.
    const applyTheme = () => { term.options.theme = theme(); };
    if (media.addEventListener) media.addEventListener("change", applyTheme);
    new MutationObserver(applyTheme).observe(document.documentElement,
      { attributes: true, attributeFilter: ["data-theme"] });

    // ---- connection state -------------------------------------------------
    let ws = null;            // the live socket, if any
    let ready = false;        // the guest's shell is attached
    let attempt = 0;          // consecutive failed connects, for the backoff
    let retryTimer = null;
    let countdown = null;
    let everConnected = false;  // a reconnect looks different from a first connect
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    // The lamp carries no words of its own, so its tooltip is where a sighted
    // user reads the connection state while the terminal is usable. Keyed on
    // the word rather than the data-state: three different situations share the
    // "closed" lamp, and they are not the same news.
    const STATUS_HINT = {
      connecting: "Opening a shell in your sandbox.",
      starting: "Starting your sandbox. This can take a moment.",
      connected: "Connected to your sandbox.",
      reconnecting: "Disconnected. Reconnecting.",
      exited: "The shell exited. Reconnect starts a new one.",
      paused: "The sandbox went idle and was paused. Reconnect starts it again.",
      failed: "Couldn't attach to your sandbox.",
    };
    function setStatus(state, text) {
      $("status").setAttribute("data-state", state);
      $("status-text").textContent = text;
      $("status").title = STATUS_HINT[text] || text;
      paintConnAction(text === "connected");
    }

    // The menu's connection item, worded for the state it is in.
    //
    // Pressing it does the same thing either way — drop whatever socket is
    // there and open a new one — but those are two different acts to the person
    // pressing it, and one of them was previously offered as a permanent
    // "Reconnect" button on a terminal that was plainly connected. On a live
    // shell this is a restart, and it costs you the session you are in, which
    // is the part worth saying out loud.
    function paintConnAction(live) {
      $("reconnect-label").textContent = live ? "Start a new shell" : "Reconnect";
      $("reconnect-sub").textContent = live
        ? "Ends this shell and opens a fresh one."
        : "Open a shell in this sandbox.";
    }

    function overlay(title, msg, opts) {
      opts = opts || {};
      $("overlay-title").textContent = title;
      $("overlay-msg").textContent = msg;
      $("overlay-spinner").className = opts.busy ? "spinner" : "spinner hidden";
      $("overlay-btn").className = opts.action ? "btn-primary" : "btn-primary hidden";
      $("overlay-btn").textContent = opts.action || "Reconnect";
      $("overlay").className = "";
    }
    function hideOverlay() { $("overlay").className = "hidden"; }

    // A line written by us, not by the guest. Dim so it never reads as program
    // output, and \r\n because the terminal is a terminal.
    function note(msg) { term.write("\r\n\x1b[2m" + msg + "\x1b[0m\r\n"); }

    function sendResize() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !ready) return;
      ws.send(JSON.stringify({ type: "resize", rows: term.rows, cols: term.cols }));
    }

    // retryIn schedules the next attempt and counts down to it out loud. A
    // static "reconnecting in 4s" that never changes reads as a frozen page,
    // which is the opposite of the reassurance it is there to give.
    function retryIn(ms) {
      let left = Math.round(ms / 1000);
      const paint = () => overlay("Disconnected",
        left > 0 ? "Reconnecting in " + left + "s." : "Reconnecting…",
        { busy: true, action: "Reconnect now" });
      paint();
      clearInterval(countdown);
      countdown = setInterval(() => {
        left--;
        paint();
        if (left <= 0) clearInterval(countdown);
      }, 1000);
      retryTimer = setTimeout(connect, ms);
    }

    function connect() {
      clearTimeout(retryTimer);
      clearInterval(countdown);
      if (ws) {
        // Detach the old socket's handlers before closing it. Its onclose
        // fires asynchronously, by which time `ws` names the *new* socket —
        // so an attached handler would null that out and schedule a retry on
        // a connection that is working fine.
        const old = ws;
        old.onopen = old.onmessage = old.onclose = old.onerror = null;
        ws = null;
        try { old.close(); } catch (e) { /* already gone */ }
      }
      ready = false;
      setStatus("connecting", "connecting");
      overlay("Connecting", "Opening a shell in your sandbox.", { busy: true });

      // The scrollback survives a reconnect, so mark where the old session
      // stopped — otherwise the new shell's prompt lands on the stale one's
      // line and the two read as a single confusing sentence.
      if (everConnected) note("── new session ──");

      const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
      // The session rides the cookie: a browser cannot put a header on a
      // WebSocket handshake, which is exactly why the server checks Origin.
      ws = new WebSocket(url, "sparkbox.terminal.v1");
      ws.binaryType = "arraybuffer";

      ws.onopen = () => { attempt = 0; everConnected = true; };

      ws.onmessage = (ev) => {
        // Binary is the byte stream; text is out-of-band status. Never the
        // other way round — PTY output is not guaranteed valid UTF-8 at a
        // frame boundary, and a text frame that is not would kill the socket.
        if (typeof ev.data !== "string") { term.write(new Uint8Array(ev.data)); return; }
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === "status" && m.state === "starting") {
          setStatus("starting", "starting");
          overlay("Starting your sandbox", m.note || "This can take a moment.", { busy: true });
        } else if (m.type === "status" && m.state === "ready") {
          ready = true;
          setStatus("ready", "connected");
          hideOverlay();
          sendResize();
          term.focus();
        } else if (m.type === "error") {
          setStatus("error", "failed");
          overlay("Couldn't attach", m.message, { action: "Try again" });
        } else if (m.type === "exit") {
          note("shell exited with status " + (m.code || 0));
        }
      };

      ws.onclose = (ev) => {
        ready = false;
        ws = null;
        // 4001 the shell exited, 4002 the sandbox was hung up (paused, idle,
        // or the control plane restarted), 4003 we never got in.
        if (ev.code === 4001) {
          setStatus("closed", "exited");
          overlay("Shell exited", "Start a new one whenever you like.", { action: "New shell" });
          return;
        }
        if (ev.code === 4002) {
          // A hang-up we asked for. Turbo pauses the sandbox on its way to the
          // cold boot, so this arrives every time — and "it went idle" would be
          // a flatly wrong account of what just happened. No retry here either:
          // the POST is still in flight and reconnects itself when it lands.
          if (turboPending) {
            setStatus("starting", "starting");
            overlay("Restarting", turboWant
              ? "Bringing " + SANDBOX + " back with " + TURBO_FACTOR + "× the CPU and RAM."
              : "Bringing " + SANDBOX + " back at its usual size.",
              { busy: true });
            return;
          }
          setStatus("closed", "paused");
          // Deliberately no auto-retry: reconnecting resumes the sandbox, and a
          // tab left open overnight must not keep resurrecting a machine the
          // idle reaper just put away.
          overlay("Sandbox paused", "It went idle. Reconnecting will start it again.", { action: "Reconnect" });
          return;
        }
        if (ev.code === 4003) {
          setStatus("error", "failed");
          overlay("Couldn't attach", "The sandbox didn't come up. Try again in a moment.", { action: "Try again" });
          return;
        }
        // Anything else is transient — a dropped link, an edge restart — so
        // retry on a backoff. Unless the session expired while we were away,
        // in which case the page reload lands on the login redirect.
        setStatus("closed", "reconnecting");
        checkSession().then((expired) => {
          if (expired) { location.reload(); return; }
          attempt++;
          retryIn(Math.min(15000, 500 * Math.pow(2, attempt)));
        });
      };

      ws.onerror = () => { /* onclose always follows; it owns the recovery. */ };
    }

    // checkSession distinguishes "the session expired" from "the network
    // blipped", by probing the WebSocket path with a plain GET.
    //
    // ONLY 401 means expired, and the distinction is load-bearing rather than
    // pedantic. The auth gate runs first and answers 401; everything past it
    // answers 403 — including the origin gate, which refuses this very probe,
    // because fetch() does not put an Origin header on a same-origin GET (per
    // the Fetch standard, Origin is appended only for CORS-tainted requests and
    // non-GET methods) and the gate insists on an Origin or a Bearer token.
    // So 403 here is what a PERFECTLY VALID session looks like. Treating it as
    // expired reloaded the page on every transient drop, threw away the
    // scrollback the reconnect logic exists to preserve, and reload-looped
    // forever behind a proxy that answers the handshake but never upgrades.
    function checkSession() {
      return fetch("/ws", { credentials: "same-origin" })
        .then((r) => r.status === 401)
        .catch(() => false);
    }

    // ---- input and sizing -------------------------------------------------
    term.onData((d) => {
      if (ws && ws.readyState === WebSocket.OPEN && ready) ws.send(enc.encode(d));
    });
    term.onBinary((d) => {
      if (!ws || ws.readyState !== WebSocket.OPEN || !ready) return;
      const b = new Uint8Array(d.length);
      for (let i = 0; i < d.length; i++) b[i] = d.charCodeAt(i) & 255;
      ws.send(b);
    });

    // One debounce for both signals: a drag-resize fires continuously and each
    // event would otherwise be a TIOCSWINSZ in the guest.
    let fitTimer = null;
    function refit() {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => { try { fit.fit(); } catch (e) { /* detached */ } sendResize(); }, 90);
    }
    window.addEventListener("resize", refit);
    if (window.ResizeObserver) new ResizeObserver(refit).observe($("screen"));

    // ---- menu -------------------------------------------------------------
    // Opening it takes focus off the terminal, so closing it has to give focus
    // back — otherwise the next keystroke goes nowhere and the shell looks
    // frozen. That is the whole reason closeMenu takes an argument: a menu
    // closed by pressing Escape returns focus to the button that opened it (a
    // keyboard user is still navigating), and one closed by any other means
    // returns it to the shell.
    const menu = $("menu");
    function menuIsOpen() { return menu.classList.contains("open"); }
    function openMenu() {
      menu.classList.add("open");
      $("menu-btn").setAttribute("aria-expanded", "true");
    }
    function closeMenu(toButton) {
      if (!menuIsOpen()) return;
      menu.classList.remove("open");
      $("menu-btn").setAttribute("aria-expanded", "false");
      if (toButton) $("menu-btn").focus(); else term.focus();
    }
    $("menu-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      if (menuIsOpen()) closeMenu(false); else openMenu();
    });
    // Any click that is not inside the menu closes it, including one in the
    // terminal — where the mousedown handler below is about to take focus
    // anyway, so closeMenu's own focus call is harmless.
    document.addEventListener("click", (e) => {
      if (!menu.contains(e.target)) closeMenu(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && menuIsOpen()) closeMenu(true);
    }, true);

    $("reconnect-btn").addEventListener("click", () => { closeMenu(false); attempt = 0; connect(); });
    $("overlay-btn").addEventListener("click", () => { attempt = 0; connect(); });
    $("clear-btn").addEventListener("click", () => { closeMenu(false); term.clear(); term.focus(); });
    // A link out is a navigation, so the menu is closed but focus is NOT pulled
    // back to a terminal the browser is about to leave for another tab.
    ["console-link"].forEach((id) => {
      $(id).addEventListener("click", () => {
        menu.classList.remove("open");
        $("menu-btn").setAttribute("aria-expanded", "false");
      });
    });

    let proxyChecked = false;
    let proxyListening = false;
    let proxyPort = 0;
    $("proxy-link").addEventListener("click", (e) => {
      if (proxyChecked && !proxyListening) {
        e.preventDefault();
        closeMenu(false);
        $("proxy-msg").textContent = "Port " + proxyPort +
          " is not currently accepting connections. Start a service on this port to gain access via the proxy.";
        $("proxy-dlg").showModal();
        $("proxy-ok").focus();
        return;
      }
      menu.classList.remove("open");
      $("menu-btn").setAttribute("aria-expanded", "false");
    });
    $("proxy-ok").addEventListener("click", () => $("proxy-dlg").close());

    // ---- the ssh line -----------------------------------------------------
    // navigator.clipboard is unavailable outside a secure context — which is
    // every `--proxy-tls=false` dev loop — and can be refused by permission
    // policy even inside one. The textarea fallback is the pre-2020 way and
    // works in both, so the button is never a control that silently does
    // nothing.
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        // Off-screen rather than hidden: a display:none element cannot be
        // selected, and a visible one scrolls the page under the menu.
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("copy refused"));
      });
    }

    let sshLine = "";
    $("ssh-btn").addEventListener("click", () => {
      if (!sshLine) return;
      copyText(sshLine).then(() => {
        const row = $("ssh-btn");
        row.classList.add("copied");
        clearTimeout(row._flash);
        row._flash = setTimeout(() => row.classList.remove("copied"), 900);
        toast("Copied  " + sshLine);
        closeMenu(false);
      }).catch(() => {
        // The command stays on screen, so the honest failure message is the one
        // that points at it rather than one that says "copy failed" and leaves
        // the menu shut.
        toast("Couldn't reach the clipboard — select the command and copy it", true);
      });
    });

    // paintIdentity applies the four stable facts only the server can know: what this
    // sandbox is called, the ssh command that reaches it, its default proxy,
    // and where the console is. All four are constants for the life of the
    // page, so this does its work once and then costs a boolean per poll.
    let identityDone = false;
    function paintIdentity(v) {
      if (identityDone) return;
      identityDone = true;
      if (v.name && v.name !== SANDBOX) { SANDBOX = v.name; paintName(); }
      if (v.ssh) {
        sshLine = v.ssh;
        $("ssh-cmd").textContent = v.ssh;
        $("ssh-btn").setAttribute("aria-label", "Copy the command " + v.ssh + " to the clipboard");
        $("ssh-btn").classList.remove("hidden");
      }
      if (v.proxy) {
        const link = $("proxy-link");
        link.href = v.proxy;
        try { $("proxy-host").textContent = new URL(v.proxy).host; } catch (e) { /* keep the default */ }
        link.classList.remove("hidden");
      }
      if (v.console) {
        const link = $("console-link");
        link.href = v.console;
        // The hostname rather than the URL: it is the half a person recognises,
        // and the scheme and trailing slash are noise in a menu.
        try { $("console-host").textContent = new URL(v.console).host; } catch (e) { /* keep the default */ }
        link.classList.remove("hidden");
        $("console-sep").classList.remove("hidden");
      }
    }

    // Port availability is deliberately repainted on every reading: services
    // come and go while the terminal remains open. The default URL stays in its
    // stable first row; additional supported listeners appear beneath it.
    function paintProxyPorts(v) {
      if (!v.proxy) return;
      const ports = Array.isArray(v.listening_ports) ? v.listening_ports : [];
      proxyPort = v.proxy_port || 8000;
      proxyChecked = !!v.ports_checked;
      proxyListening = ports.includes(proxyPort);
      const defaultSub = $("proxy-host");
      if (proxyChecked && !proxyListening) {
        defaultSub.textContent = "Port " + proxyPort + " · not listening";
      } else {
        try { defaultSub.textContent = new URL(v.proxy).host + " · port " + proxyPort; }
        catch (e) { defaultSub.textContent = "Default HTTPS endpoint"; }
      }

      const extra = $("proxy-ports");
      extra.replaceChildren();
      ports.filter((port) => port !== proxyPort).forEach((port) => {
        const link = $("proxy-link").cloneNode(true);
        link.removeAttribute("id");
        link.classList.remove("hidden");
        link.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
        link.querySelector(".menu-label").textContent = "Proxy · port " + port;
        try {
          const url = new URL(v.proxy);
          url.port = String(port);
          link.href = url.toString();
          link.querySelector(".menu-sub").textContent = url.host;
        } catch (e) { return; }
        link.addEventListener("click", () => {
          menu.classList.remove("open");
          $("menu-btn").setAttribute("aria-expanded", "false");
        });
        extra.appendChild(link);
      });
    }
    $("screen").addEventListener("mousedown", () => {
      // Don't steal a selection the user is making, only a stray click.
      if (!term.hasSelection()) setTimeout(() => term.focus(), 0);
    });

    // ---- instrument strip -------------------------------------------------
    // GET /vitals hands back raw counters; the rates are derived here. That is
    // the same division the user console already makes with cpu_seconds, and it
    // is the right one: only the client knows whether its own two samples were
    // contiguous, which the server cannot know for a tab that was backgrounded
    // for ten minutes.

    const V_SAMPLES = 60;    // one minute of history, at one sample a second
    const V_POLL_MS = 1000;  // the guest's balloon publishes stats at 1 Hz too
    const V_IDLE_MS = 5000;  // a sandbox that isn't running has nothing to plot
    const V_MAX_GAP_S = 10;  // a wider gap between samples is not a rate
    // The floor the network plot scales up from. Without one, an idle guest's
    // few hundred bytes a second of background chatter would autoscale into a
    // dramatic-looking storm.
    const V_NET_FLOOR = 1024;
    // Plot widths in user units. They must equal the viewBox widths above —
    // one user unit is one CSS pixel here, which is what keeps a 1.25px stroke
    // 1.25px and a one-second sample one pixel wide.
    const V_CPU_W = 64, V_NET_W = 56;

    const cpuHist = [], rxHist = [], txHist = [];
    let vPrev = null;      // the previous raw reading, for deltas
    let vLast = null;      // the newest raw reading, quoted by the turbo dialog
    let vTimer = null;
    let vDelay = V_POLL_MS;
    let vStopped = false;  // a permanent refusal; stop asking

    function push(a, v) { a.push(v); if (a.length > V_SAMPLES) a.shift(); }
    function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
    function num(v) { return typeof v === "number"; }
    function rate(bps) { return bytes(bps) + "/s"; }
    function peak(a) { return a.length ? Math.max.apply(null, a) : 0; }
    function avg(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0; }

    // Points are laid out right-anchored: the newest sample owns the right edge
    // and older ones march left off the plot. A window that filled from the
    // left would slide the "now" reading around as history accumulated.
    function points(vals, w, toY) {
      const n = vals.length, step = w / (V_SAMPLES - 1), pts = [];
      for (let i = 0; i < n; i++) pts.push([w - (n - 1 - i) * step, toY(vals[i])]);
      return pts;
    }
    function xy(x, y) { return x.toFixed(2) + "," + y.toFixed(2); }
    function line(pts) {
      return pts.map((p, i) => (i ? "L" : "M") + xy(p[0], p[1])).join("");
    }
    function area(pts, base) {
      if (pts.length < 2) return "";
      const a = pts[0], z = pts[pts.length - 1];
      return "M" + xy(a[0], base) + line(pts).slice(1) + "L" + xy(z[0], base) + "Z";
    }
    // The consoles' thresholds, not a second set: 70% is worth noticing, 90% is
    // worth acting on, everywhere in the product.
    function level(pct) { return pct >= 90 ? "hot" : pct >= 70 ? "warn" : ""; }

    // showCell is sticky on purpose. A sandbox that pauses stops answering with
    // counters, and a cell that hid itself on the way down would collapse the
    // header's layout every time the box went to sleep.
    function showCell(id) { $(id).classList.remove("hidden"); }

    function foldVitals(v) {
      const prev = vPrev;
      const cur = { at: v.at_ms, cpu: v.cpu_seconds, rx: v.net_rx_bytes, tx: v.net_tx_bytes };
      vPrev = cur;
      if (!prev) return;                       // the first reading is a baseline
      const dt = (cur.at - prev.at) / 1000;
      if (dt <= 0 || dt > V_MAX_GAP_S) return; // out of order, or slept through

      // A counter that went backwards is its device restarting at zero, not a
      // negative rate: the CPU clock follows the VMM process and resets on a
      // cold boot, and the tap counters die with the tap on every pause and
      // resume. Neither is a measurable interval, so no sample is recorded —
      // the plot holds its history rather than inventing a spike or a trough.
      if (num(cur.cpu) && num(prev.cpu) && cur.cpu >= prev.cpu) {
        push(cpuHist, (cur.cpu - prev.cpu) / dt / (v.vcpus || 1) * 100);
      }
      if (num(cur.rx) && num(prev.rx) && num(cur.tx) && num(prev.tx) &&
          cur.rx >= prev.rx && cur.tx >= prev.tx) {
        push(rxHist, (cur.rx - prev.rx) / dt);
        push(txHist, (cur.tx - prev.tx) / dt);
      }
    }

    function paintVitals(v) {
      vLast = v;
      paintIdentity(v);
      paintProxyPorts(v);
      paintTurbo(v);
      const live = v.state === "running";
      $("vitals").setAttribute("data-live", live ? "1" : "0");

      // CPU. The scale is fixed 0–100 because it is a percentage; autoscaling
      // one would make an idle machine's noise look identical to a pegged one.
      // 100% means every vCPU busy, so the reading is comparable across boxes.
      if (num(v.cpu_seconds) || cpuHist.length) {
        showCell("v-cpu");
        $("vitals").classList.remove("hidden");
        const pts = points(cpuHist, V_CPU_W, (p) => 22 - clamp(p, 0, 100) / 100 * 20);
        $("cpu-line").setAttribute("d", line(pts));
        $("cpu-area").setAttribute("d", area(pts, 22));
        const now = pts[pts.length - 1];
        $("cpu-now").classList.toggle("hidden", pts.length < 2);
        if (now) { $("cpu-now").setAttribute("cx", now[0].toFixed(2)); $("cpu-now").setAttribute("cy", now[1].toFixed(2)); }
        const cur = cpuHist.length ? cpuHist[cpuHist.length - 1] : null;
        $("cpu-val").textContent = live && cur !== null ? Math.round(cur) + "%" : "—";
        $("v-cpu").dataset.level = live && cur !== null ? level(cur) : "";
        $("v-cpu").title = cur === null
          ? "CPU — waiting for a second reading."
          : "CPU " + cur.toFixed(1) + "% of " + (v.vcpus || 1) + " vCPU" + (v.vcpus === 1 ? "" : "s") +
            " (100% is all of them busy). Last minute: peak " + Math.round(peak(cpuHist)) +
            "%, average " + Math.round(avg(cpuHist)) + "%.";
        $("v-cpu").setAttribute("aria-label", $("v-cpu").title);
      }

      // RAM. A level, not a series — one number against a ceiling, so it gets a
      // capsule rather than a plot.
      if (num(v.mem_used_mb)) {
        showCell("v-mem");
        $("vitals").classList.remove("hidden");
        const pct = v.mem_mb > 0 ? clamp(v.mem_used_mb / v.mem_mb * 100, 0, 100) : 0;
        const h = pct / 100 * 17.5;
        $("mem-fill").setAttribute("height", h.toFixed(2));
        $("mem-fill").setAttribute("y", (19.75 - h).toFixed(2));
        $("mem-val").textContent = Math.round(pct) + "%";
        $("v-mem").dataset.level = level(pct);
        $("v-mem").title = "RAM " + gb(v.mem_used_mb) + " of " + gb(v.mem_mb) + " GB (" +
          pct.toFixed(0) + "%)." +
          (v.ballooned ? " The idle reaper has handed some of this guest's RAM back to the host." : "");
        $("v-mem").setAttribute("aria-label", $("v-mem").title);
      } else if (!live) {
        $("mem-val").textContent = "—";
        $("v-mem").dataset.level = "";
      }

      // Network. Both directions share one scale — they are the same unit, and
      // two y-scales on one plot would make a trickle out look like a match for
      // a flood in.
      if (num(v.net_rx_bytes) || rxHist.length) {
        showCell("v-net");
        $("vitals").classList.remove("hidden");
        // Square root, not linear. Traffic spans orders of magnitude — an
        // apt-get against a keystroke's worth of SSH — so against a linear
        // scale one burst flattens the whole rest of the minute into the axis
        // and the plot stops reporting anything. The root compresses the tall
        // end without reordering anything: the peak still owns the full height,
        // and a trickle is still visibly smaller than a stream. The exact rate
        // is spelled out beside the plot either way.
        const top = Math.max(V_NET_FLOOR, peak(rxHist), peak(txHist));
        const swing = (p) => Math.sqrt(Math.min(1, p / top)) * 10;
        const tx = points(txHist, V_NET_W, (p) => 11 - swing(p));
        const rx = points(rxHist, V_NET_W, (p) => 11 + swing(p));
        $("tx-area").setAttribute("d", area(tx, 11));
        $("rx-area").setAttribute("d", area(rx, 11));
        $("tx-line").setAttribute("d", line(tx));
        $("rx-line").setAttribute("d", line(rx));
        const curTx = txHist.length ? txHist[txHist.length - 1] : null;
        const curRx = rxHist.length ? rxHist[rxHist.length - 1] : null;
        $("tx-val").textContent = "↑ " + (live && curTx !== null ? rate(curTx) : "—");
        $("rx-val").textContent = "↓ " + (live && curRx !== null ? rate(curRx) : "—");
        $("v-net").title = "Network: " +
          (curTx === null ? "waiting for a second reading."
            : rate(curTx) + " out, " + rate(curRx) + " in. Last minute's peak " + rate(top) + ".") +
          " Lifetime " + bytes(v.life_rx_bytes || 0) + " in, " + bytes(v.life_tx_bytes || 0) + " out.";
        $("v-net").setAttribute("aria-label", $("v-net").title);
      }

      vDelay = live ? V_POLL_MS : V_IDLE_MS;
    }

    function scheduleVitals(ms) {
      clearTimeout(vTimer);
      if (vStopped || document.hidden) return;
      vTimer = setTimeout(pollVitals, ms === undefined ? vDelay : ms);
    }

    function pollVitals() {
      fetch("/vitals", { credentials: "same-origin" })
        .then((r) => {
          // 401 expired, 403 wrong origin, 404 not yours or no such route — none
          // of which the next second will fix. The WebSocket owns recovery from
          // an expired session; the strip just stops asking.
          if (r.status === 401 || r.status === 403 || r.status === 404) { vStopped = true; return null; }
          if (!r.ok) throw new Error("vitals " + r.status);
          return r.json();
        })
        .then((v) => { if (v) { foldVitals(v); paintVitals(v); vDelay = v.state === "running" ? V_POLL_MS : V_IDLE_MS; } })
        .catch(() => { vDelay = Math.min(15000, Math.max(vDelay, V_POLL_MS) * 2); })
        .finally(() => scheduleVitals());
    }

    // A hidden tab is not watching. Stopping matters for more than the request:
    // the counters keep running while the tab sleeps, so the first reading back
    // has to be treated as a fresh baseline — vPrev is dropped rather than
    // turned into one enormous spike spanning the whole nap.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { clearTimeout(vTimer); vTimer = null; return; }
      vPrev = null;
      vDelay = V_POLL_MS;
      scheduleVitals(0);
    });

    // ---- turbo -------------------------------------------------------------
    // The switch restarts the sandbox underneath this page with double the CPU
    // and RAM. That is a cold boot — firecracker has no CPU hotplug, and a
    // memory balloon can only hand RAM back to the host, never borrow more — so
    // the shell in the grid behind the dialog is about to end. The extra
    // allocation lasts one run: the manager takes it back at the next pause.
    const TURBO_FACTOR = 2;
    let turboOn = false;        // last state /vitals reported
    let turboPending = false;   // a restart we asked for, so the hang-up is ours
    let turboWant = false;      // the state that restart is heading for

    // paintTurbo is called from every vitals poll, which is what keeps the lamp
    // honest: it reports the sandbox, not the button.
    function paintTurbo(v) {
      if (!v.turbo_available) return;
      $("turbo-row").classList.remove("hidden");
      turboOn = !!v.turbo;
      const btn = $("turbo-btn");
      btn.setAttribute("data-on", turboOn ? "1" : "0");
      btn.setAttribute("aria-pressed", turboOn ? "true" : "false");
      btn.setAttribute("aria-label", turboOn
        ? "Turn off turbo and restart this sandbox at its usual size"
        : "Turn on turbo: restart this sandbox with " + TURBO_FACTOR + "× the CPU and RAM");
      // The sentence beside the switch, which the bar's tooltip used to carry.
      // With room to be a sentence it says the sizes rather than a factor,
      // because "2× resources" is only meaningful if you already know what 1×
      // is on this host.
      $("turbo-sub").textContent = turboPending ? "Restarting…"
        : turboOn ? "On — " + v.vcpus + " vCPU and " + gb(v.mem_mb) + " GB, until this sandbox pauses"
        : TURBO_FACTOR + "× the CPU and RAM, for one run";
    }

    $("turbo-btn").addEventListener("click", () => {
      const on = !turboOn;
      // The dialog quotes real numbers, and the only place this page has them
      // is the reading the strip beside it is already drawing.
      const cur = vLast || {};
      const vcpus = cur.vcpus || 0, mem = cur.mem_mb || 0;
      const size = (n, mb) => n + " vCPU and " + gb(mb) + " GB";
      const next = on
        ? size(vcpus * TURBO_FACTOR, mem * TURBO_FACTOR)
        : size(Math.round(vcpus / TURBO_FACTOR), Math.round(mem / TURBO_FACTOR));
      $("turbo-title").textContent = on ? "Turn on turbo" : "Turn off turbo";
      $("turbo-go").textContent = on ? "Turn on turbo" : "Turn off turbo";
      $("turbo-msg").textContent = (on
        ? "Restarts " + SANDBOX + " with " + next + " — " + TURBO_FACTOR + "× its usual " +
          size(vcpus, mem) + "."
        : "Restarts " + SANDBOX + " back at " + next + ", down from " + size(vcpus, mem) + ".") +
        " This shell ends and a new one opens when it comes back." +
        (on ? " Turbo lasts until the sandbox pauses — an idle pause counts." : "");
      closeMenu(false);
      $("turbo-dlg").showModal();
      $("turbo-go").focus();
    });

    $("turbo-cancel").addEventListener("click", () => $("turbo-dlg").close());
    $("turbo-go").addEventListener("click", () => {
      $("turbo-dlg").close();
      setTurbo(!turboOn);
    });

    function setTurbo(on) {
      const btn = $("turbo-btn");
      btn.disabled = true;
      btn.setAttribute("data-busy", "1");
      turboPending = true;
      turboWant = on;
      // The custom header is the CSRF proof: a cross-site form cannot set one,
      // and a cross-origin fetch that tried would need a preflight this server
      // does not answer.
      fetch("/turbo", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json", "X-Sparkbox-Console": "1" },
        body: JSON.stringify({ on: on }),
      }).then((r) => {
        if (r.ok) return null;
        return r.text().then((t) => { throw new Error((t || "turbo failed").trim()); });
      }).then(() => {
        // The sandbox is back up — the request does not return until it is —
        // so open the new shell rather than making the user ask for it.
        turboPending = false;
        vPrev = null;   // the CPU clock restarted with the guest; do not plot the jump
        attempt = 0;
        toast(on ? SANDBOX + " is in turbo" : SANDBOX + " is back to its usual size");
        connect();
      }).catch((e) => {
        turboPending = false;
        toast(String(e.message || e).replace(/^sparkbox: /, ""), true);
        // The box may or may not have come back; either way the user is looking
        // at a dead terminal, so give them the button that fixes it.
        if (!ws) {
          setStatus("error", "failed");
          overlay("Turbo failed", String(e.message || e).replace(/^sparkbox: /, ""),
            { action: "Reconnect" });
        }
      }).finally(() => {
        btn.disabled = false;
        btn.removeAttribute("data-busy");
      });
    }

    connect();
    pollVitals();
  })();
  </script>
</body>
</html>
