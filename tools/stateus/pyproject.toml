[project]
name = "stateus"
version = "0.2.0"
description = "Reconstruct a per-day location ledger from photo and timeline evidence, for day-count tax purposes."
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
    "reverse_geocoder>=1.5",
    "numpy>=1.24",
]

[project.scripts]
stateus = "stateus:main"
