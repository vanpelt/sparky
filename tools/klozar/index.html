<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Zilla+Slab:wght@500;700&display=swap">
<style>
:root {
  --paper: #f4f5f2;
  --raised: #fbfbf9;
  --ink: #17181c;
  --muted: #6f7469;
  --faint: #9aa093;
  --rule: #dcded7;
  --pen: #c8342b;
  --pen-soft: #f0d9d6;
  --done: #2f6f5e;
  --done-soft: #dbe8e3;
  --star: #b07d1a;
  --focus: #2f6f5e;
  --shadow: 0 1px 2px rgba(23, 24, 28, .06);
  --serif: Literata, Georgia, "Times New Roman", serif;
  --slab: "Zilla Slab", Rockwell, Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171a18;
    --raised: #1e2220;
    --ink: #e8e9e4;
    --muted: #969c93;
    --faint: #6d746c;
    --rule: #2a2e2b;
    --pen: #e8635a;
    --pen-soft: #3a2523;
    --done: #5ba88f;
    --done-soft: #1f2f2a;
    --star: #d9a94b;
    --focus: #5ba88f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --paper: #171a18;
  --raised: #1e2220;
  --ink: #e8e9e4;
  --muted: #969c93;
  --faint: #6d746c;
  --rule: #2a2e2b;
  --pen: #e8635a;
  --pen-soft: #3a2523;
  --done: #5ba88f;
  --done-soft: #1f2f2a;
  --star: #d9a94b;
  --focus: #5ba88f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 47rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }

/* --- masthead --- */
.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 1.25rem; }
.eyebrow {
  font-family: var(--slab); font-weight: 500; font-size: .7rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
h1 {
  font-family: var(--slab); font-weight: 700; font-size: clamp(1.75rem, 5vw, 2.5rem);
  line-height: 1.1; margin: .35rem 0 0; text-wrap: balance; letter-spacing: -.01em;
}
.tally { display: flex; flex-wrap: wrap; gap: 1.75rem; margin-top: 1.25rem; }
.tally div { display: flex; flex-direction: column; gap: .1rem; }
.tally b {
  font-family: var(--slab); font-weight: 700; font-size: 1.5rem;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.tally span {
  font-family: var(--slab); font-size: .7rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
.tally .miss b { color: var(--pen); }
.tally .cov b { color: var(--done); }

/* --- controls --- */
.controls {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
  margin: 1.25rem 0 0; padding-bottom: .25rem;
}
button {
  font-family: var(--slab); font-weight: 500; font-size: .78rem;
  letter-spacing: .04em; color: var(--ink); background: var(--raised);
  border: 1px solid var(--rule); border-radius: 3px; padding: .4rem .7rem;
  cursor: pointer; transition: border-color .12s, color .12s;
}
button:hover { border-color: var(--ink); }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick {
  font-family: var(--slab); font-weight: 500; font-size: .78rem;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--rule); border-radius: 3px;
  padding: .4rem 1.6rem .4rem .7rem; cursor: pointer;
  appearance: none; -webkit-appearance: none;
  /* Caret drawn in the ink token so it survives both themes. */
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right .72rem center, right .5rem center;
  background-size: .3rem .3rem, .3rem .3rem;
  background-repeat: no-repeat;
}
.pick:hover { border-color: var(--ink); }
.pick[hidden] { display: none; }
.saving {
  margin-left: auto; font-family: var(--slab); font-size: .7rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
}

/* --- sections --- */
section { margin-top: 3rem; }
h2 {
  font-family: var(--slab); font-weight: 700; font-size: 1.15rem;
  margin: 0; letter-spacing: -.005em;
}
.blurb { color: var(--muted); font-size: .9rem; margin: .3rem 0 0; max-width: 34rem; }
.rows { border-top: 1px solid var(--rule); margin-top: 1.1rem; }

/* --- one sentence --- */
.row {
  display: grid; grid-template-columns: 1.6rem 1fr; gap: 0 .85rem;
  border-bottom: 1px solid var(--rule); padding: .95rem .6rem .95rem .5rem;
  position: relative; transition: background .12s;
}
.row::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--pen); opacity: var(--sev, 0);
}
.row:hover { background: var(--raised); }
.row.is-covered { background: var(--done-soft); }
.row.is-covered .sr { text-decoration: line-through; text-decoration-color: var(--done); }

.tick {
  appearance: none; -webkit-appearance: none; margin: .35rem 0 0; width: 1.15rem; height: 1.15rem;
  border: 1.5px solid var(--faint); border-radius: 3px; background: var(--raised);
  cursor: pointer; display: grid; place-content: center; flex: none;
}
.tick:checked { background: var(--done); border-color: var(--done); }
/* The carried-over state: covered in an earlier week, not yet in this one. */
.tick:indeterminate { border-color: var(--done); background: var(--done-soft); }
.tick:indeterminate::after {
  content: ""; width: .5rem; height: 0; border-top: 2px solid var(--done);
}
.tick:checked::after {
  content: ""; width: .34rem; height: .62rem; margin-top: -.12rem;
  border: solid var(--raised); border-width: 0 2px 2px 0; transform: rotate(42deg);
}

.body { min-width: 0; }
.sr { font-size: 1.16rem; line-height: 1.4; margin: 0; }
.cloze {
  background: none; color: inherit; font-weight: 600;
  border-bottom: 2px solid var(--pen); padding-bottom: 1px;
}
.en {
  font-size: .97rem; color: var(--muted); font-style: italic;
  margin: .2rem 0 0; transition: opacity .12s;
}
.hidden-en .en { opacity: 0; }
.hidden-en .en:hover, .hidden-en .en:focus-within { opacity: 1; }

.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
  margin-top: .5rem; font-family: var(--mono); font-size: .72rem;
  color: var(--faint); font-variant-numeric: tabular-nums;
}
.meta .miss { color: var(--pen); }
.meta .star { color: var(--star); }
.notebtn {
  font-family: var(--mono); font-size: .72rem; letter-spacing: 0;
  padding: .1rem .4rem; background: none; border: 1px dashed var(--rule);
}
.notebtn.has-note { border-style: solid; border-color: var(--done); color: var(--done); }

.note { margin-top: .55rem; }
.note[hidden] { display: none; }
textarea {
  width: 100%; min-height: 4.5rem; resize: vertical; padding: .55rem .65rem;
  font-family: var(--serif); font-size: .93rem; line-height: 1.45;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--rule); border-left: 3px solid var(--done); border-radius: 3px;
}
textarea::placeholder { color: var(--faint); font-style: italic; }
/* Someone else holds this field: it is theirs until they pause. */
textarea[readonly] { border-left-color: var(--star); background: var(--paper); cursor: default; }
.typing {
  display: flex; align-items: center; gap: .45rem; margin: 0 0 .35rem;
  font-family: var(--mono); font-size: .72rem; color: var(--star);
}
.typing[hidden] { display: none; }
.typing::before {
  content: ""; width: .45rem; height: .45rem; border-radius: 50%;
  background: var(--star); animation: typing 1s ease-in-out infinite;
}
@keyframes typing { 50% { opacity: .25; } }
.pad .typing { margin: .8rem 0 0; }
.pad .typing + textarea { margin-top: .35rem; }
.who {
  font-family: var(--slab); font-size: .78rem; color: var(--ink);
  background: var(--raised); border: 1px solid var(--rule); border-radius: 3px;
  padding: .4rem .6rem; width: 8.5rem;
}
.who::placeholder { color: var(--faint); }

.legend {
  display: flex; align-items: center; gap: .45rem; margin: .9rem 0 0;
  font-family: var(--slab); font-size: .72rem; letter-spacing: .04em;
  color: var(--muted);
}
.legend[hidden] { display: none; }
.legend .box {
  width: .95rem; height: .95rem; flex: none; border-radius: 3px;
  border: 1.5px solid var(--done); background: var(--done-soft);
  display: grid; place-content: center;
}
.legend .box::after {
  content: ""; width: .42rem; height: 0; border-top: 2px solid var(--done);
}

/* --- the week's own notes --- */
.pad { margin-top: 2rem; }
.pad h2 { font-size: 1rem; }
.pad textarea {
  margin-top: .8rem; min-height: 3.6rem; overflow: hidden;   /* it grows to fit */
  font-size: .98rem;
}

.more {
  display: block; width: 100%; margin-top: .7rem; text-align: center;
  border-style: dashed; color: var(--muted);
}
.empty {
  color: var(--muted); font-style: italic; margin: 2.5rem 0 0;
  padding: 1.1rem; border: 1px dashed var(--rule); border-radius: 3px;
  text-align: center;
}

/* --- word list --- */
.words { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1.1rem; }
.words span {
  font-family: var(--mono); font-size: .8rem; padding: .2rem .5rem;
  background: var(--raised); border: 1px solid var(--rule); border-radius: 3px;
}

footer {
  margin-top: 3.5rem; padding-top: 1.1rem; border-top: 1px solid var(--rule);
  font-family: var(--slab); font-size: .76rem; color: var(--faint);
  display: flex; flex-wrap: wrap; gap: .4rem 1rem; justify-content: space-between;
}
</style>
</head>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <div class="tally">
      <div><b id="n-played"></b><span>practiced</span></div>
      <div class="miss"><b id="n-missed"></b><span>missed</span></div>

      placeholder="Your name" aria-label="Your name, shown while you type">

  <section class="pad">

    <p class="typing" id="pad-typing" hidden></p>
    <textarea id="week-note" aria-label="Notes for this week"
      placeholder="Notes for the week…"></textarea>
  </section>

  <main id="sections"></main>

  <footer>
    <span id="stamp"></span>
    <span>klozar &middot; Clozemaster</span>
  </footer>
</div>

  var CONFIG = JSON.parse(document.getElementById("klozar-config").textContent);
  var BAKED = JSON.parse(document.getElementById("lesson-data").textContent);

  // Three views of every note. `state` is what this browser shows and edits.
  // `shadow` is the last version we know the store held — the common ancestor a
  // three-way merge needs, plus the `rev` a write has to match to be accepted.
  // The store itself is the third. Without the ancestor, reconciling two edits
  // is guesswork; with it, most pairs of edits merge with nobody noticing.
  var sheet, KEY, BASE, state = {}, shadow = {}, pageIds = {}, sync = null;
  var inflight = {}, queued = {}, timers = {};
  var savingEl = document.getElementById("saving");

  // How the sheet is read — the ordering and the starred filter — is a habit,
  // not a property of any one week. It lives under its own key so switching
  // weeks keeps it, and so it never rides along with the notes that sync.
  var PREFS_KEY = "klozar:prefs";
  var prefs = { order: "mix", starred: false };
  try {
    var saved = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") || {};
    if (saved.order) prefs.order = saved.order;
    prefs.starred = !!saved.starred;
  } catch (e) { /* private window — the defaults are fine */ }

  function savePrefs() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
  }

  // Which sections the reader has opened past the fold, by index. Deliberately
  // survives a re-sort: having asked to see everything, you should not lose the
  // rows again just because you changed the order they are in.
  var expanded = {};

  function status(text) { savingEl.textContent = text; }

  // Three kinds of thing get stored and they do not share a lifetime, so they
  // cannot share a row or a revision. A sentence's NOTE follows the sentence and
  // outlives any one week — what you worked out about "posebno" is still true in
  // November. Its TICK answers "did I review it *this* week", which is only ever
  // about one week. The PAD belongs to the week. Each is its own sync key with
  // its own revision, while the page above goes on reading `state[id]` as one
  // object per sentence.
  var WEEK_KEY = "__week__";
  var padEl = document.getElementById("week-note");

  function noteKey(id) { return "n:" + id; }
  function tickKey(id) { return "t:" + id; }

  function cellOf(key) {
    if (key === WEEK_KEY) return { id: WEEK_KEY, kind: "pad" };
    return { id: key.slice(2), kind: key.charAt(0) === "n" ? "note" : "tick" };
  }

  function readCell(key) {
    var c = cellOf(key), e = entry(c.id);
    return c.kind === "tick" ? { note: "", covered: !!e.covered }
                             : { note: e.note, covered: false };
  }

  function writeCell(key, val) {
    var c = cellOf(key), e = entry(c.id);
    if (c.kind === "tick") e.covered = !!val.covered;
    else e.note = val.note || "";
  }

  // Sentences ticked in some earlier week. Not a state of the sentence, a fact
  // about my history with it, which is why it never rides in `state`.
  var prior = {};

  function entry(id) {
    if (!state[id]) state[id] = { note: "", covered: false };
    return state[id];
  }

  // A textarea that grows with its content: the pad sits above the sheet, so a
  // fixed box would either waste the fold when empty or hide the notes when full.
  function growPad() {
    padEl.style.height = "auto";
    padEl.style.height = padEl.scrollHeight + "px";
  }

  function showPad() {
    patch(padEl, entry(WEEK_KEY).note);
    growPad();
  }

  function ancestor(id) {
    if (!shadow[id]) shadow[id] = { note: "", covered: false, rev: 0 };
    return shadow[id];
  }

  // Two scopes on disk, because a note is not week-scoped any more: the ticks and
  // the pad go under the week, the notes go somewhere every week can read them.
  // Splitting here rather than keying `state` differently keeps the rendering
  // code working on one object per sentence.
  var NOTES_KEY = "klozar:notes";
  var NOTES_BASE = "klozar:base:notes";
  var PRIOR_KEY = "klozar:prior";

  function saveLocal() {
    var week = {}, notes = {}, weekBase = {}, noteBase = {}, id, k;
    for (id in state) {
      if (id === WEEK_KEY) { week[id] = { note: state[id].note }; continue; }
      // An older page could leave a sync key in `state`; it is not a sentence
      // and writing it back out would keep it alive forever.
      if (id.indexOf(":") >= 0) continue;
      week[id] = { covered: !!state[id].covered };
      if (state[id].note) notes[id] = state[id].note;
    }
    for (k in shadow) {
      if (k.indexOf("n:") === 0) noteBase[k] = shadow[k];
      else weekBase[k] = shadow[k];
    }
    var carried = [];
    for (id in prior) if (prior[id]) carried.push(id);
    try {
      localStorage.setItem(KEY, JSON.stringify(week));
      localStorage.setItem(BASE, JSON.stringify(weekBase));
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      localStorage.setItem(NOTES_BASE, JSON.stringify(noteBase));
      localStorage.setItem(PRIOR_KEY, JSON.stringify(carried));
    } catch (e) {
      /* private window, full quota — the page still works, just forgets */
    }
  }

  // Text streams out while it is being typed rather than on a pause: whoever is
  // watching should see words arrive, not a paragraph after the typist stops.
  // A throttle, not a debounce — the timer is not reset by the next keystroke,
  // so steady typing still publishes every STREAM_MS. Holding the field's lease
  // is what makes this safe; the merge underneath is only for a lost race.
  var STREAM_MS = 600;
  function nudge(id) {
    saveLocal();
    claim(id);
    if (timers[id]) return;
    timers[id] = setTimeout(function () { delete timers[id]; push(id); }, STREAM_MS);
  }

  // --- who is typing where ------------------------------------------------
  //
  // Merging two people's edits after the fact was always going to feel clunky:
  // text jumps, lines reorder, and the caret moves under you. So a field now has
  // an owner while someone types in it. The first keystroke claims a short lease
  // on the server; everyone else sees "<name> is typing…" and the field goes
  // read-only until the lease lapses — LEASE_MS after the last keystroke — or the
  // typist leaves it. It is advisory: two first keystrokes inside one round trip
  // can both land, and then the merge below settles it exactly as before.
  //
  // Lease time is the server's clock, compared on the server, and handed back as
  // "milliseconds left" — so neither browser's clock ever has to agree with the
  // other's, which is the skew trap an updated_at guard fell into.
  var LEASE_MS = 5000, RENEW_MS = 2000, PULSE_MS = 2000;
  var ME = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  var NAME_KEY = "klozar:name";
  var myName = "";
  try { myName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
  var held = {}, leases = {};
  var padTyping = document.getElementById("pad-typing");

  // The pad is one row per week, but a note is one row forever, so the pad's
  // lease names its week or two weeks' pads would lock each other.
  function leaseKey(key) { return key === WEEK_KEY ? "w:" + sheet.week : key; }

  function claim(key) {
    if (!sync || !sync.claim || cellOf(key).kind === "tick") return;
    var h = held[key], now = performance.now();
    if (h && (h.pending || h.at + RENEW_MS > now)) return;
    var mine = { at: now, pending: true };
    held[key] = mine;
    sync.claim(leaseKey(key), ME, myName, LEASE_MS).then(function (res) {
      if (held[key] !== mine) return;
      mine.pending = false;
      if (res.mine) { delete leases[key]; return; }
      // Lost the race to someone who started first: theirs until they pause.
      delete held[key];
      leases[key] = { name: res.name, until: performance.now() + res.left };
      showLocks();
    }).catch(function () { if (held[key] === mine) delete held[key]; });
  }

  // Let go once the last write has landed, not before: releasing first would
  // let the other person start typing over a version missing our last words.
  // A claim made after this was scheduled replaces `held[key]`, so a quick
  // leave-and-come-back does not drop the lease it just renewed.
  function release(key) {
    var h = held[key];
    if (!h || !sync || !sync.release) return;
    Promise.resolve(inflight[key]).then(function () {
      if (held[key] !== h || timers[key]) return;
      delete held[key];
      sync.release(leaseKey(key), ME);
    });
  }

  // readOnly alone is not enough: text inserted programmatically — dictation,
  // an IME commit, some automation — can skip it and land in a held field,
  // which is exactly the two-writer case the lease exists to prevent.
  function guard(ta, key) {
    ta.addEventListener("beforeinput", function (e) {
      if (lockedBy(key)) e.preventDefault();
    });
  }

  function lockedBy(key) {
    var l = leases[key];
    return l && l.until > performance.now() ? l : null;
  }

  function paintLock(ta, label, l) {
    ta.readOnly = !!l;
    label.hidden = !l;
    if (l) label.textContent = (l.name || "Someone") + " is typing…";
  }

  function showLocks() {
    var rows = document.querySelectorAll(".row[data-id]");
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i], l = lockedBy(noteKey(row.dataset.id));
      paintLock(row.querySelector("textarea"), row.querySelector(".typing"), l);
      // Open the panel so the watcher sees the words arrive.
      if (l) row.querySelector(".note").hidden = false;
    }
    paintLock(padEl, padTyping, lockedBy(WEEK_KEY));
  }

  // What the pulse said: who holds what, and the text of whatever they hold.
  // Returns true when a lease vanished, because the holder's last words were
  // written just before letting go and no pulse carries a field nobody holds.
  function absorbLeases(rows) {
    var next = {}, got = { notes: [] }, padKey = "w:" + sheet.week, vanished = false;
    rows.forEach(function (r) {
      if (r.client === ME) return;
      var key = r.key === padKey ? WEEK_KEY : r.key;
      if (key !== WEEK_KEY && key.indexOf("n:") !== 0) return;   // another week's pad
      next[key] = { name: r.name, until: performance.now() + r.left };
      if (r.rev == null) return;                     // claimed, nothing written yet
      if (key === WEEK_KEY) got.pad = { note: r.note, covered: false, rev: r.rev };
      else got.notes.push({ id: key.slice(2), note: r.note, rev: r.rev });
    });
    for (var k in leases) if (!next[k]) vanished = true;
    leases = next;
    absorb(got);
    showLocks();
    return vanished;
  }

  function flush(id) {
    if (timers[id]) { clearTimeout(timers[id]); delete timers[id]; }
    push(id);
  }

  // One write in flight per sentence. Ticking a box and then typing a note fires
  // two saves for the same row, and without this the slower first request can
  // land last and overwrite the newer state with the older one — which silently
  // ate a note the first time this was tested. A second change while a save is
  // out just sets a flag; the re-run reads current state, so only the latest
  // wins and intermediate values never need their own request.
  //
  // The write itself is a compare-and-swap on `rev`: it only lands if the store
  // is still on the revision this browser last saw. Losing the race is normal,
  // not an error — the answer carries whatever is actually there, which gets
  // merged into what is on screen and written back on the next attempt. So an
  // edit is never replaced by one that never saw it.
  function push(id) {
    saveLocal();
    if (!sync) return;
    if (inflight[id]) { queued[id] = true; return; }

    var marked = false;
    var attempt = function (tries) {
      return sync.save(id, ancestor(id).rev).then(function (res) {
        if (res && res.ok) {
          // `id` here is a sync key, not a sentence id — `entry()` would invent
          // a blank one and record the ancestor as empty text at the new
          // revision, which is the blank base that let two appends duplicate.
          var e = readCell(id);
          shadow[id] = { note: e.note, covered: !!e.covered, rev: res.rev };
          saveLocal();
          // Markers in the text need saying out loud, or they read as corruption.
          status(marked ? "Both edited — kept both" : "Shared");
          return;
        }
        // Somebody wrote between our read and our write. Fold their version in
        // and go again from their revision rather than picking a winner.
        var merged = absorbOne(id, res && res.remote);
        if (merged && merged.conflict) marked = true;
        applyOne(id);
        if (tries > 0) return attempt(tries - 1);
        status(marked ? "Both edited — kept both" : "Saved on this device");
      });
    };

    inflight[id] = attempt(3)
      .catch(function () { status("Saved on this device"); })
      .then(function () {
        delete inflight[id];
        if (queued[id]) { delete queued[id]; push(id); }
      });
  }

  // Reconcile one key against the store's version of it. Returns null when
  // there was nothing to do, so callers know whether to touch the DOM.
  function absorbOne(key, remote) {
    if (!remote) return null;
    var mine = readCell(key), b = ancestor(key), c = cellOf(key);
    var adopt = function () {
      shadow[key] = { note: remote.note || "", covered: !!remote.covered, rev: remote.rev };
    };

    // Revisions only ever move forward. A poll issued before this browser's last
    // write can land after it, and taking that answer would rewind the ancestor
    // to a version of the text that has already been superseded — which is how a
    // note ends up being merged against a stale copy of itself.
    if (remote.rev < b.rev) return null;

    // Already agreed — take their revision so the next write has the right base.
    // This is also what a browser upgrading from the pre-`rev` page does.
    if (mine.note === (remote.note || "") && mine.covered === !!remote.covered) {
      adopt(); saveLocal(); return null;
    }
    if (remote.rev === b.rev && (remote.note || "") === b.note &&
        !!remote.covered === !!b.covered) return null;             // nothing new

    var result = { conflict: false };
    if (mine.note === b.note && mine.covered === !!b.covered) {
      writeCell(key, { note: remote.note || "", covered: !!remote.covered });
    } else if (c.kind === "tick") {
      // A tick is one bit: whoever moved it off the ancestor wins, and if both
      // moved it they necessarily agree.
      writeCell(key, { covered: mine.covered !== !!b.covered ? mine.covered
                                                            : !!remote.covered });
    } else {
      var m = merge3(b.note, mine.note, remote.note || "");
      writeCell(key, { note: m.text });
      result.conflict = m.conflict;
    }
    adopt();
    saveLocal();
    return result;
  }

  function applyOne(key) {
    var c = cellOf(key);
    if (c.kind === "pad") showPad(); else reflect(c.id);
  }

  // Everything the store just told us, in one pass.
  function absorb(got) {
    var touched = [], owed = [], marked = false;
    var take = function (key, remote) {
      // A response is on the wire for this key; it will set the ancestor when it
      // lands, and reconciling against a stale read now would corrupt it. A
      // pending `timers` entry means the same thing one step earlier: someone is
      // typing here and the store has not been told yet, so anything it says
      // about this key predates what is on screen.
      if (inflight[key] || queued[key] || timers[key]) return;
      var merged = absorbOne(key, remote);
      if (!merged) return;
      if (merged.conflict) marked = true;
      touched.push(key);
      var mine = readCell(key);
      // A merge can produce something neither side has yet. That has to go back.
      if (mine.note !== (remote.note || "") || mine.covered !== !!remote.covered) {
        owed.push(key);
      }
    };

    (got.ticks || []).forEach(function (r) {
      take(tickKey(r.id), { note: "", covered: r.covered, rev: r.rev });
    });
    (got.notes || []).forEach(function (r) {
      take(noteKey(r.id), { note: r.note, covered: false, rev: r.rev });
    });
    if (got.pad) take(WEEK_KEY, got.pad);

    var priorMoved = false;
    if (got.prior) {
      var next = {}, id;
      got.prior.forEach(function (x) { next[x] = true; });
      for (id in next) if (!prior[id]) priorMoved = true;
      for (id in prior) if (!next[id]) priorMoved = true;
      prior = next;
      if (priorMoved) saveLocal();
    }

    if (!touched.length && !priorMoved) return false;
    touched.forEach(applyOne);
    // A change in what was carried over repaints every box, not one.
    if (priorMoved) repaintTicks();
    countCovered();
    owed.forEach(push);
    if (marked) status("Both edited — kept both");
    return true;
  }

  function repaintTicks() {
    var rows = document.querySelectorAll(".row[data-id]");
    for (var i = 0; i < rows.length; i++) reflect(rows[i].dataset.id);
    showLegend();
  }

  // --- merging two people's text ----------------------------------------
  //
  // This used to be a line-level three-way merge over an LCS, and it corrupted
  // notes in the field: one sentence reached rev 47 carrying four copies of
  // itself, interleaved with fragments cut off mid-word. Any merge that decides
  // *where* text goes has to answer whether two blocks are one edit seen twice
  // or two different edits, and against an ancestor that had rewound — a stale
  // poll, a write still on the wire — it always answered "two", and appended a
  // second copy. The two browsers then appended in opposite orders, so every
  // exchange produced a fresh text for the other to merge again, silently.
  //
  // What replaced it cannot duplicate anything, because it never counts a line
  // twice. A note is a handful of lines, so the question is answerable on the
  // set of them: if one side's lines all appear on the other side, that side has
  // nothing to add and the fuller text wins outright — which is the exact shape
  // of a stale read. Only when each side holds a line the other lacks is
  // anything combined, and then the result is a union, where a line appears once.
  //
  // Converging matters as much as not duplicating. Two browsers merging the same
  // pair of texts in opposite roles reach the same set of lines in different
  // orders; left there they would trade versions forever, so the tie goes to the
  // lexicographically smaller text — a rule both compute identically and neither
  // side favours.

  function splitLines(t) { return t ? String(t).split("\n") : []; }

  // Blank lines are spacing: they repeat legitimately and say nothing about who
  // wrote what, so they sit out every comparison. `#` keeps a line of text from
  // colliding with a property name like "constructor".
  function contentLines(t) {
    var out = [];
    splitLines(t).forEach(function (l) {
      if (l.trim()) out.push(l.trim());
    });
    return out;
  }

  function covers(big, small) {
    var have = {}, i;
    for (i = 0; i < big.length; i++) have["#" + big[i]] = true;
    for (i = 0; i < small.length; i++) {
      if (have["#" + small[i]]) continue;
      // A copy that was on the wire while someone kept typing is a prefix of
      // what they have now, so its *last* line can be half a word. Only the last
      // one, and only with an earlier line that matched exactly to show this
      // really is the same text seen earlier — otherwise a note reading "da"
      // would vanish into someone else's "dakle", which is the kind of quiet
      // loss this whole merge exists to prevent.
      if (i === small.length - 1 && i > 0 && endsOpen(big, small[i])) continue;
      return false;
    }
    return true;
  }

  function endsOpen(big, partial) {
    for (var i = 0; i < big.length; i++) {
      if (big[i].length > partial.length && big[i].indexOf(partial) === 0) return true;
    }
    return false;
  }

  // Both sides' lines, each one once, mine first. Runs of blank lines collapse
  // rather than accumulating a little more padding on every exchange.
  function union(mineText, theirsText) {
    var out = [], seen = {};
    var add = function (t) {
      splitLines(t).forEach(function (l) {
        var k = l.trim();
        if (!k) {
          if (out.length && out[out.length - 1].trim()) out.push("");
          return;
        }
        if (seen["#" + k]) return;
        seen["#" + k] = true;
        out.push(l);
      });
    };
    add(mineText);
    add(theirsText);
    while (out.length && !out[out.length - 1].trim()) out.pop();
    return out.join("\n");
  }

  function merge3(baseText, mineText, theirsText) {
    var base = baseText || "", mine = mineText || "", theirs = theirsText || "";
    if (mine === theirs) return { text: mine, conflict: false };
    if (mine === base) return { text: theirs, conflict: false };   // only they moved
    if (theirs === base) return { text: mine, conflict: false };   // only I moved

    var a = contentLines(mine), b = contentLines(theirs);
    var mineHasTheirs = covers(a, b), theirsHasMine = covers(b, a);
    if (mineHasTheirs && theirsHasMine) {
      return { text: mine < theirs ? mine : theirs, conflict: false };
    }
    if (mineHasTheirs) return { text: mine, conflict: false };
    if (theirsHasMine) return { text: theirs, conflict: false };
    return { text: union(mine, theirs), conflict: true };
  }

  // Replace a textarea's text without throwing the caret to the end — the whole
  // point of applying someone else's edit while you are still typing.
  function patch(ta, next) {
    var prev = ta.value;
    if (prev === next) return;
    if (ta !== document.activeElement) { ta.value = next; return; }
    var start = ta.selectionStart, end = ta.selectionEnd;
    var p = 0;
    while (p < prev.length && p < next.length && prev.charAt(p) === next.charAt(p)) p++;
    var s = 0;
    while (s < prev.length - p && s < next.length - p &&
           prev.charAt(prev.length - 1 - s) === next.charAt(next.length - 1 - s)) s++;
    var delta = next.length - prev.length;
    var map = function (pos) {
      if (pos <= p) return pos;                          // ahead of the change
      if (pos >= prev.length - s) return pos + delta;    // behind it
      return p;                                          // inside it
    };
    ta.value = next;
    ta.setSelectionRange(map(start), map(end));
  }

  // --- rendering ---

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function clozed(text) {
    return esc(text).replace(/\{\{(.+?)\}\}/g, '<mark class="cloze">$1</mark>');
  }

  // The sentence with the cloze braces taken out, for screen readers.
  function plain(text) {
    return String(text || "").replace(/\{\{(.+?)\}\}/g, "$1");
  }

  // --- ordering ---------------------------------------------------------
  //
  // The same blend klozar.py ranks with, restated because the page re-sorts
  // client-side: mostly how badly the sentence went, tempered by how recent it
  // is, with a nudge for anything starred by hand. Keep the weights in step
  // with BLEND in klozar.py or the sheet opens in an order it then contradicts.
  var W = { miss: 0.55, recency: 0.30, star: 0.15 };
  var newest = 0, spanDays = 7;   // both set per sheet in start()

  // Parsed as UTC: a local-midnight parse shifts whole days either side of the
  // date line, which is enough to reorder a week.
  function day(s) { return Date.parse((s || "1970-01-01") + "T00:00:00Z"); }
  function rate(s) { return s.played ? s.missed / s.played : 0; }

  function blend(s) {
    var age = (newest - day(s.last)) / 86400000;
    var recency = Math.max(0, 1 - age / Math.max(spanDays, 1));
    return W.miss * rate(s) + W.recency * recency + W.star * (s.favorited ? 1 : 0);
  }

  var ORDERS = [
    { key: "mix", label: "Worst & freshest", cmp: function (a, b) {
        return blend(b) - blend(a) || b.missed - a.missed || day(b.last) - day(a.last);
      } },
    { key: "recent", label: "Most recent", cmp: function (a, b) {
        return day(b.last) - day(a.last) || blend(b) - blend(a);
      } },
    { key: "missed", label: "Worst miss rate", cmp: function (a, b) {
        return rate(b) - rate(a) || b.missed - a.missed || day(b.last) - day(a.last);
      } }
  ];

  function order() {
    for (var i = 0; i < ORDERS.length; i++) {
      if (ORDERS[i].key === prefs.order) return ORDERS[i];
    }
    return ORDERS[0];
  }

  // A sentence can be on the page more than once — missed *and* starred, new
  // *and* starred. `state` is keyed by sentence id, so editing one copy always
  // recorded the right thing; it was the other copies' controls that sat stale.
  // This also lands remote edits, so every copy is patched rather than assigned
  // and a box someone is typing in keeps its caret.
  function reflect(id) {
    var e = entry(id);
    var rows = document.querySelectorAll('.row[data-id="' + id + '"]');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      row.classList.toggle("is-covered", !!e.covered);
      var tick = row.querySelector(".tick");
      if (tick !== document.activeElement) {
        tick.checked = !!e.covered;
        markTick(tick, id, e);
      }
      var btn = row.querySelector(".notebtn");
      btn.classList.toggle("has-note", !!e.note);
      btn.textContent = e.note ? "note" : "+ note";
      patch(row.querySelector("textarea"), e.note);
      // Open a panel that has something in it; never close one out from under
      // whoever opened it to type.
      if (e.note) row.querySelector(".note").hidden = false;
    }
  }

  // Not covered this week, but covered in one before: the box goes to the
  // browser's own third state rather than looking untouched, so a sentence you
  // have already worked through is visibly different from one you have not.
  function markTick(tick, id, e) {
    var carried = !e.covered && !!prior[id];
    tick.indeterminate = carried;
    tick.title = e.covered ? "Covered this week"
      : carried ? "Reviewed in an earlier week — not yet this week"
      : "";
  }

  function showLegend() {
    var el = document.getElementById("legend");
    var rows = document.querySelectorAll(".row[data-id]");
    var any = false;
    for (var i = 0; i < rows.length && !any; i++) {
      var id = rows[i].dataset.id;
      if (!entry(id).covered && prior[id]) any = true;
    }
    el.hidden = !any;
  }

  function rowEl(s) {
    var e = entry(s.id);
    var row = document.createElement("div");
    row.className = "row" + (e.covered ? " is-covered" : "");
    // The stripe reads miss rate directly: darker edge, harder sentence.
    row.style.setProperty("--sev", s.played ? (s.missed / s.played).toFixed(2) : 0);

    var bits = ["level " + s.level];
    if (s.missed) bits.push('<span class="miss">missed ' + s.missed + " of " + s.played + "</span>");
    else bits.push("seen " + s.played + "×");
    if (s.favorited) bits.push('<span class="star">★ starred</span>');
    bits.push(s.last);

    row.innerHTML =
      '<input class="tick" type="checkbox" ' + (e.covered ? "checked" : "") +
        ' aria-label="Mark &quot;' + esc(plain(s.text)) + '&quot; as covered">' +
      '<div class="body">' +
        '<p class="sr">' + clozed(s.text) + "</p>" +
        '<p class="en">' + esc(s.translation) + "</p>" +
        '<div class="meta">' + bits.join('<span aria-hidden="true">&middot;</span>') +
          '<button class="notebtn' + (e.note ? " has-note" : "") + '" type="button">' +
            (e.note ? "note" : "+ note") + "</button>" +
        "</div>" +
        '<div class="note"' + (e.note ? "" : " hidden") + '>' +
          '<p class="typing" hidden></p>' +
          '<textarea placeholder="What came up in the lesson…">' + esc(e.note) + "</textarea>" +
        "</div>" +
      "</div>";

    var tick = row.querySelector(".tick");
    var btn = row.querySelector(".notebtn");
    var note = row.querySelector(".note");
    var ta = row.querySelector("textarea");

    markTick(tick, String(s.id), e);

    tick.addEventListener("change", function () {
      var mine = entry(s.id);
      mine.covered = tick.checked;
      // Unticking falls back to the carried-over dash rather than to empty:
      // this week is undone, the earlier weeks still happened.
      markTick(tick, String(s.id), mine);
      reflect(s.id);
      countCovered();
      showLegend();
      flush(tickKey(s.id));
    });

    btn.addEventListener("click", function () {
      note.hidden = !note.hidden;
      if (!note.hidden) ta.focus();
    });

    // The buffer and `state` stay identical keystroke by keystroke, so a remote
    // edit arriving mid-word merges against what is actually on screen. Only
    // the network write waits for a pause.
    guard(ta, noteKey(s.id));
    ta.addEventListener("input", function () {
      entry(s.id).note = ta.value;
      reflect(s.id);
      nudge(noteKey(s.id));
    });

    ta.addEventListener("blur", function () {
      var v = ta.value.trim();
      if (v !== entry(s.id).note || timers[noteKey(s.id)]) {
        entry(s.id).note = v;
        reflect(s.id);
        flush(noteKey(s.id));
      }
      release(noteKey(s.id));
    });

    row.dataset.id = s.id;
    return row;
  }

  function render() {
    var host = document.getElementById("sections");
    var cmp = order().cmp;
    var limit = sheet.limit || 25;
    var total = 0;
    host.textContent = "";
    sheet.sections.forEach(function (sec, i) {
      var items = prefs.starred
        ? sec.items.filter(function (s) { return s.favorited; })
        : sec.items;
      if (!items.length) return;
      // slice() because sec.items is the sheet's own array when nothing is
      // filtered out, and sort() would reorder it in place.
      items = items.slice().sort(cmp);
      total += items.length;

      var el = document.createElement("section");
      var head = document.createElement("h2");
      head.textContent = sec.title;
      var blurb = document.createElement("p");
      blurb.className = "blurb";
      blurb.textContent = sec.blurb;
      var rows = document.createElement("div");
      rows.className = "rows";
      var cut = expanded[i] ? items.length : Math.min(limit, items.length);
      items.slice(0, cut).forEach(function (s) { rows.appendChild(rowEl(s)); });
      el.appendChild(head);
      el.appendChild(blurb);
      el.appendChild(rows);

      // Every matching sentence is in the data; a section just opens on the
      // first `limit` of them so the top of the current order is the top of
      // the page rather than row 40 of a scroll.
      if (items.length > limit) {
        var more = document.createElement("button");
        more.className = "more";
        more.type = "button";
        more.textContent = expanded[i]
          ? "Show fewer" : "Show all " + items.length;
        more.addEventListener("click", function () {
          expanded[i] = !expanded[i];
          render();
        });
        el.appendChild(more);
      }
      host.appendChild(el);
    });

    showLegend();

    if (!total) {
      var none = document.createElement("p");
      none.className = "empty";
      none.textContent = prefs.starred
        ? "Nothing starred in this week — turn the filter off to see the rest."
        : "Nothing practiced in this window.";
      host.appendChild(none);
    }

    if (sheet.words.length) {
      var el = document.createElement("section");
      el.innerHTML = '<h2>Words that kept coming up</h2>' +
        '<p class="blurb">Cloze answers that appeared more than once this week.</p>' +
        '<div class="words">' + sheet.words.map(function (w) {
          return "<span>" + esc(w) + "</span>";
        }).join("") + "</div>";
      host.appendChild(el);
    }
  }

  // Notes outlive the sheet they were taken on: a sentence annotated last week
  // may not make this week's cut, but its row is still in the store. Count only
  // what's on this page, or the tally claims credit for unseen sentences.
  function countCovered() {
    var n = 0;
    for (var k in state) if (pageIds[k] && state[k] && state[k].covered) n++;
    document.getElementById("n-covered").textContent = n;
  }

  // --- shared store -----------------------------------------------------
  //
  // Two homes, two backends. On GitHub Pages the page talks straight to Turso
  // over its HTTP protocol — plain JSON POSTs, so no client library and nothing
  // to load from a CDN. Inside a claude.ai artifact that fetch is blocked by the
  // CSP, so it uses the artifact's own store instead. Either way localStorage
  // has already taken the write, so a store that never arrives costs nothing.

  function tursoBackend(cfg) {
    var T = function (v) { return { type: "text", value: String(v) }; };
    var I = function (v) { return { type: "integer", value: String(v) }; };

    // Milliseconds since the epoch on the server's clock. julianday() rather than
    // unixepoch('subsec') because it is in every SQLite, old ones included.
    var NOW = "cast((julianday('now') - 2440587.5) * 86400000 as integer)";

    function pipeline(stmts, keepalive) {
      return fetch(cfg.url + "/v2/pipeline", {
        method: "POST",
        keepalive: !!keepalive,
        headers: {
          "Authorization": "Bearer " + cfg.token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          requests: stmts.map(function (s) { return { type: "execute", stmt: s }; })
            .concat([{ type: "close" }])
        })
      }).then(function (r) {
        if (!r.ok) throw new Error("turso " + r.status);
        return r.json();
      }).then(function (j) {
        var results = j.results || [];
        for (var i = 0; i < results.length; i++) {
          if (results[i].type === "error") throw new Error("turso statement failed");
        }
        return results;
      });
    }

    return {
      // The write and a read-back ride one pipeline. `affected_row_count` is 0
      // when the guard rejected the write, and the read then says what is
      // actually stored — so a lost race costs no extra round trip.
      save: function (key, baseRev) {
        var c = cellOf(key), v = readCell(key);
        var now = T(new Date().toISOString());
        var write, read;
        if (c.kind === "pad") {
          write = {
            sql: "insert into week_notes(week, note, updated_at, rev) values(?,?,?,1) " +
                 "on conflict(week) do update set note=excluded.note, " +
                 "updated_at=excluded.updated_at, rev=week_notes.rev+1 " +
                 "where week_notes.rev = ?",
            args: [T(sheet.week), T(v.note), now, I(baseRev)]
          };
          read = { sql: "select note, 0, rev from week_notes where week = ?",
                   args: [T(sheet.week)] };
        } else if (c.kind === "note") {
          // No week in this table on purpose: the note belongs to the sentence,
          // so it is the same note in every week the sentence turns up in.
          write = {
            sql: "insert into sentence_notes(sentence_id, note, updated_at, rev) " +
                 "values(?,?,?,1) on conflict(sentence_id) do update set " +
                 "note=excluded.note, updated_at=excluded.updated_at, " +
                 "rev=sentence_notes.rev+1 where sentence_notes.rev = ?",
            args: [T(c.id), T(v.note), now, I(baseRev)]
          };
          read = { sql: "select note, 0, rev from sentence_notes where sentence_id = ?",
                   args: [T(c.id)] };
        } else {
          write = {
            sql: "insert into notes(week, sentence_id, covered, updated_at, rev) " +
                 "values(?,?,?,?,1) on conflict(week, sentence_id) do update set " +
                 "covered=excluded.covered, updated_at=excluded.updated_at, " +
                 "rev=notes.rev+1 where notes.rev = ?",
            args: [T(sheet.week), T(c.id), I(v.covered ? 1 : 0), now, I(baseRev)]
          };
          read = { sql: "select '', covered, rev from notes where week = ? and sentence_id = ?",
                   args: [T(sheet.week), T(c.id)] };
        }
        return pipeline([write, read]).then(function (results) {
          var landed = results[0].response.result.affected_row_count > 0;
          var rows = results[1].response.result.rows;
          var row = rows.length ? rows[0] : null;
          var rev = row ? Number(row[2].value) : 0;
          if (landed) return { ok: true, rev: rev };
          return { ok: false, remote: {
            note: row && row[0].type !== "null" ? row[0].value : "",
            covered: row ? row[1].value === "1" : false,
            rev: rev
          } };
        });
      },
      // Take the lease if it is free, lapsed, or already ours; the read-back says
      // who holds it either way. Leases from closed tabs are swept on the way.
      claim: function (key, client, name, ms) {
        return pipeline([
          { sql: "insert into presence(key, client, name, until) values(?,?,?," + NOW + " + ?) " +
                 "on conflict(key) do update set client=excluded.client, " +
                 "name=excluded.name, until=excluded.until " +
                 "where presence.client = excluded.client or presence.until <= " + NOW,
            args: [T(key), T(client), T(name), I(ms)] },
          { sql: "select client, name, until - " + NOW + " from presence where key = ?",
            args: [T(key)] },
          { sql: "delete from presence where until < " + NOW + " - 3600000", args: [] }
        ]).then(function (results) {
          var row = results[1].response.result.rows[0];
          if (!row) return { mine: false, name: "", left: 0 };
          return { mine: row[0].value === client, name: row[1].value,
                   left: Number(row[2].value) };
        });
      },
      release: function (key, client) {
        return pipeline([{ sql: "delete from presence where key = ? and client = ?",
                           args: [T(key), T(client)] }], true)
          .catch(function () { /* it lapses on its own */ });
      },
      // Every live lease, with the text of the field it covers. One statement,
      // so watching someone type costs one small read every PULSE_MS rather
      // than re-reading every note on the sheet.
      pulse: function () {
        return pipeline([{
          sql: "select p.key, p.client, p.name, p.until - " + NOW + ", " +
               "coalesce(sn.note, wn.note), coalesce(sn.rev, wn.rev) from presence p " +
               "left join sentence_notes sn on p.key = 'n:' || sn.sentence_id " +
               "left join week_notes wn on p.key = 'w:' || wn.week " +
               "where p.until > " + NOW,
          args: []
        }]).then(function (results) {
          return results[0].response.result.rows.map(function (row) {
            return { key: row[0].value, client: row[1].value, name: row[2].value,
                     left: Number(row[3].value),
                     note: row[4].type === "null" ? "" : row[4].value,
                     rev: row[5].type === "null" ? null : Number(row[5].value) };
          });
        });
      },
      // Everything the page needs in one pipeline: this week's ticks, the notes
      // (which are not week-scoped), the pad, and which sentences carry a tick
      // from some earlier week.
      load: function () {
        return pipeline([
          { sql: "select sentence_id, covered, rev from notes where week = ?",
            args: [T(sheet.week)] },
          { sql: "select sentence_id, note, rev from sentence_notes", args: [] },
          { sql: "select note, rev from week_notes where week = ?",
            args: [T(sheet.week)] },
          { sql: "select distinct sentence_id from notes where covered = 1 and week <> ?",
            args: [T(sheet.week)] }
        ]).then(function (results) {
          var text = function (c) { return c.type === "null" ? "" : c.value; };
          var rowsOf = function (i) { return results[i].response.result.rows; };
          var padRows = rowsOf(2);
          return {
            ticks: rowsOf(0).map(function (row) {
              return { id: row[0].value, covered: row[1].value === "1",
                       rev: Number(row[2].value) };
            }),
            notes: rowsOf(1).map(function (row) {
              return { id: row[0].value, note: text(row[1]), rev: Number(row[2].value) };
            }),
            pad: padRows.length
              ? { note: text(padRows[0][0]), covered: false, rev: Number(padRows[0][1].value) }
              : null,
            prior: rowsOf(3).map(function (row) { return row[0].value; })
          };
        });
      }
    };
  }

  function artifactBackend(db) {
    var items = function () { return db.collection("lessons/" + sheet.week + "/items"); };
    var meta = function () { return db.collection("lessons/" + sheet.week + "/meta"); };
    // Not under a week, for the same reason the SQL table has no week column.
    var notes = function () { return db.collection("lessons/notes"); };
    // The document store has no conditional write, so the guard is checked
    // against the newest snapshot instead of inside the write. Narrower than the
    // SQL compare-and-swap — two writes inside one snapshot interval can still
    // race — but it refuses any revision this page has not seen, and this copy
    // is the single-reader preview anyway.
    var seen = {};
    var dropped = function () {
      sync = null;
      status("Saving on this device");
    };
    var refOf = function (key) {
      var c = cellOf(key);
      if (c.kind === "pad") return meta().doc("notes");
      if (c.kind === "note") return notes().doc(String(c.id));
      return items().doc(String(c.id));
    };
    return {
      save: function (key, baseRev) {
        var v = readCell(key);
        var known = seen[key];
        var rev = known ? known.rev : 0;
        if (known && rev !== baseRev) {
          return Promise.resolve({ ok: false, remote: known });
        }
        var doc = { note: v.note, covered: v.covered, rev: rev + 1,
                    at: new Date().toISOString() };
        return refOf(key).set(doc).then(function () {
          seen[key] = { note: doc.note, covered: doc.covered, rev: doc.rev };
          return { ok: true, rev: doc.rev };
        });
      },
      watch: function () {
        items().onSnapshot(function (snap) {
          absorb({ ticks: snap.docs.map(function (d) {
            var b = d.data() || {};
            var r = { id: d.id, covered: !!b.covered, rev: b.rev || 0 };
            seen[tickKey(d.id)] = { note: "", covered: r.covered, rev: r.rev };
            return r;
          }) });
        }, dropped);
        notes().onSnapshot(function (snap) {
          absorb({ notes: snap.docs.map(function (d) {
            var b = d.data() || {};
            var r = { id: d.id, note: b.note || "", rev: b.rev || 0 };
            seen[noteKey(d.id)] = { note: r.note, covered: false, rev: r.rev };
            return r;
          }) });
        }, dropped);
        meta().onSnapshot(function (snap) {
          snap.docs.forEach(function (d) {
            if (d.id !== "notes") return;
            var b = d.data() || {};
            var r = { note: b.note || "", covered: false, rev: b.rev || 0 };
            seen[WEEK_KEY] = r;
            absorb({ pad: r });
          });
        }, dropped);
      }
    };
  }

  function startSync() {
    status("Saving on this device");
    if (CONFIG.notes) {
      sync = tursoBackend(CONFIG.notes);
      var fetchNotes = function () {
        if (!sync) return;
        sync.load().then(function (got) {
          absorb(got);
          status("Shared");
        }).catch(function () { status("Saving on this device"); });
      };
      // The first load always runs, even in a background tab — it is what puts
      // existing notes on the page and what tells the badge whether the store is
      // actually reachable. Skipping it leaves the page claiming to be local-only
      // when it isn't, with none of the notes loaded.
      fetchNotes();
      // The repeat only runs while someone is looking; a backgrounded tab
      // polling all week is just burning the free tier.
      setInterval(function () { if (!document.hidden) fetchNotes(); }, 15000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) fetchNotes();
      });
      // The fast loop: who is typing, and what they have typed so far. One
      // pulse at a time — a slow answer is not stacked under the next one.
      var pulsing = false;
      setInterval(function () {
        if (!sync || document.hidden || pulsing) return;
        pulsing = true;
        sync.pulse()
          .then(function (rows) { if (absorbLeases(rows)) fetchNotes(); })
          .catch(function () { /* the slow loop still runs */ })
          .then(function () { pulsing = false; });
      }, PULSE_MS);
      // A lease runs out on the watcher's screen without a pulse having to say
      // so; this unfreezes the field on time even if a pulse is slow.
      setInterval(showLocks, 500);
    } else if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("db").then(function (ns) {
        if (!ns) return;
        sync = artifactBackend(ns);
        status("Shared");
        sync.watch();
      });
    }
  }

  // --- earlier weeks ----------------------------------------------------

  function buildPicker() {
    if (!CONFIG.archive) return;
    fetch(CONFIG.archive.manifest, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("no manifest");
        return r.json();
      })
      .then(function (weeks) {
        if (!weeks || weeks.length < 2) return;   // nothing to switch between yet
        var pick = document.getElementById("week-pick");
        weeks.forEach(function (w, i) {
          var opt = document.createElement("option");
          opt.value = w.week;
          opt.textContent = w.label + (i === 0 ? " · latest" : "");
          opt.selected = w.week === sheet.week;
          pick.appendChild(opt);
        });
        pick.hidden = false;
        pick.addEventListener("change", function () {
          if (pick.value === sheet.week) return;
          // The newest week is the one baked into this shell, so it lives at the
          // bare URL; everything else is a query away.
          location.search = pick.value === BAKED.week ? "" : "?week=" + pick.value;
        });
      })
      .catch(function () { /* no archive yet — the picker just stays hidden */ });
  }

  // --- boot -------------------------------------------------------------

  function start(s) {
    sheet = s;
    KEY = "klozar:" + sheet.week;
    BASE = "klozar:base:" + sheet.week;

    var read = function (k, fallback) {
      try { return JSON.parse(localStorage.getItem(k) || fallback) || JSON.parse(fallback); }
      catch (e) { return JSON.parse(fallback); }
    };

    // The week's half and the sentence-notes half come back separately and are
    // reassembled into one object per sentence. A blob written by the older page
    // carried its notes under the week; picking `note` up here means an upgrade
    // keeps them on screen rather than blanking until the first poll.
    state = {};
    var weekState = read(KEY, "{}"), noteState = read(NOTES_KEY, "{}"), id;
    for (id in weekState) {
      var v = weekState[id] || {};
      state[id] = { note: v.note || "", covered: !!v.covered };
    }
    for (id in noteState) {
      if (!state[id]) state[id] = { note: "", covered: false };
      state[id].note = noteState[id];
    }

    // Ancestors keep their own keys. Anything from the older page is keyed by a
    // bare sentence id, which is neither shape, so it is dropped — the first
    // poll then adopts the store's revision, which is the safe direction.
    shadow = {};
    var weekBase = read(BASE, "{}"), noteBase = read(NOTES_BASE, "{}"), k;
    for (k in weekBase) {
      if (k === WEEK_KEY || k.indexOf("t:") === 0) shadow[k] = weekBase[k];
    }
    for (k in noteBase) if (k.indexOf("n:") === 0) shadow[k] = noteBase[k];

    prior = {};
    read(PRIOR_KEY, "[]").forEach(function (x) { prior[x] = true; });
    pageIds = {};
    // Recency is measured from the newest day *in the sheet*, not from today,
    // so an old week reopened in December still ranks the way it did when it
    // was pulled instead of collapsing to "everything is ancient".
    newest = 0;
    spanDays = sheet.days || 7;
    expanded = {};
    sheet.sections.forEach(function (sec) {
      sec.items.forEach(function (item) {
        pageIds[item.id] = true;
        var d = day(item.last);
        if (d > newest) newest = d;
      });
    });

    document.getElementById("eyebrow").textContent = sheet.eyebrow;
    document.getElementById("title").textContent = sheet.title;
    document.getElementById("n-played").textContent = sheet.counts.played;
    document.getElementById("n-missed").textContent = sheet.counts.missed;
    document.getElementById("n-starred").textContent = sheet.counts.starred;
    document.getElementById("stamp").textContent = sheet.stamp;
    document.title = sheet.title;

    render();
    countCovered();
    showPad();

    // Same rule as a sentence note: publish on a pause, not on leaving.
    guard(padEl, WEEK_KEY);
    padEl.addEventListener("input", function () {
      entry(WEEK_KEY).note = padEl.value;
      growPad();
      nudge(WEEK_KEY);
    });
    padEl.addEventListener("blur", function () {
      var v = padEl.value.trim();
      if (v !== entry(WEEK_KEY).note || timers[WEEK_KEY]) {
        entry(WEEK_KEY).note = v;
        padEl.value = v;
        flush(WEEK_KEY);
      }
      release(WEEK_KEY);
    });

    var whoEl = document.getElementById("who");
    whoEl.value = myName;
    whoEl.addEventListener("input", function () {
      myName = whoEl.value.trim();
      try { localStorage.setItem(NAME_KEY, myName); } catch (e) {}
    });
    // Closing the tab mid-word should not leave the other person locked out
    // for the rest of the lease.
    window.addEventListener("pagehide", function () {
      for (var k in held) if (sync && sync.release) sync.release(leaseKey(k), ME);
    });

    var sortPick = document.getElementById("sort-pick");
    ORDERS.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.key;
      opt.textContent = o.label;
      opt.selected = o.key === prefs.order;
      sortPick.appendChild(opt);
    });
    sortPick.addEventListener("change", function () {
      prefs.order = sortPick.value;
      savePrefs();
      render();
    });

    var starBtn = document.getElementById("starred-only");
    starBtn.setAttribute("aria-pressed", String(prefs.starred));
    starBtn.addEventListener("click", function () {
      prefs.starred = !prefs.starred;
      starBtn.setAttribute("aria-pressed", String(prefs.starred));
      savePrefs();
      render();
    });

    var toggle = document.getElementById("toggle-en");
    toggle.addEventListener("click", function () {
      var on = toggle.getAttribute("aria-pressed") === "true";
      toggle.setAttribute("aria-pressed", String(!on));
      document.body.classList.toggle("hidden-en", !on);
      toggle.textContent = on ? "Hide English" : "Show English";
    });

    document.getElementById("clear-covered").addEventListener("click", function () {
      var cleared = [];
      for (var k in state) {
        if (state[k] && state[k].covered) { state[k].covered = false; cleared.push(k); }
      }
      saveLocal();
      render();
      countCovered();
      cleared.forEach(function (id) { flush(tickKey(id)); });
      showLegend();
    });

    buildPicker();
    startSync();
  }

  var want = new URLSearchParams(location.search).get("week");
  if (want && want !== BAKED.week && CONFIG.archive) {
    document.getElementById("eyebrow").textContent = "Loading…";
    fetch(CONFIG.archive.base + want + ".json", { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("no such week");
        return r.json();
      })
      .then(start)
      // A week that isn't there is better answered with the latest sheet than
      // with a blank page.
      .catch(function () { start(BAKED); });
  } else {
    start(BAKED);
  }
})();
</script>
</body>
</html>
