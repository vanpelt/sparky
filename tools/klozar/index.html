<style>
:root {
  --paper: #f4f5f2;
  --raised: #fbfbf9;
  --ink: #17181c;
  --muted: #6f7469;
  --faint: #9aa093;
  --rule: #dcded7;
  --pen: #c8342b;
  --pen-soft: #f0d9d6;
  --done: #2f6f5e;
  --done-soft: #dbe8e3;
  --star: #b07d1a;
  --focus: #2f6f5e;
  --shadow: 0 1px 2px rgba(23, 24, 28, .06);
  --serif: Literata, Georgia, "Times New Roman", serif;
  --slab: "Zilla Slab", Rockwell, Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171a18;
    --raised: #1e2220;
    --ink: #e8e9e4;
    --muted: #969c93;
    --faint: #6d746c;
    --rule: #2a2e2b;
    --pen: #e8635a;
    --pen-soft: #3a2523;
    --done: #5ba88f;
    --done-soft: #1f2f2a;
    --star: #d9a94b;
    --focus: #5ba88f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --paper: #171a18;
  --raised: #1e2220;
  --ink: #e8e9e4;
  --muted: #969c93;
  --faint: #6d746c;
  --rule: #2a2e2b;
  --pen: #e8635a;
  --pen-soft: #3a2523;
  --done: #5ba88f;
  --done-soft: #1f2f2a;
  --star: #d9a94b;
  --focus: #5ba88f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 47rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }

/* --- masthead --- */
.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 1.25rem; }
.eyebrow {
  font-family: var(--slab); font-weight: 500; font-size: .7rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
h1 {
  font-family: var(--slab); font-weight: 700; font-size: clamp(1.75rem, 5vw, 2.5rem);
  line-height: 1.1; margin: .35rem 0 0; text-wrap: balance; letter-spacing: -.01em;
}
.tally { display: flex; flex-wrap: wrap; gap: 1.75rem; margin-top: 1.25rem; }
.tally div { display: flex; flex-direction: column; gap: .1rem; }
.tally b {
  font-family: var(--slab); font-weight: 700; font-size: 1.5rem;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.tally span {
  font-family: var(--slab); font-size: .7rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
.tally .miss b { color: var(--pen); }
.tally .cov b { color: var(--done); }

/* --- controls --- */
.controls {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
  margin: 1.25rem 0 0; padding-bottom: .25rem;
}
button {
  font-family: var(--slab); font-weight: 500; font-size: .78rem;
  letter-spacing: .04em; color: var(--ink); background: var(--raised);
  border: 1px solid var(--rule); border-radius: 3px; padding: .4rem .7rem;
  cursor: pointer; transition: border-color .12s, color .12s;
}
button:hover { border-color: var(--ink); }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.weekpick {
  font-family: var(--slab); font-weight: 500; font-size: .78rem;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--rule); border-radius: 3px;
  padding: .4rem 1.6rem .4rem .7rem; cursor: pointer;
  appearance: none; -webkit-appearance: none;
  /* Caret drawn in the ink token so it survives both themes. */
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right .72rem center, right .5rem center;
  background-size: .3rem .3rem, .3rem .3rem;
  background-repeat: no-repeat;
}
.weekpick:hover { border-color: var(--ink); }
.weekpick[hidden] { display: none; }
.saving {
  margin-left: auto; font-family: var(--slab); font-size: .7rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
}

/* --- sections --- */
section { margin-top: 3rem; }
h2 {
  font-family: var(--slab); font-weight: 700; font-size: 1.15rem;
  margin: 0; letter-spacing: -.005em;
}
.blurb { color: var(--muted); font-size: .9rem; margin: .3rem 0 0; max-width: 34rem; }
.rows { border-top: 1px solid var(--rule); margin-top: 1.1rem; }

/* --- one sentence --- */
.row {
  display: grid; grid-template-columns: 1.6rem 1fr; gap: 0 .85rem;
  border-bottom: 1px solid var(--rule); padding: .95rem .6rem .95rem .5rem;
  position: relative; transition: background .12s;
}
.row::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--pen); opacity: var(--sev, 0);
}
.row:hover { background: var(--raised); }
.row.is-covered { background: var(--done-soft); }
.row.is-covered .sr { text-decoration: line-through; text-decoration-color: var(--done); }

.tick {
  appearance: none; -webkit-appearance: none; margin: .35rem 0 0; width: 1.15rem; height: 1.15rem;
  border: 1.5px solid var(--faint); border-radius: 3px; background: var(--raised);
  cursor: pointer; display: grid; place-content: center; flex: none;
}
.tick:checked { background: var(--done); border-color: var(--done); }
.tick:checked::after {
  content: ""; width: .34rem; height: .62rem; margin-top: -.12rem;
  border: solid var(--raised); border-width: 0 2px 2px 0; transform: rotate(42deg);
}

.body { min-width: 0; }
.sr { font-size: 1.16rem; line-height: 1.4; margin: 0; }
.cloze {
  background: none; color: inherit; font-weight: 600;
  border-bottom: 2px solid var(--pen); padding-bottom: 1px;
}
.en {
  font-size: .97rem; color: var(--muted); font-style: italic;
  margin: .2rem 0 0; transition: opacity .12s;
}
.hidden-en .en { opacity: 0; }
.hidden-en .en:hover, .hidden-en .en:focus-within { opacity: 1; }

.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
  margin-top: .5rem; font-family: var(--mono); font-size: .72rem;
  color: var(--faint); font-variant-numeric: tabular-nums;
}
.meta .miss { color: var(--pen); }
.meta .star { color: var(--star); }
.notebtn {
  font-family: var(--mono); font-size: .72rem; letter-spacing: 0;
  padding: .1rem .4rem; background: none; border: 1px dashed var(--rule);
}
.notebtn.has-note { border-style: solid; border-color: var(--done); color: var(--done); }

.note { margin-top: .55rem; }
.note[hidden] { display: none; }
textarea {
  width: 100%; min-height: 4.5rem; resize: vertical; padding: .55rem .65rem;
  font-family: var(--serif); font-size: .93rem; line-height: 1.45;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--rule); border-left: 3px solid var(--done); border-radius: 3px;
}
textarea::placeholder { color: var(--faint); font-style: italic; }

/* --- word list --- */
.words { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1.1rem; }
.words span {
  font-family: var(--mono); font-size: .8rem; padding: .2rem .5rem;
  background: var(--raised); border: 1px solid var(--rule); border-radius: 3px;
}

footer {
  margin-top: 3.5rem; padding-top: 1.1rem; border-top: 1px solid var(--rule);
  font-family: var(--slab); font-size: .76rem; color: var(--faint);
  display: flex; flex-wrap: wrap; gap: .4rem 1rem; justify-content: space-between;
}
</style>

</head>

<div class="wrap">

    <span class="saving" id="saving"></span>

  <main id="sections"></main>

  <footer>
    <span id="stamp"></span>
    <span>klozar &middot; Clozemaster</span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("lesson-data").textContent);
  var KEY = "klozar:" + DATA.week;
  var state = {};   // id -> {note, covered}
  var sync = null;  // shared store, if this copy of the page has one
  var savingEl = document.getElementById("saving");

  // Local storage is the floor: it works for every viewer, signed in or not,
  // and never fails the way a capability can. The shared store layers on top.
  try {
    state = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
  } catch (e) {
    state = {};
  }

  function entry(id) {
    if (!state[id]) state[id] = { note: "", covered: false };
    return state[id];
  }

  function saveLocal() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* private window, full quota — the page still works, just forgets */
    }
  }

  function status(text) {
    savingEl.textContent = text;
  }

  // One write in flight per sentence. Ticking a box and then typing a note fires
  // two saves for the same row, and without this the slower first request can
  // land last and overwrite the newer state with the older one — which silently
  // ate a note the first time this was tested. A second change while a save is
  // out just sets a flag; the re-run reads current state, so only the latest
  // wins and intermediate values never need their own request.
  var inflight = {};
  var queued = {};

  function push(id) {
    saveLocal();
    if (!sync) return;
    if (inflight[id]) { queued[id] = true; return; }
    var run = function () {
      inflight[id] = sync.save(id)
        .then(function () { status("Shared"); })
        .catch(function () { status("Saved on this device"); })
        .then(function () {
          delete inflight[id];
          if (queued[id]) { delete queued[id]; run(); }
        });
    };
    run();
  }

  // Merge whatever the shared store has into local state. Returns true if
  // anything actually moved, so a poll that changes nothing costs no re-render.
  function merge(rows) {
    var touched = false;
    rows.forEach(function (r) {
      // A poll can return a row we are mid-way through replacing. Taking it
      // would revert what was just typed, and the queued save would then write
      // the reverted value back out.
      if (inflight[r.id] || queued[r.id]) return;
      var mine = entry(r.id);
      if (mine.note !== r.note || mine.covered !== r.covered) {
        mine.note = r.note;
        mine.covered = r.covered;
        touched = true;
      }
    });
    if (!touched) return false;
    saveLocal();
    // Never redraw out from under someone mid-sentence.
    if (!document.querySelector("textarea:focus")) render();
    countCovered();
    return true;
  }

  // --- rendering ---

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function clozed(text) {
    return esc(text).replace(/\{\{(.+?)\}\}/g, '<mark class="cloze">$1</mark>');
  }

  function rowEl(s) {
    var e = entry(s.id);
    var row = document.createElement("div");
    row.className = "row" + (e.covered ? " is-covered" : "");
    // The stripe reads miss rate directly: darker edge, harder sentence.
    row.style.setProperty("--sev", s.played ? (s.missed / s.played).toFixed(2) : 0);

    var bits = ["level " + s.level];
    if (s.missed) bits.push('<span class="miss">missed ' + s.missed + " of " + s.played + "</span>");
    else bits.push("seen " + s.played + "×");
    if (s.favorited) bits.push('<span class="star">★ starred</span>');
    bits.push(s.last);

    row.innerHTML =
      '<input class="tick" type="checkbox" ' + (e.covered ? "checked" : "") +
        ' aria-label="Mark &quot;' + esc(s.plain) + '&quot; as covered">' +
      '<div class="body">' +
        '<p class="sr">' + clozed(s.text) + "</p>" +
        '<p class="en">' + esc(s.translation) + "</p>" +
        '<div class="meta">' + bits.join('<span aria-hidden="true">&middot;</span>') +
          '<button class="notebtn' + (e.note ? " has-note" : "") + '" type="button">' +
            (e.note ? "note" : "+ note") + "</button>" +
        "</div>" +
        '<div class="note"' + (e.note ? "" : " hidden") + '>' +
          '<textarea placeholder="What came up in the lesson…">' + esc(e.note) + "</textarea>" +
        "</div>" +
      "</div>";

    var tick = row.querySelector(".tick");
    var btn = row.querySelector(".notebtn");
    var note = row.querySelector(".note");
    var ta = row.querySelector("textarea");

    tick.addEventListener("change", function () {
      entry(s.id).covered = tick.checked;
      row.classList.toggle("is-covered", tick.checked);
      countCovered();
      push(s.id);
    });

    btn.addEventListener("click", function () {
      note.hidden = !note.hidden;
      if (!note.hidden) ta.focus();
    });

    // Save on blur, not per keystroke — one write per thought, not per letter.
    ta.addEventListener("blur", function () {
      var v = ta.value.trim();
      if (v === entry(s.id).note) return;
      entry(s.id).note = v;
      btn.classList.toggle("has-note", !!v);
      btn.textContent = v ? "note" : "+ note";
      push(s.id);
    });

    row.dataset.id = s.id;
    return row;
  }

  function render() {
    var host = document.getElementById("sections");
    host.textContent = "";
    DATA.sections.forEach(function (sec) {
      if (!sec.items.length) return;
      var el = document.createElement("section");
      var head = document.createElement("h2");
      head.textContent = sec.title;
      var blurb = document.createElement("p");
      blurb.className = "blurb";
      blurb.textContent = sec.blurb;
      var rows = document.createElement("div");
      rows.className = "rows";
      sec.items.forEach(function (s) { rows.appendChild(rowEl(s)); });
      el.appendChild(head);
      el.appendChild(blurb);
      el.appendChild(rows);
      host.appendChild(el);
    });

    if (DATA.words.length) {
      var el = document.createElement("section");
      el.innerHTML = '<h2>Words that kept coming up</h2>' +
        '<p class="blurb">Cloze answers that appeared more than once this week.</p>' +
        '<div class="words">' + DATA.words.map(function (w) {
          return "<span>" + esc(w) + "</span>";
        }).join("") + "</div>";
      host.appendChild(el);
    }
  }

  // Notes outlive the sheet they were taken on: a sentence you annotated last
  // week may not make this week's cut, but its row is still in the store. Count
  // only what's actually on this page, or the tally claims credit for sentences
  // the reader can't see.
  var pageIds = {};
  DATA.sections.forEach(function (sec) {
    sec.items.forEach(function (s) { pageIds[s.id] = true; });
  });

  function countCovered() {
    var n = 0;
    for (var k in state) if (pageIds[k] && state[k] && state[k].covered) n++;
    document.getElementById("n-covered").textContent = n;
  }

  document.getElementById("eyebrow").textContent = DATA.eyebrow;
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("n-played").textContent = DATA.counts.played;
  document.getElementById("n-missed").textContent = DATA.counts.missed;
  document.getElementById("n-starred").textContent = DATA.counts.starred;
  document.getElementById("stamp").textContent = DATA.stamp;
  render();
  countCovered();

  var toggle = document.getElementById("toggle-en");
  toggle.addEventListener("click", function () {
    var on = toggle.getAttribute("aria-pressed") === "true";
    toggle.setAttribute("aria-pressed", String(!on));
    document.body.classList.toggle("hidden-en", !on);
    toggle.textContent = on ? "Hide translations" : "Show translations";
  });

  document.getElementById("clear-covered").addEventListener("click", function () {
    var cleared = [];
    for (var k in state) {
      if (state[k] && state[k].covered) { state[k].covered = false; cleared.push(k); }
    }
    saveLocal();
    render();
    countCovered();
    cleared.forEach(push);
  });

  // --- shared store -----------------------------------------------------
  //
  // Two homes, two backends. On GitHub Pages the page talks straight to Turso
  // over its HTTP protocol — plain JSON POSTs, so no client library and nothing
  // to load from a CDN. Inside a claude.ai artifact that fetch is blocked by the
  // CSP, so it uses the artifact's own store instead. Either way localStorage
  // has already taken the write, so a store that never arrives costs nothing.

  function tursoBackend(cfg) {
    var T = function (v) { return { type: "text", value: String(v) }; };
    var I = function (v) { return { type: "integer", value: String(v) }; };

    function pipeline(stmts) {
      return fetch(cfg.url + "/v2/pipeline", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + cfg.token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          requests: stmts.map(function (s) { return { type: "execute", stmt: s }; })
            .concat([{ type: "close" }])
        })
      }).then(function (r) {
        if (!r.ok) throw new Error("turso " + r.status);
        return r.json();
      }).then(function (j) {
        var results = j.results || [];
        for (var i = 0; i < results.length; i++) {
          if (results[i].type === "error") throw new Error("turso statement failed");
        }
        return results;
      });
    }

    return {
      save: function (id) {
        var e = entry(id);
        return pipeline([{
          sql: "insert into notes(week, sentence_id, note, covered, updated_at) " +
               "values(?,?,?,?,?) on conflict(week, sentence_id) do update set " +
               "note=excluded.note, covered=excluded.covered, updated_at=excluded.updated_at",
          args: [T(DATA.week), T(id), T(e.note || ""), I(e.covered ? 1 : 0),
                 T(new Date().toISOString())]
        }]);
      },
      load: function () {
        return pipeline([{
          sql: "select sentence_id, note, covered from notes where week = ?",
          args: [T(DATA.week)]
        }]).then(function (results) {
          var rows = results[0].response.result.rows;
          return rows.map(function (row) {
            return {
              id: row[0].value,
              note: row[1].type === "null" ? "" : row[1].value,
              covered: row[2].value === "1"
            };
          });
        });
      }
    };
  }

  function artifactBackend(db) {
    var items = function () { return db.collection("lessons/" + DATA.week + "/items"); };
    return {
      save: function (id) {
        var e = entry(id);
        return items().doc(String(id)).set({
          note: e.note, covered: !!e.covered, at: new Date().toISOString()
        });
      },
      watch: function () {
        items().onSnapshot(function (snap) {
          merge(snap.docs.map(function (d) {
            var b = d.data() || {};
            return { id: d.id, note: b.note || "", covered: !!b.covered };
          }));
        }, function () {
          sync = null;
          status("Saving on this device");
        });
      }
    };
  }

  // --- earlier weeks ----------------------------------------------------
  //
  // Every sheet is frozen at publish time, so a page from March can't know about
  // May. The manifest is fetched at load instead of baked in, which is what lets
  // an old sheet still list every week including ones published after it.

  if (DATA.archive) {
    fetch(DATA.archive.manifest, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("no manifest");
        return r.json();
      })
      .then(function (weeks) {
        if (!weeks || weeks.length < 2) return;   // nothing to switch between yet
        var pick = document.getElementById("week-pick");
        weeks.forEach(function (w, i) {
          var opt = document.createElement("option");
          opt.value = w.week;
          opt.textContent = w.label + (i === 0 ? " · latest" : "");
          opt.selected = w.week === DATA.week;
          pick.appendChild(opt);
        });
        // A week published after this page existed won't be in its own list.
        if (!pick.value) {
          var self = document.createElement("option");
          self.value = DATA.week;
          self.textContent = DATA.eyebrow;
          self.selected = true;
          pick.insertBefore(self, pick.firstChild);
        }
        pick.hidden = false;
        pick.addEventListener("change", function () {
          if (pick.value !== DATA.week) {
            location.href = DATA.archive.base + pick.value + ".html";
          }
        });
      })
      .catch(function () { /* no archive yet — the picker just stays hidden */ });
  }

  status("Saving on this device");

  if (DATA.notes) {
    sync = tursoBackend(DATA.notes);
    var poll = function () {
      if (document.hidden || !sync) return;
      sync.load().then(function (rows) {
        merge(rows);
        status("Shared");
      }).catch(function () { status("Saving on this device"); });
    };
    poll();
    // Only while someone is looking — a backgrounded tab polling all week is
    // just burning someone's free tier.
    setInterval(poll, 15000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) poll();
    });
  } else if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (ns) {
      if (!ns) return;
      sync = artifactBackend(ns);
      status("Shared");
      sync.watch();
    });
  }
})();
</script>
