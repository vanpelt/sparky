name: sparkbox CKS image

# Two callers, one build.
#
#   push / workflow_dispatch  an ordinary `edge` build off a branch. Tags are
#                             the branch, the full SHA, and `edge` on main.
#
#   workflow_call             build-artifacts.yml calls this AFTER it publishes
#                             a release, passing `release_tag`. That adds a tag
#                             named for the release (v0.6.0), so the image that
#                             pins SPARKBOX_RELEASE=v0.6.0 is itself findable by
#                             that version instead of only by SHA.
#
# The ordering is the point of the `needs: publish` on the calling side. This
# image does not embed the release payload — it downloads and SHA-256-verifies
# firecracker, the kernel and the rootfs at Pod start (deploy/kubernetes/
# entrypoint.sh) — so an image tagged v0.6.0 whose release was still a draft
# would be a Pod that CrashLoops on a 404. Publishing first makes the tag mean
# what it says.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag the image for this release (blank = ordinary edge build)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_tag:
        description: "Release this image pins (blank = ordinary edge build)"
        required: false
        type: string
        default: ""
  push:
    # Branches only. Without this a `v*` tag push would ALSO start a standalone
    # run, which shares this file's concurrency group with the release's `cks`
    # job (both resolve to sparkbox-cks-image-refs/tags/vX.Y.Z) and would race
    # it under cancel-in-progress. A release builds this image exactly once,
    # through workflow_call, after publish.
    branches: ["**"]
    # The build context is `tools`, and the Containerfile COPYs both modules
    # wholesale — so everything below is genuinely IN the context. Being in the
    # context is not the same as reaching the image, though, and the difference
    # is a multi-arch build (QEMU-emulated arm64, ~5 minutes) that produces
    # bytes identical to the last one. The negations name the parts of the
    # context that cannot change what is published; the re-includes after them
    # are the individual files inside those parts that can.
    #
    # Order is load-bearing: GitHub applies these in sequence, so a later `!`
    # excludes and a later positive re-includes. Keep the exceptions last.
    #
    # Anything else under the two modules stays a trigger on purpose. go:embed
    # pulls .html, .css, .js, .png, .svg, .json, .yaml, .sh, .env, .conf, unit
    # templates and even markdown (internal/guestdocs) into the binaries, so
    # narrowing this by file extension rather than by directory would drop a
    # rebuild that was needed. A missed build ships stale bytes under a fresh
    # SHA tag; a redundant one only costs five minutes.
    paths:
      - .github/workflows/sparkbox-cks-image.yml
      - tools/sparkbox/**
      - tools/sluice/**
      # Tests are copied into the context but `go build ./cmd/...` never
      # compiles them, and nothing embeds a testdata dir.
      - "!tools/sparkbox/**/*_test.go"
      - "!tools/sluice/**/*_test.go"
      - "!tools/sparkbox/**/testdata/**"
      - "!tools/sluice/**/testdata/**"
      # Prose, dev-loop scripts, and the GUEST image. That last one is the
      # easiest to misread: images/Dockerfile builds the rootfs a sandbox runs,
      # which this image downloads from a release at Pod start rather than
      # containing — build-artifacts.yml is what rebuilds it.
      - "!tools/sparkbox/docs/**"
      - "!tools/sparkbox/hack/**"
      - "!tools/sparkbox/images/**"
      - "!tools/sparkbox/*.md"
      - "!tools/sluice/*.md"
      # The two files inside those directories that do reach a build: motd is
      # COPYed into the runtime stage, and check-cks-pin.sh is the gate this
      # workflow runs before anything is built.
      - tools/sparkbox/images/motd
      - tools/sparkbox/hack/check-cks-pin.sh

concurrency:
  group: sparkbox-cks-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sparkbox-cks

jobs:
  build:
    name: build linux/amd64,linux/arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Before anything is built: do the checksums baked into entrypoint.sh
      # actually describe the release it pins? A mismatch is invisible at
      # build time and splits into two silent failures at run time — a warm
      # cache silently keeps the PREVIOUS release's kernel and rootfs, a cold
      # one CrashLoops on a checksum error. v0.6.0 shipped both.
      #
      # No argument means every architecture the image below publishes. One
      # image serves both, so an arm64-only mismatch would ship inside a
      # manifest list tagged with the release and fail only on arm64 hardware.
      - name: pinned checksums match the pinned release
        run: tools/sparkbox/hack/check-cks-pin.sh

      # linux/arm64 needs QEMU: the Go stages cross-compile from
      # $BUILDPLATFORM, but the ubuntu:24.04 runtime stage runs apt-get for the
      # target architecture.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=${{ inputs.release_tag || '' }},enable=${{ (inputs.release_tag || '') != '' }}
          labels: |
            org.opencontainers.image.title=Sparkbox CKS
            org.opencontainers.image.description=Sparkbox Firecracker runtime for CoreWeave Kubernetes Service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: tools
          file: tools/sparkbox/deploy/kubernetes/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SPARKBOX_VERSION=${{ inputs.release_tag || format('{0}-cks', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
