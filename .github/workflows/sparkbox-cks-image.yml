name: sparkbox CKS image

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sparkbox-cks-image.yml
      - tools/sparkbox/**
      - tools/sluice/**

concurrency:
  group: sparkbox-cks-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sparkbox-cks

jobs:
  build:
    name: build linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Sparkbox CKS
            org.opencontainers.image.description=Sparkbox Firecracker runtime for CoreWeave Kubernetes Service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: tools
          file: tools/sparkbox/deploy/kubernetes/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SPARKBOX_VERSION=${{ github.sha }}-cks
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
