name: sparkbox release

# Build a versioned sparkbox artifact release for BOTH linux/amd64 and
# linux/arm64 and publish it as a GitHub Release. `sparkbox setup` on a fresh
# host fetches these assets (see internal/hostsetup): it picks the pair matching
# its own runtime.GOARCH, so an x86 cloud VM and the aarch64 DGX Spark provision
# from the same release tag.
#
# Shape of a run:
#   prepare    resolve the tag, open a DRAFT release (nothing is public yet)
#   image      Depot builds tools/sparkbox/images/ for both platforms at once and
#              pushes one multi-arch tag to GHCR
#   artifacts  a matrix of NATIVE runners (ubuntu-24.04 / ubuntu-24.04-arm) each
#              build the guest kernel + the sparkbox binary + the sluice egress
#              gateway, pull their arch's image variant, flatten it into an ext4
#              template, and upload their assets to the draft. No emulation
#              anywhere.
#   macos-kernel
#              restores the content-addressed macOS OUTER kernel, or compiles
#              and compares it concurrently at -j3/-j4 on native arm64 runners
#   darwin     cross-builds sparkbox-darwin-arm64 on a plain ubuntu runner and
#              derives manifest-darwin-arm64.env from the linux arm64 one plus
#              the outer kernel's checksum
#   publish    flip the draft live once EVERY platform landed, so a release is
#              never half-populated — `setup` resolving "latest" can't catch a
#              torn one
#
# Triggers: push a `v*` tag to cut a real release; workflow_dispatch for ad-hoc
# builds (these default to a `dev-<timestamp>` prerelease, which does NOT move
# the /releases/latest pointer hosts resolve).
#
# Config required (set once via gh):
#   var GATEWAY_UPSTREAM_PUBKEY  fleet gateway public key baked into the rootfs
#                                (must match the private key the host holds)
# Depot authenticates by OIDC trust relationship — no token secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag (blank = dev-<UTC timestamp>)"
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease (does NOT move the `latest` pointer hosts resolve)"
        type: boolean
        default: true
      rootfs_name:
        description: "Rootfs template basename (must match the server's --default-image)"
        required: false
        default: "universal"
      rootfs_mb:
        description: "Rootfs ext4 size in MB (per-sandbox disk ceiling; thin CoW). 25600 = 25 GiB (exe.dev parity)."
        required: false
        default: "25600"
      kernel_repro_check:
        description: "Ignore the content cache and rebuild the macOS outer kernel twice"
        type: boolean
        default: false

concurrency:
  group: sparkbox-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIRECRACKER_VERSION: v1.16.1
  KERNEL_VERSION: 6.1.155
  # The macOS OUTER kernel, which is a different kernel from KERNEL_VERSION
  # above: that one is the 6.1 guest kernel a firecracker microVM boots, this is
  # the 6.14 KVM-capable Image Apple's `container machine` boots so that
  # firecracker can exist inside it at all. This version is an explicit part of
  # the content cache key and must match build.sh and Dockerfile.builder.
  MACOS_KERNEL_VERSION: 6.14.9
  MACOS_KERNEL_ASSET: vmlinux-macos-arm64
  MACOS_KERNEL_BUILDER_REPO: ghcr.io/${{ github.repository }}/macos-kernel-builder
  MACOS_KERNEL_CACHE_REPO: ghcr.io/${{ github.repository }}/macos-kernel-cache
  MACOS_KERNEL_CACHE_SCHEMA: v1
  DEPOT_PROJECT: h0htfmz04l
  IMAGE_REPO: ghcr.io/${{ github.repository }}/universal
  ROOTFS_NAME: ${{ inputs.rootfs_name || 'universal' }}
  ROOTFS_MB: ${{ inputs.rootfs_mb || '25600' }}

jobs:
  # ---------------------------------------------------------------- prepare --
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          # A tag push names the release; a dispatch invents a dev tag unless
          # one was typed. Prereleases never become the `latest` hosts resolve.
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$IS_TAG" = true ]; then
            release="${GITHUB_REF#refs/tags/}"
            prerelease=false
          else
            release="${INPUT_RELEASE:-dev-$(date -u +%Y%m%d-%H%M%S)}"
            prerelease="${INPUT_PRERELEASE:-true}"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "### sparkbox release \`$release\` (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.tag.outputs.release }}
        run: |
          # Idempotent: re-running a failed release reuses the existing draft and
          # overwrites its assets (`gh release upload --clobber` below).
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            echo "reusing existing release $RELEASE"
            exit 0
          fi
          cat > notes.md <<EOF
          Artifacts for linux/amd64, linux/arm64 and darwin/arm64. Provision a
          Linux host with:

          \`\`\`sh
          arch=\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSLo sparkbox https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/sparkbox-linux-\$arch
          chmod +x sparkbox && sudo ./sparkbox setup --release ${RELEASE}
          \`\`\`

          \`sluice-linux-\$arch\` is the per-VM egress gateway (DNS allowlist +
          eBPF meter/enforcer). Add \`--sluice\` to the setup line above to
          have it installed, checksum-verified and enabled; without it every
          sandbox reaches the whole internet, which \`sparkbox doctor\` will
          tell you.

          \`sparkbox-darwin-arm64\` (Apple Silicon) ships alongside them, pinned
          by \`manifest-darwin-arm64.env\` to the same linux/arm64 artifacts it
          will provision into a nested machine. Host provisioning on macOS is
          still being built — until it lands, the Mac binary answers
          \`version\` and nothing else useful.

          \`vmlinux-macos-arm64\` is the outer KVM kernel the nested machine
          boots (Apple's stock machine kernel has none, so no nested virt).
          Its \`SHA256_OUTER_KERNEL\` in the darwin manifest says *this is the
          file we published* — verify your download against it. The accompanying
          \`${MACOS_KERNEL_ASSET}.manifest\` records the content cache key and
          exact builder image digest used to produce it.
          EOF
          gh release create "$RELEASE" --draft --target "$GITHUB_SHA" \
            --title "sparkbox $RELEASE" --notes-file notes.md

  # ------------------------------------------------------------------ image --
  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Depot OIDC trust relationship
    steps:
      - uses: actions/checkout@v4
      - uses: depot/setup-action@v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One Depot build produces both platforms (native builders, shared layer
      # cache) and pushes a single multi-arch tag. Each artifacts-matrix runner
      # then `docker pull`s that tag and gets its own arch's variant.
      - uses: depot/build-push-action@v1
        with:
          project: ${{ env.DEPOT_PROJECT }}
          context: tools/sparkbox/images
          platforms: linux/amd64,linux/arm64
          push: true
          # :latest only follows real releases — a dev prerelease must not become
          # what `docker pull …/universal` hands somebody.
          tags: |
            ${{ env.IMAGE_REPO }}:${{ needs.prepare.outputs.release }}
            ${{ needs.prepare.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE_REPO) || '' }}

  # -------------------------------------------------------------- artifacts --
  artifacts:
    needs: [prepare, image]
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false # let one arch finish even if the other trips; re-run the failed leg
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # free for public repos; native aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools/sparkbox
    steps:
      - uses: actions/checkout@v4

      # Both go.sums, because this job compiles BOTH modules: stage-artifacts.sh
      # builds tools/sparkbox and then tools/sluice. The toolchain is pinned by
      # sparkbox's go directive (1.25.x), which builds sluice's declared 1.24.7
      # fine — a newer toolchain compiling an older directive is the supported
      # direction — while listing only one go.sum would silently cache half the
      # dependency graph.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/sparkbox/go.mod
          cache-dependency-path: |
            tools/sparkbox/go.sum
            tools/sluice/go.sum

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      # Our lean image (~2-4GB) plus the ext4 it flattens into plus the .zst
      # still wants headroom beyond a stock runner's free disk. Shed the
      # preinstalled toolchains we don't use (we only need go/docker/curl).
      # Best-effort: paths vary across runner images and arches.
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /usr/share/miniconda /usr/lib/jvm \
            /usr/lib/google-cloud-sdk /opt/microsoft /usr/local/julia* \
            /usr/local/share/vcpkg /opt/az /usr/local/aws-cli \
            /usr/local/aws-sam-cli /usr/share/gradle* /opt/pipx || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      # Stage the release (ext4 + .zst) on /mnt when it's big enough — the
      # runner's second temp disk. Splitting staging from docker's
      # /var/lib/docker is what keeps a full build under each disk's ceiling;
      # one ENOSPC'd runner died so hard the agent couldn't write its own logs.
      - name: Pick the roomiest disk for staging
        run: |
          free_mnt=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)
          if [ "${free_mnt:-0}" -ge 30 ]; then
            sudo mkdir -p /mnt/stage && sudo chmod 1777 /mnt/stage
            echo "OUT_DIR=/mnt/stage/release" >> "$GITHUB_ENV"
            echo "staging on /mnt (${free_mnt}G free)"
          else
            echo "OUT_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
            echo "staging on / (/mnt only ${free_mnt:-0}G free)"
          fi
          df -h / /mnt 2>/dev/null || true

      - name: Download firecracker ${{ env.FIRECRACKER_VERSION }}
        run: |
          arch=$(uname -m)
          ver=${FIRECRACKER_VERSION}
          curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${ver}/firecracker-${ver}-${arch}.tgz" | tar xz
          sudo install "release-${ver}-${arch}/firecracker-${ver}-${arch}" /usr/local/bin/firecracker
          firecracker --version | head -1

      # The kernel is the slowest step (~15 min) and only changes when the
      # script, the config fragment, or KVER does — cache it per arch.
      - name: Cache guest kernel
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vmlinux
          key: guest-kernel-${{ matrix.arch }}-${{ env.KERNEL_VERSION }}-${{ hashFiles('tools/sparkbox/hack/build-kernel.sh', 'tools/sparkbox/hack/kernel-config.fragment') }}

      - name: Build sparkbox guest kernel (6.1 + docker/TUN deltas)
        # We ship our OWN kernel, not the stock firecracker-ci one: that config
        # lacks IP_NF_RAW/NF_TABLES (docker container networking) and TUN
        # (tailscale). build-kernel.sh = Firecracker CI 6.1 config + our
        # fragment, built natively for this runner's arch.
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          OUT="$RUNNER_TEMP/vmlinux" KVER="$KERNEL_VERSION" JOBS="$(nproc)" \
            ./hack/build-kernel.sh
          sha256sum "$RUNNER_TEMP/vmlinux"

      - name: Write fleet gateway public key
        env:
          GATEWAY_UPSTREAM_PUBKEY: ${{ vars.GATEWAY_UPSTREAM_PUBKEY }}
        run: |
          [ -n "$GATEWAY_UPSTREAM_PUBKEY" ] || { echo "vars.GATEWAY_UPSTREAM_PUBKEY is not set"; exit 1; }
          printf '%s\n' "$GATEWAY_UPSTREAM_PUBKEY" > "$RUNNER_TEMP/gateway_upstream_key.pub"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Stage ${{ matrix.arch }} artifacts
        env:
          RELEASE: ${{ needs.prepare.outputs.release }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ env.IMAGE_REPO }}:${{ needs.prepare.outputs.release }}
          PRUNE_IMAGE: "1"
          REPO_DIR: ${{ github.workspace }}
          KERNEL: ${{ runner.temp }}/vmlinux
          GATEWAY_PUBKEY_FILE: ${{ runner.temp }}/gateway_upstream_key.pub
        run: ./hack/stage-artifacts.sh

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          gh release upload "$RELEASE" "$OUT_DIR"/* --clobber
          {
            echo "### ${{ matrix.arch }} assets"
            ( cd "$OUT_DIR" && du -h -- * | awk '{print "- `"$2"` ("$1")"}' )
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------- macos-kernel --
  #
  # The macOS outer kernel is independent of a sparkbox release tag. Its cache
  # key covers the build script, config fragment, cache schema and the exact
  # toolchain image digest. Most releases therefore restore a verified OCI
  # bundle from GHCR instead of compiling the same bytes again.
  #
  # A genuine cache miss still proves -j invariance, but the -j3 and -j4 builds
  # run concurrently on separate native ARM runners. The final macos-kernel job
  # compares both files and configs before it publishes either one. Keeping that
  # final job name means darwin and publish have one success gate regardless of
  # whether the artifact was restored or freshly built.

  # Resolve (or create) the toolchain image first. The tag is derived from its
  # Dockerfile; the output consumed downstream is always the immutable digest.
  macos_kernel_builder:
    name: macOS kernel builder image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Depot OIDC trust relationship
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve builder inputs
        id: inputs
        run: tools/sparkbox/macos/kernel/build.sh --print-builder-args >> "$GITHUB_OUTPUT"

      - name: Look up the builder image
        id: lookup
        env:
          APPLE_CONFIG_SHA256: ${{ steps.inputs.outputs.APPLE_CONFIG_SHA256 }}
          APPLE_CONFIG_TAG: ${{ steps.inputs.outputs.APPLE_CONFIG_TAG }}
          APPLE_CONFIG_URL: ${{ steps.inputs.outputs.APPLE_CONFIG_URL }}
          DOCKERFILE_SHA: ${{ hashFiles('tools/sparkbox/macos/kernel/Dockerfile.builder') }}
          LINUX_SHA256: ${{ steps.inputs.outputs.LINUX_SHA256 }}
          LINUX_URL: ${{ steps.inputs.outputs.LINUX_URL }}
          LINUX_VERSION: ${{ steps.inputs.outputs.LINUX_VERSION }}
        run: |
          builder_key=$(
            printf '%s\n' \
              "$DOCKERFILE_SHA" \
              "$LINUX_VERSION" "$LINUX_URL" "$LINUX_SHA256" \
              "$APPLE_CONFIG_TAG" "$APPLE_CONFIG_URL" "$APPLE_CONFIG_SHA256" \
              | sha256sum | cut -d' ' -f1
          )
          tag="${MACOS_KERNEL_BUILDER_REPO}:${builder_key}"
          digest=$(
            docker buildx imagetools inspect "$tag" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'
          ) || true
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "using existing builder $tag@$digest"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "builder image not found: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: depot/setup-action@v1
        if: steps.lookup.outputs.hit != 'true'

      - name: Build the ARM64 builder image
        id: build
        if: steps.lookup.outputs.hit != 'true'
        uses: depot/build-push-action@v1
        with:
          project: ${{ env.DEPOT_PROJECT }}
          context: tools/sparkbox/macos/kernel
          file: tools/sparkbox/macos/kernel/Dockerfile.builder
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.lookup.outputs.tag }}
          build-args: |
            LINUX_VERSION=${{ steps.inputs.outputs.LINUX_VERSION }}
            LINUX_URL=${{ steps.inputs.outputs.LINUX_URL }}
            LINUX_SHA256=${{ steps.inputs.outputs.LINUX_SHA256 }}
            APPLE_CONFIG_TAG=${{ steps.inputs.outputs.APPLE_CONFIG_TAG }}
            APPLE_CONFIG_URL=${{ steps.inputs.outputs.APPLE_CONFIG_URL }}
            APPLE_CONFIG_SHA256=${{ steps.inputs.outputs.APPLE_CONFIG_SHA256 }}

      - name: Pin the builder by digest
        id: resolve
        env:
          HIT: ${{ steps.lookup.outputs.hit }}
          CACHED_DIGEST: ${{ steps.lookup.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$HIT" = true ]; then
            digest="$CACHED_DIGEST"
          else
            digest="$BUILT_DIGEST"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "invalid builder digest: $digest" >&2; exit 1; }
          image="${MACOS_KERNEL_BUILDER_REPO}@${digest}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "builder: $image"

  # The cache is a normal OCI image rather than actions/cache: Actions caches
  # are ref-scoped, so a cache written by v0.5.0 is not reusable by v0.5.1.
  macos_kernel_plan:
    name: Plan macOS kernel
    needs: macos_kernel_builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      cache_hit: ${{ steps.key.outputs.cache_hit }}
      cache_key: ${{ steps.key.outputs.cache_key }}
      cache_ref: ${{ steps.key.outputs.cache_ref }}
      cache_tag: ${{ steps.key.outputs.cache_tag }}
      previous_ref: ${{ steps.key.outputs.previous_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve the content-addressed kernel
        id: key
        env:
          BUILDER_IMAGE: ${{ needs.macos_kernel_builder.outputs.image }}
          FORCE_REBUILD: ${{ inputs.kernel_repro_check && 'true' || 'false' }}
          KERNEL_FILES_SHA: ${{ hashFiles('tools/sparkbox/macos/kernel/build.sh', 'tools/sparkbox/macos/kernel/sparkbox-arm64.fragment') }}
        run: |
          cache_key=$(
            printf '%s\n' \
              "$MACOS_KERNEL_CACHE_SCHEMA" \
              "linux/arm64" \
              "$MACOS_KERNEL_VERSION" \
              "$BUILDER_IMAGE" \
              "$KERNEL_FILES_SHA" \
              | sha256sum | cut -d' ' -f1
          )
          cache_tag="${MACOS_KERNEL_CACHE_REPO}:${cache_key}"
          digest=$(
            docker buildx imagetools inspect "$cache_tag" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'
          ) || true
          previous_ref=
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            previous_ref="${MACOS_KERNEL_CACHE_REPO}@${digest}"
          fi
          if [[ "${FORCE_REBUILD:-false}" != "true" && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            cache_hit=true
            cache_ref="$previous_ref"
            echo "kernel cache hit: $cache_ref"
          else
            cache_hit=false
            cache_ref="$cache_tag"
            if [[ "${FORCE_REBUILD:-false}" == "true" ]]; then
              echo "kernel cache bypass requested: $cache_tag"
            else
              echo "kernel cache miss: $cache_tag"
            fi
          fi
          {
            echo "cache_hit=$cache_hit"
            echo "cache_key=$cache_key"
            echo "cache_ref=$cache_ref"
            echo "cache_tag=$cache_tag"
            echo "previous_ref=$previous_ref"
          } >> "$GITHUB_OUTPUT"

  macos_kernel_build:
    name: macOS kernel build (-j${{ matrix.jobs }})
    needs: [macos_kernel_builder, macos_kernel_plan]
    if: needs.macos_kernel_plan.outputs.cache_hit != 'true'
    strategy:
      fail-fast: false
      matrix:
        jobs: [3, 4]
    runs-on: ubuntu-24.04-arm # native aarch64; cross builds differ by design
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: tools/sparkbox
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build at -j${{ matrix.jobs }}
        env:
          SPARKBOX_CONTAINER_CMD: docker
          SPARKBOX_KERNEL_BUILD_IMAGE: ${{ needs.macos_kernel_builder.outputs.image }}
          SPARKBOX_KERNEL_INPUTS_IN_IMAGE: "1"
          SPARKBOX_KERNEL_BUILD_JOBS: ${{ matrix.jobs }}
          SPARKBOX_KERNEL_REPRO_CHECK: "0"
        run: ./macos/kernel/build.sh

      - name: Preserve build for comparison
        uses: actions/upload-artifact@v4
        with:
          name: macos-kernel-j${{ matrix.jobs }}
          # upload-artifact uses the least common ancestor (macos/out) as the
          # archive root, so these three files are restored at artifact root.
          path: |
            tools/sparkbox/macos/out/vmlinux-kvm
            tools/sparkbox/macos/out/kernel.config
            tools/sparkbox/macos/out/kernel-manifest.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  macos-kernel:
    name: macos-kernel
    needs: [prepare, macos_kernel_builder, macos_kernel_plan, macos_kernel_build]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.macos_kernel_builder.result == 'success' &&
      needs.macos_kernel_plan.result == 'success' &&
      (
        needs.macos_kernel_plan.outputs.cache_hit == 'true' ||
        needs.macos_kernel_build.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: tools/sparkbox
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Restore the verified kernel bundle
        if: needs.macos_kernel_plan.outputs.cache_hit == 'true'
        env:
          CACHE_REF: ${{ needs.macos_kernel_plan.outputs.cache_ref }}
        run: |
          mkdir -p macos/out
          docker pull "$CACHE_REF"
          container_id=$(docker create "$CACHE_REF")
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/vmlinux-kvm" macos/out/vmlinux-kvm
          docker cp "$container_id:/kernel.config" macos/out/kernel.config
          docker cp "$container_id:/kernel-manifest.txt" macos/out/kernel-manifest.txt
          docker rm "$container_id" >/dev/null
          trap - EXIT

      - name: Download both fresh builds
        if: needs.macos_kernel_plan.outputs.cache_hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: macos-kernel-j*
          path: ${{ runner.temp }}/macos-kernel-builds
          # Keep one named directory per build so -j3 and -j4 cannot overwrite
          # each other. Each directory contains the three files at its root.
          merge-multiple: false

      - name: Compare fresh builds
        if: needs.macos_kernel_plan.outputs.cache_hit != 'true'
        env:
          BUILD_ROOT: ${{ runner.temp }}/macos-kernel-builds
          CACHE_KEY: ${{ needs.macos_kernel_plan.outputs.cache_key }}
        run: |
          j3="$BUILD_ROOT/macos-kernel-j3"
          j4="$BUILD_ROOT/macos-kernel-j4"
          for dir in "$j3" "$j4"; do
            test -s "$dir/vmlinux-kvm"
            test -s "$dir/kernel.config"
            test -s "$dir/kernel-manifest.txt"
          done
          cmp "$j3/vmlinux-kvm" "$j4/vmlinux-kvm"
          cmp "$j3/kernel.config" "$j4/kernel.config"
          cmp "$j3/kernel-manifest.txt" "$j4/kernel-manifest.txt"
          mkdir -p macos/out
          cp "$j4/vmlinux-kvm" macos/out/vmlinux-kvm
          cp "$j4/kernel.config" macos/out/kernel.config
          cp "$j4/kernel-manifest.txt" macos/out/kernel-manifest.txt
          sed -i 's/^repro_checked=.*/repro_checked=j3+j4/' \
            macos/out/kernel-manifest.txt
          printf 'cache_key=%s\n' "$CACHE_KEY" >> macos/out/kernel-manifest.txt
          echo "identical across independent -j3 and -j4 builds"
          sha256sum macos/out/vmlinux-kvm

      # workflow_dispatch can force a cold rebuild of an existing key. In that
      # case "content addressed" is enforced, not merely asserted: the fresh
      # result must also match the bundle already stored under that key.
      - name: Compare a forced rebuild with the existing cache
        if: >-
          needs.macos_kernel_plan.outputs.cache_hit != 'true' &&
          needs.macos_kernel_plan.outputs.previous_ref != ''
        env:
          PREVIOUS_REF: ${{ needs.macos_kernel_plan.outputs.previous_ref }}
        run: |
          previous="$RUNNER_TEMP/previous-kernel"
          mkdir -p "$previous"
          docker pull "$PREVIOUS_REF"
          container_id=$(docker create "$PREVIOUS_REF")
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/vmlinux-kvm" "$previous/vmlinux-kvm"
          docker cp "$container_id:/kernel.config" "$previous/kernel.config"
          docker cp "$container_id:/kernel-manifest.txt" "$previous/kernel-manifest.txt"
          docker rm "$container_id" >/dev/null
          trap - EXIT
          cmp macos/out/vmlinux-kvm "$previous/vmlinux-kvm"
          cmp macos/out/kernel.config "$previous/kernel.config"
          cmp macos/out/kernel-manifest.txt "$previous/kernel-manifest.txt"
          echo "forced rebuild matches existing content cache"

      - name: Verify the selected kernel bundle
        env:
          BUILDER_IMAGE: ${{ needs.macos_kernel_builder.outputs.image }}
          CACHE_KEY: ${{ needs.macos_kernel_plan.outputs.cache_key }}
        run: |
          manifest=macos/out/kernel-manifest.txt
          kernel_sha=$(sha256sum macos/out/vmlinux-kvm | cut -d' ' -f1)
          config_sha=$(sha256sum macos/out/kernel.config | cut -d' ' -f1)
          grep -Fqx "cache_key=$CACHE_KEY" "$manifest"
          grep -Fqx "kernel_build_image=$BUILDER_IMAGE" "$manifest"
          grep -Fqx "kernel_sha256=$kernel_sha" "$manifest"
          grep -Fqx "config_sha256=$config_sha" "$manifest"
          grep -Fqx "repro_checked=j3+j4" "$manifest"
          cat "$manifest"

      - name: Publish the content-addressed cache
        if: needs.macos_kernel_plan.outputs.cache_hit != 'true'
        env:
          CACHE_TAG: ${{ needs.macos_kernel_plan.outputs.cache_tag }}
        run: |
          docker build \
            --file macos/kernel/Dockerfile.cache \
            --tag "$CACHE_TAG" \
            macos/out
          docker push "$CACHE_TAG"
          digest=$(
            docker buildx imagetools inspect "$CACHE_TAG" \
              --format '{{json .Manifest.Digest}}' | tr -d '"'
          )
          echo "published kernel cache ${MACOS_KERNEL_CACHE_REPO}@${digest}"

      - name: Report what this release ships
        env:
          CACHE_HIT: ${{ needs.macos_kernel_plan.outputs.cache_hit }}
          CACHE_KEY: ${{ needs.macos_kernel_plan.outputs.cache_key }}
        run: |
          manifest=macos/out/kernel-manifest.txt
          sha=$(sha256sum macos/out/vmlinux-kvm | cut -d' ' -f1)
          status=$(sed -n 's/^known_good_status=//p' "$manifest")
          repro=$(sed -n 's/^repro_checked=//p' "$manifest")
          {
            echo "### macOS outer kernel"
            echo "- \`${MACOS_KERNEL_ASSET}\` sha256 \`${sha}\`"
            echo "- content cache hit: \`${CACHE_HIT}\`"
            echo "- content cache key: \`${CACHE_KEY}\`"
            echo "- producing determinism check: \`${repro}\`"
            echo "- vs the recorded known-good build: \`${status}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = drift ]; then
            echo "::warning title=macOS kernel drifted from the known-good build::sha256 $sha; inspect the pinned builder and update KNOWN_GOOD_KERNEL_SHA256 in macos/kernel/build.sh"
          fi

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          cp macos/out/vmlinux-kvm "$RUNNER_TEMP/$MACOS_KERNEL_ASSET"
          cp macos/out/kernel.config "$RUNNER_TEMP/$MACOS_KERNEL_ASSET.config"
          cp macos/out/kernel-manifest.txt "$RUNNER_TEMP/$MACOS_KERNEL_ASSET.manifest"
          gh release upload "$RELEASE" \
            "$RUNNER_TEMP/$MACOS_KERNEL_ASSET" \
            "$RUNNER_TEMP/$MACOS_KERNEL_ASSET.config" \
            "$RUNNER_TEMP/$MACOS_KERNEL_ASSET.manifest" --clobber

  # ----------------------------------------------------------------- darwin --
  #
  # Its OWN job, not a third leg of the artifacts matrix. Every step of that
  # matrix exists to produce things a Mac does not want: ~15 minutes compiling a
  # guest kernel, a multi-GB image pull, a loop-mounted ext4, zstd, firecracker,
  # the fleet gateway pubkey, and the disk gymnastics that keep all of it under
  # a runner's ceiling. A darwin leg would have needed an `if:` guard on eight
  # of those steps — the kind of guard that rots the first time somebody edits
  # the matrix — or would have burned a full arm64 runner to emit a 20MB static
  # binary. Here it is one `go build` on the cheapest runner there is.
  #
  # `needs: artifacts` because the darwin manifest is DERIVED from the linux
  # arm64 one rather than recomputing the shas it shares with it, so it cannot
  # be written until that leg has uploaded. The dependency buys the guarantee
  # that a Mac and the machine it provisions cannot disagree about a tag.
  #
  # `needs: macos-kernel` for the same reason, one level further out: the
  # manifest records SHA256_OUTER_KERNEL, and it is computed over the file that
  # actually landed on the release rather than over a local copy, so the
  # checksum a Mac verifies against is a checksum of the bytes it will receive.
  #
  # Intel Macs are deliberately not built — see the long note in
  # hack/stage-darwin-artifacts.sh. A darwin/amd64 binary is one more `go
  # build`, but macOS host provisioning needs Apple Silicon nested virt, so it
  # would be a download whose every useful path exits non-zero.
  darwin:
    needs: [prepare, artifacts, macos-kernel]
    # macos-kernel deliberately depends on a conditionally skipped build job
    # when its content-addressed cache hits. GitHub propagates that skipped
    # ancestor through later `needs` chains unless this job evaluates an
    # explicit status condition, even though macos-kernel itself succeeded.
    # `always()` breaks the implicit success() guard; the result checks keep the
    # release fail-closed if any of the direct prerequisites actually failed.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.artifacts.result == 'success' &&
      needs.macos-kernel.result == 'success'
    # GOOS=darwin cross-compiles from anywhere, and a macos runner bills at a
    # 10x multiplier for a build that needs nothing from macOS. The trade is
    # CGO_ENABLED=0 (cgo would want the macOS SDK) — which is what every linux
    # asset already ships as anyway.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/sparkbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/sparkbox/go.mod
          cache-dependency-path: tools/sparkbox/go.sum

      # The draft is not public, but the token that opened it can read it back.
      # Both inputs are pulled back OFF the release rather than rebuilt or
      # passed between jobs: what gets checksummed into the darwin manifest is
      # then, by construction, the bytes a Mac will actually download.
      - name: Fetch this release's linux/arm64 manifest and the macOS kernel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          mkdir -p "$RUNNER_TEMP/guest"
          gh release download "$RELEASE" --pattern manifest-arm64.env \
            --dir "$RUNNER_TEMP/guest" --clobber
          cat "$RUNNER_TEMP/guest/manifest-arm64.env"
          gh release download "$RELEASE" --pattern "$MACOS_KERNEL_ASSET" \
            --dir "$RUNNER_TEMP/guest" --clobber
          sha256sum "$RUNNER_TEMP/guest/$MACOS_KERNEL_ASSET"

      - name: Stage darwin/arm64 artifacts
        env:
          RELEASE: ${{ needs.prepare.outputs.release }}
          OUT_DIR: ${{ runner.temp }}/release-darwin
          GUEST_MANIFEST: ${{ runner.temp }}/guest/manifest-arm64.env
          OUTER_KERNEL_ASSET: ${{ env.MACOS_KERNEL_ASSET }}
          OUTER_KERNEL: ${{ runner.temp }}/guest/${{ env.MACOS_KERNEL_ASSET }}
          REPO_DIR: ${{ github.workspace }}
        run: ./hack/stage-darwin-artifacts.sh

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          OUT_DIR: ${{ runner.temp }}/release-darwin
        run: |
          gh release upload "$RELEASE" "$OUT_DIR"/* --clobber
          {
            echo "### darwin/arm64 assets"
            ( cd "$OUT_DIR" && du -h -- * | awk '{print "- `"$2"` ("$1")"}' )
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- publish --
  publish:
    # darwin is in `needs` on purpose: a release that goes live without it is
    # exactly the half-populated state the draft gate exists to prevent, and
    # /releases/latest/download/sparkbox-darwin-arm64 would 404 for anyone
    # following the notes. The cost of the coupling is that a broken darwin
    # build blocks the linux release — acceptable, because it is the same
    # compile go.yml already gates on every push, so it failing here means
    # something is broken for everybody, not just for Macs.
    #
    # macos-kernel is listed even though `darwin` already depends on it. The
    # redundancy is the point: this list is the definition of "the release is
    # complete", and it must not become wrong because somebody later decouples
    # the darwin manifest from the kernel.
    needs: [prepare, artifacts, darwin, macos-kernel]
    # Keep the final gate explicit for the same skipped-ancestor case handled
    # by darwin above. A cache hit is success; a failed or cancelled platform
    # job must still leave the release in draft.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.artifacts.result == 'success' &&
      needs.darwin.result == 'success' &&
      needs.macos-kernel.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # --latest is what makes /releases/latest/download/<asset> — the URL
          # `sparkbox setup` hits when it resolves "latest" — point here.
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE" --draft=false --prerelease=false --latest
          fi
          echo "### published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://github.com/$GH_REPO/releases/tag/$RELEASE" >> "$GITHUB_STEP_SUMMARY"
